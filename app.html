<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<!-- Client-side text extraction for attached PDF and DOCX files, so their
     content can be sent to the model instead of being marked unreadable. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="app-page">

<div class="app-shell">

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ── Sidebar ── -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-top">
      <a href="/index.html" class="sidebar-logo">
        <img src="/assets/cognita.png" alt="Cognita">
        <span>Cognita</span>
      </a>
      <div class="sidebar-top-actions">
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
          <i class="ph ph-sidebar-simple"></i>
        </button>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
          <i class="ph ph-x"></i>
        </button>
      </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <i class="ph ph-plus"></i>
      <span>New chat</span>
    </button>

    <nav class="sidebar-history" id="sidebarHistory" aria-label="Chat history">
      <!-- Populated by app.js from localStorage -->
    </nav>

    <div class="sidebar-bottom">
      <div class="usage-widget" id="usageWidget">
        <div class="usage-row">
          <span class="usage-label">Messages today</span>
          <span class="usage-value skeleton" id="usageMessages">00 / 00</span>
        </div>
        <div class="usage-bar"><div class="usage-bar-fill" id="usageMessagesBar"></div></div>
      </div>

      <a href="/pricing.html" class="upgrade-link" id="upgradeLink" hidden>
        <i class="ph ph-arrow-up-circle"></i>
        <span>Upgrade plan</span>
      </a>

      <button class="account-btn" id="accountBtn">
        <span class="account-avatar" id="accountAvatar">C</span>
        <span class="account-info">
          <span class="account-name skeleton" id="accountEmail">Loading</span>
          <span class="account-plan skeleton" id="accountPlan">Loading</span>
        </span>
        <i class="ph ph-dots-three-vertical account-menu-trigger"></i>
      </button>

      <div class="account-menu" id="accountMenu" hidden>
        <a href="/account.html"><i class="ph ph-gear"></i> Settings</a>
        <a href="/pricing.html"><i class="ph ph-arrow-up-circle"></i> Plans</a>
        <button id="logOutBtn"><i class="ph ph-sign-out"></i> Sign out</button>
      </div>
    </div>
  </aside>

  <!-- ── Main conversation area ── -->
  <main class="app-main">

    <header class="app-topbar">
      <button class="mobile-sidebar-btn" id="mobileSidebarBtn" aria-label="Open sidebar">
        <i class="ph ph-list"></i>
      </button>

      <h1 class="conversation-title" id="conversationTitle">New chat</h1>

      <div class="topbar-spacer"></div>
    </header>

    <div class="conversation" id="conversation">
      <div class="empty-state" id="emptyState">
        <img src="/assets/cognita.png" alt="" class="empty-state-mark">
        <h1 class="empty-state-title">What are you working on?</h1>
        <p class="empty-state-subtitle">Write, research, plan, or prepare a document — Cognita finishes the job, not just the reply.</p>

        <div class="suggestion-list">
          <button class="suggestion-row" data-prompt="Draft a professional email declining a meeting invitation while proposing an alternative time.">
            <i class="ph ph-envelope-simple"></i>
            <span>Draft an email</span>
          </button>
          <button class="suggestion-row" data-prompt="Explain the difference between correlation and causation with a simple example.">
            <i class="ph ph-lightbulb"></i>
            <span>Explain a concept</span>
          </button>
          <button class="suggestion-row" data-prompt="Create an outline for a business proposal for a new product launch.">
            <i class="ph ph-file-text"></i>
            <span>Outline a document</span>
          </button>
          <button class="suggestion-row" data-prompt="Give me three angles to analyse a decision about expanding into a new market.">
            <i class="ph ph-chart-line"></i>
            <span>Think through a decision</span>
          </button>
        </div>
      </div>

      <div class="message-list" id="messageList" hidden></div>
    </div>

    <div class="composer-wrap">

      <div class="composer" id="composer">
        <div class="composer-attachments" id="composerAttachments" hidden></div>

        <textarea
          id="composerInput"
          class="composer-input"
          placeholder="Message Cognita"
          rows="1"
          aria-label="Message Cognita"
        ></textarea>

        <div class="composer-tools-row">
          <div class="composer-tools-left">
            <div class="attach-menu" id="attachMenu">
              <button class="composer-tool-btn" id="attachMenuTrigger" aria-haspopup="true" aria-expanded="false" aria-label="Add attachment" title="Add photos, files, or generate a visual or document">
                <i class="ph ph-plus"></i>
              </button>
              <div class="attach-menu-list" id="attachMenuList" hidden>
                <button class="attach-menu-item" id="attachFilesItem" type="button">
                  <i class="ph ph-paperclip"></i>
                  <span>Add photos & files</span>
                </button>
                <button class="attach-menu-item" id="attachDiagramItem" type="button" data-kind="diagram">
                  <i class="ph ph-flow-arrow"></i>
                  <span>Create a diagram</span>
                </button>
                <button class="attach-menu-item" id="attachIllustrationItem" type="button" data-kind="illustration">
                  <i class="ph ph-image-square"></i>
                  <span>Create an illustration</span>
                </button>
                <button class="attach-menu-item" id="attachDocumentItem" type="button">
                  <i class="ph ph-file-doc"></i>
                  <span>Create a document</span>
                </button>
              </div>
            </div>
          </div>

          <div class="composer-tools-right">
            <div class="quality-picker" id="qualityPicker">
              <button class="quality-picker-trigger" id="qualityPickerTrigger" aria-haspopup="true" aria-expanded="false">
                <i class="ph ph-sliders-horizontal" id="qualityPickerIcon"></i>
                <span id="qualityPickerLabel">Standard</span>
                <i class="ph ph-caret-down quality-picker-caret"></i>
              </button>
              <div class="quality-picker-menu" id="qualityPickerMenu" hidden>
                <button class="quality-picker-option is-active" data-quality="standard">
                  <i class="ph ph-lightning"></i>
                  <span class="quality-picker-option-text">
                    <span class="quality-picker-option-name">Standard</span>
                    <span class="quality-picker-option-desc">Fast, everyday answers</span>
                  </span>
                  <i class="ph ph-check quality-picker-check"></i>
                </button>
                <button class="quality-picker-option" data-quality="advanced">
                  <i class="ph ph-brain"></i>
                  <span class="quality-picker-option-text">
                    <span class="quality-picker-option-name">Advanced</span>
                    <span class="quality-picker-option-desc">Better reasoning on harder tasks</span>
                  </span>
                  <i class="ph ph-check quality-picker-check"></i>
                </button>
                <button class="quality-picker-option" data-quality="thorough">
                  <i class="ph ph-magnifying-glass"></i>
                  <span class="quality-picker-option-text">
                    <span class="quality-picker-option-name">Thorough</span>
                    <span class="quality-picker-option-desc">Slower, most in-depth answers</span>
                  </span>
                  <i class="ph ph-check quality-picker-check"></i>
                </button>
              </div>
            </div>

            <button class="composer-send-btn" id="sendBtn" aria-label="Send message" disabled>
              <i class="ph ph-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>

      <p class="composer-hint">Cognita can make mistakes. Check important information.</p>
      <input type="file" id="fileInput" hidden accept=".txt,.csv,.pdf,.doc,.docx,text/plain,text/csv,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,image/webp,image/gif">
    </div>

  </main>
</div>

<!-- ── Visual generation modal (diagram / illustration) ── -->
<div class="modal-overlay" id="visualModal" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h2>Generate a visual</h2>
      <button class="modal-close-btn" id="visualModalClose" aria-label="Close">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <label class="modal-field">
        <span>What should it show?</span>
        <textarea id="visualPromptInput" rows="3" placeholder="e.g. the water cycle, a comparison of two pricing plans, a flowchart for onboarding"></textarea>
      </label>
      <div class="visual-type-toggle">
        <button class="visual-type-option is-active" data-kind="diagram">
          <i class="ph ph-flow-arrow"></i> Diagram
        </button>
        <button class="visual-type-option" data-kind="illustration">
          <i class="ph ph-image-square"></i> Illustration
        </button>
      </div>
      <button class="modal-submit-btn" id="visualSubmitBtn">
        <span class="btn-label">Generate</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </div>
  </div>
</div>

<!-- ── Document generation modal (letter / report / essay / memo) ── -->
<div class="modal-overlay" id="documentModal" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h2>Create a document</h2>
      <button class="modal-close-btn" id="documentModalClose" aria-label="Close">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <label class="modal-field">
        <span>What's it about?</span>
        <textarea id="documentTopicInput" rows="3" placeholder="e.g. a resignation letter for a marketing role, a report on Q3 sales performance"></textarea>
      </label>
      <div class="visual-type-toggle" id="documentTypeToggle">
        <button class="visual-type-option is-active" data-doctype="letter">Letter</button>
        <button class="visual-type-option" data-doctype="report">Report</button>
        <button class="visual-type-option" data-doctype="essay">Essay</button>
        <button class="visual-type-option" data-doctype="memo">Memo</button>
      </div>
      <button class="modal-submit-btn" id="documentSubmitBtn">
        <span class="btn-label">Generate</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </div>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script type="module" src="/js/app.js"></script>

</body>
</html>
