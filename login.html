<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
<div class="auth-shell">
  <a href="/index.html" class="auth-logo">
    <img src="/assets/cognita.png" alt="Cognita">
  </a>
  <div class="auth-header">
    <h1 class="auth-title">Your thinking,<br>right where you left it.</h1>
    <p class="auth-subtitle">Sign in to pick up the thread.</p>
  </div>
  <div class="auth-card">
    <button id="googleBtn" class="auth-btn auth-btn--google" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.69-3.87 2.69-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>
    <p id="googleError" class="field-error" aria-live="polite"></p>
    <div class="auth-divider"><span>or</span></div>
    <form id="loginForm" class="auth-form" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="email" autocomplete="email" required>
        <p id="emailError" class="field-error" aria-live="polite"></p>
      </label>
      <label class="auth-field">
        <div class="auth-field-row">
          <span>Password</span>
          <button type="button" id="forgotBtn" class="auth-link-btn">Forgot password?</button>
        </div>
        <input type="password" id="password" autocomplete="current-password" required>
        <p id="passwordError" class="field-error" aria-live="polite"></p>
      </label>
      <button type="submit" class="auth-btn auth-btn--primary" id="submitBtn">
        <span class="btn-label">Sign in</span>
        <span class="btn-spinner" hidden></span>
      </button>
      <p id="generalError" class="auth-btn-error" aria-live="polite"></p>
    </form>
  </div>
  <p class="auth-switch">
    Don't have an account? <a href="/signup.html">Create one</a>
  </p>
</div>
<script type="module">
  import { Auth } from '/js/auth.js';
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const forgotBtn = document.getElementById('forgotBtn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const errorEls = {
    email: document.getElementById('emailError'),
    password: document.getElementById('passwordError'),
    google: document.getElementById('googleError'),
    general: document.getElementById('generalError'),
  };

  function clearErrors() {
    Object.values(errorEls).forEach((el) => { el.textContent = ''; });
  }

  function showError(error) {
    clearErrors();
    const { field, message } = Auth.classifyAuthError(error);
    (errorEls[field] || errorEls.general).textContent = message;
  }

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.querySelector('.btn-label').hidden = isLoading;
    submitBtn.querySelector('.btn-spinner').hidden = !isLoading;
  }

  emailInput.addEventListener('input', () => {
    emailInput.classList.remove('is-invalid');
    errorEls.email.textContent = '';
  });

  try {
    await Auth.ready();
    if (Auth.getCurrentUser()) {
      window.location.href = '/app.html';
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email = emailInput.value.trim();
      if (!Auth.isValidEmail(email)) {
        emailInput.classList.add('is-invalid');
        errorEls.email.textContent = 'Enter a valid email address.';
        return;
      }
      if (!passwordInput.value) {
        errorEls.password.textContent = 'Enter your password.';
        return;
      }

      setLoading(true);
      try {
        await Auth.signInWithEmail(email, passwordInput.value);
        window.location.href = '/app.html';
      } catch (err) {
        showError(err);
        setLoading(false);
      }
    });
    googleBtn.addEventListener('click', async () => {
      clearErrors();
      try {
        await Auth.signInWithGoogle();
        window.location.href = '/app.html';
      } catch (err) {
        showError(err);
      }
    });
    forgotBtn.addEventListener('click', async () => {
      clearErrors();
      const email = emailInput.value.trim();
      if (!email) {
        errorEls.email.textContent = 'Enter your email above first, then tap "Forgot password?" again.';
        return;
      }
      if (!Auth.isValidEmail(email)) {
        emailInput.classList.add('is-invalid');
        errorEls.email.textContent = 'Enter a valid email address.';
        return;
      }
      try {
        await Auth.resetPassword(email);
        errorEls.general.style.color = 'var(--accent)';
        errorEls.general.textContent = 'Password reset email sent to ' + email + '.';
      } catch (err) {
        showError(err);
      }
    });
  } catch (initErr) {
    console.error('Auth initialization failed:', initErr);
    errorEls.general.textContent = 'Unable to load authentication. Please refresh the page.';
  }
</script>
</body>
</html>
