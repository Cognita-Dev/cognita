<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
<div class="auth-shell">
  <a href="/index.html" class="auth-logo">
    <img src="/assets/cognita.png" alt="Cognita">
  </a>
  <div class="auth-header">
    <h1 class="auth-title">Your thinking,<br>right where you left it.</h1>
    <p class="auth-subtitle">Sign in to pick up the thread.</p>
  </div>
  <div class="auth-card">
    <button id="googleBtn" class="auth-btn auth-btn--google" type="button">
      <span class="google-btn-content">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.69-3.87 2.69-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </span>
      <span class="google-loader" hidden aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
    <p id="googleError" class="field-error" aria-live="polite"></p>
    <button id="facebookBtn" class="auth-btn auth-btn--google" type="button">
      <span class="google-btn-content">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.9v-6.3H5.3V9h2.3V6.9c0-2.3 1.4-3.6 3.5-3.6.7 0 1.5.1 2.2.2v2.4h-1.2c-1.2 0-1.5.7-1.5 1.5V9h2.6l-.4 2.6h-2.2v6.3A9 9 0 0 0 18 9Z"/>
        </svg>
        <span>Continue with Facebook</span>
      </span>
      <span class="google-loader" hidden aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
    <p id="facebookError" class="field-error" aria-live="polite"></p>
    <div class="auth-divider"><span>or</span></div>
    <form id="loginForm" class="auth-form" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="email" autocomplete="email" required>
        <p id="emailError" class="field-error" aria-live="polite"></p>
      </label>
      <label class="auth-field">
        <div class="auth-field-row">
          <span>Password</span>
          <button type="button" id="forgotBtn" class="auth-link-btn">Forgot password?</button>
        </div>
        <div class="auth-password-wrap">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" id="passwordToggle" class="auth-password-toggle" data-state="hidden" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.6 6.6C3.7 8.5 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.4-.9"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
        <p id="passwordError" class="field-error" aria-live="polite"></p>
      </label>
      <button type="submit" class="auth-btn auth-btn--primary" id="submitBtn">
        <span class="btn-label">Sign in</span>
        <span class="btn-spinner" hidden></span>
      </button>
      <p id="generalError" class="auth-btn-error" aria-live="polite"></p>
    </form>
  </div>
  <p class="auth-switch">
    Don't have an account? <a href="/signup.html">Create one</a>
  </p>
</div>
<script type="module">
  import { Auth } from '/js/auth.js';
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const facebookBtn = document.getElementById('facebookBtn');
  const forgotBtn = document.getElementById('forgotBtn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const passwordToggle = document.getElementById('passwordToggle');

  const WORKER_URL = 'https://api.cognita.com.ng';

  const params = new URLSearchParams(window.location.search);
  const planId = params.get('plan');
  // "next" is an explicit "come back to this exact page" instruction
  // (set by protected pages when they send someone here, and by
  // bootstrap.html). Auth.getSafeNextPath only accepts a same-site path —
  // never an absolute URL, "//host", or "/\\host" trick — so a crafted link
  // can't send a signed-in person to another site.
  const nextPath = Auth.getSafeNextPath(params.get('next'));
  const isSafeNextPath = !!nextPath;
  const sessionEnded = params.get('reason') === 'signed_out';

  // Only auto-route to the admin dashboard when there's no explicit
  // destination already requested (next or plan) — those instructions
  // win regardless of whether the signed-in account happens to be staff.
  async function resolvePostAuthDestination(user) {
    const fallback = isSafeNextPath
      ? nextPath
      : (planId ? '/payment.html?plan=' + encodeURIComponent(planId) : '/app.html');

    // An email/password account that never finished verifying gets sent
    // there first, no matter what it was originally headed for — carrying
    // that destination along so verify-email.html can forward it on once
    // confirmed. Checked before the admin/whoami lookup below since that
    // call is now rejected for an unverified account anyway. Takes the
    // just-resolved `user` directly rather than Auth.getCurrentUser() —
    // right after signInWithEmail()/signInWithGoogle() resolve, the
    // module's cached "current user" can still be a beat behind (it
    // updates via Firebase's own onAuthStateChanged callback, which isn't
    // guaranteed to have run yet), and reading it here could momentarily
    // treat an already-verified Google account as unverified.
    if (user && Auth.needsEmailVerification(user)) {
      return '/verify-email.html?next=' + encodeURIComponent(fallback);
    }

    if (isSafeNextPath) return nextPath;
    if (planId) return '/payment.html?plan=' + encodeURIComponent(planId);

    try {
      const res = await Auth.authedFetch(WORKER_URL + '/api/admin/whoami');
      if (res.ok) return '/admin.html';
    } catch (e) {
      // Network hiccup checking staff status shouldn't block a normal
      // sign-in — fall through to the default destination.
      console.error('[login] staff check failed, defaulting to /app.html:', e.message);
    }

    return '/app.html';
  }

  // Preserve the intended destination (next) or plan when bouncing to
  // the signup page instead, so someone who lands here without an
  // account yet doesn't lose where they were headed.
  const signupLink = document.querySelector('.auth-switch a[href="/signup.html"]');
  if (signupLink) {
    if (isSafeNextPath) {
      signupLink.href = '/signup.html?next=' + encodeURIComponent(nextPath);
    } else if (planId) {
      signupLink.href = '/signup.html?plan=' + encodeURIComponent(planId);
    }
  }

  const errorEls = {
    email: document.getElementById('emailError'),
    password: document.getElementById('passwordError'),
    google: document.getElementById('googleError'),
    facebook: document.getElementById('facebookError'),
    general: document.getElementById('generalError'),
  };

  function clearErrors() {
    Object.values(errorEls).forEach((el) => { el.textContent = ''; });
  }

  function showError(error) {
    clearErrors();
    const { field, message } = Auth.classifyAuthError(error);
    (errorEls[field] || errorEls.general).textContent = message;
  }

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.querySelector('.btn-label').hidden = isLoading;
    submitBtn.querySelector('.btn-spinner').hidden = !isLoading;
  }

  function setGoogleLoading(isLoading) {
    googleBtn.disabled = isLoading;
    googleBtn.querySelector('.google-btn-content').hidden = isLoading;
    googleBtn.querySelector('.google-loader').hidden = !isLoading;
  }

  function setFacebookLoading(isLoading) {
    facebookBtn.disabled = isLoading;
    facebookBtn.querySelector('.google-btn-content').hidden = isLoading;
    facebookBtn.querySelector('.google-loader').hidden = !isLoading;
  }

  emailInput.addEventListener('input', () => {
    emailInput.classList.remove('is-invalid');
    errorEls.email.textContent = '';
  });

  // Registered immediately, independent of Auth/network readiness.
  passwordToggle.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    passwordToggle.dataset.state = isHidden ? 'visible' : 'hidden';
    passwordToggle.setAttribute('aria-pressed', String(isHidden));
    passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  if (sessionEnded) {
    errorEls.general.style.color = 'var(--accent)';
    errorEls.general.textContent = 'You were signed out. Please sign in again to continue.';
  }

  // ── Handlers are registered IMMEDIATELY, before we wait for anything ──
  // If the form were wired only after auth finished starting up, a fast
  // tap on "Sign in" would fall through to the browser's native form
  // submit, which reloads the page and puts the email AND password in the
  // address bar / history.
  let signingIn = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (signingIn) return;
    clearErrors();

    const email = emailInput.value.trim();
    if (!Auth.isValidEmail(email)) {
      emailInput.classList.add('is-invalid');
      errorEls.email.textContent = 'Enter a valid email address.';
      return;
    }
    if (!passwordInput.value) {
      errorEls.password.textContent = 'Enter your password.';
      return;
    }

    signingIn = true;
    setLoading(true);
    try {
      const signedInUser = await Auth.signInWithEmail(email, passwordInput.value);
      window.location.replace(await resolvePostAuthDestination(signedInUser));
    } catch (err) {
      showError(err);
      setLoading(false);
      signingIn = false;
    }
  });

  googleBtn.addEventListener('click', async () => {
    if (signingIn) return;
    clearErrors();
    signingIn = true;
    setGoogleLoading(true);
    try {
      const googleUser = await Auth.signInWithGoogle();
      // The redirect below is what actually leaves this page — until
      // then keep the loader running so the button doesn't look stalled
      // or clickable again.
      window.location.replace(await resolvePostAuthDestination(googleUser));
    } catch (err) {
      setGoogleLoading(false);
      showError(err);
      signingIn = false;
    }
  });

  facebookBtn.addEventListener('click', async () => {
    if (signingIn) return;
    clearErrors();
    signingIn = true;
    setFacebookLoading(true);
    try {
      const fbUser = await Auth.signInWithFacebook();
      window.location.replace(await resolvePostAuthDestination(fbUser));
    } catch (err) {
      setFacebookLoading(false);
      showError(err);
      signingIn = false;
    }
  });

  forgotBtn.addEventListener('click', async () => {
    clearErrors();
    const email = emailInput.value.trim();
    if (!email) {
      errorEls.email.textContent = 'Enter your email above first, then tap "Forgot password?" again.';
      return;
    }
    if (!Auth.isValidEmail(email)) {
      emailInput.classList.add('is-invalid');
      errorEls.email.textContent = 'Enter a valid email address.';
      return;
    }
    try {
      await Auth.resetPassword(email);
      errorEls.general.style.color = 'var(--accent)';
      errorEls.general.textContent = 'Password reset email sent to ' + email + '.';
    } catch (err) {
      showError(err);
    }
  });

  // If this browser already has a valid saved login, skip the form.
  // Waits for Firebase to actually answer (no guessing on slow networks).
  // Not awaited at top level, so the form above works the whole time.
  Auth.ready().then(async (user) => {
    if (user && !signingIn) {
      signingIn = true;
      window.location.replace(await resolvePostAuthDestination(user));
    }
  }).catch((initErr) => {
    console.error('Auth initialization failed:', initErr);
    errorEls.general.textContent = 'Unable to load authentication. Please refresh the page.';
  });
</script>
</body>
</html>
