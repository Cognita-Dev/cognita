<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create your account — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
<div class="auth-shell">
  <a href="/index.html" class="auth-logo">
    <img src="/assets/cognita.png" alt="Cognita">
  </a>
  <div class="auth-header">
    <h1 class="auth-title">Start with a blank page<br>and a sharp mind.</h1>
    <p class="auth-subtitle">Cognita helps you think it through.</p>
  </div>
  <div class="auth-card">
    <button id="googleBtn" class="auth-btn auth-btn--google" type="button">
      <span class="google-btn-content">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.69-3.87 2.69-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </span>
      <span class="google-loader" hidden aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </button>
    <p id="googleError" class="field-error" aria-live="polite"></p>
    <div class="auth-divider"><span>or</span></div>
    <form id="signupForm" class="auth-form" novalidate>
      <label class="auth-field">
        <span>What should we call you?</span>
        <input type="text" id="fullName" autocomplete="name" required>
        <p id="nameError" class="field-error" aria-live="polite"></p>
      </label>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="email" autocomplete="email" required>
        <p id="emailError" class="field-error" aria-live="polite"></p>
      </label>
      <label class="auth-field">
        <span>Password</span>
        <div class="auth-password-wrap">
          <input type="password" id="password" autocomplete="new-password" minlength="8" required>
          <button type="button" id="passwordToggle" class="auth-password-toggle" data-state="hidden" aria-label="Show password" aria-pressed="false">
            <!-- Both icons are inline SVG, not an external icon font — the
                 toggle can never render as a blank/invisible button
                 waiting on a CDN that might be slow or blocked. Visibility
                 between the two is controlled purely by CSS via the
                 button's data-state attribute (see auth.css). -->
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.6 6.6C3.7 8.5 1.5 12 1.5 12s3.5 7 10.5 7a10.6 10.6 0 0 0 4.4-.9"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
        <div class="strength-meter">
          <div class="strength-meter-head">
            <div class="strength-track">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
          <ul class="strength-checklist" id="strengthChecklist">
            <li data-check="length">8+ characters</li>
            <li data-check="lower">Lowercase letter</li>
            <li data-check="upper">Uppercase letter</li>
            <li data-check="number">Number</li>
            <li data-check="special" class="is-optional">Special character (optional)</li>
          </ul>
        </div>
        <p id="passwordError" class="field-error" aria-live="polite"></p>
      </label>
      <button type="submit" class="auth-btn auth-btn--primary" id="submitBtn">
        <span class="btn-label">Create account</span>
        <span class="btn-spinner" hidden></span>
      </button>
      <p id="generalError" class="auth-btn-error" aria-live="polite"></p>
    </form>
  </div>
  <p class="auth-switch">
    Already have an account? <a href="/login.html">Sign in</a>
  </p>
  <p class="auth-legal">
    By continuing, you agree to Cognita's
    <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.
  </p>
</div>
<script type="module">
  import { Auth } from '/js/auth.js';
  const form = document.getElementById('signupForm');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const nameInput = document.getElementById('fullName');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const passwordToggle = document.getElementById('passwordToggle');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');
  const strengthChecklist = document.getElementById('strengthChecklist');

  const WORKER_URL = 'https://cognita.cognitai.workers.dev';

  const params = new URLSearchParams(window.location.search);
  const planId = params.get('plan');
  // Same-site paths only (see Auth.getSafeNextPath in js/auth.js).
  const nextPath = Auth.getSafeNextPath(params.get('next'));
  const isSafeNextPath = !!nextPath;

  // A brand-new signup will essentially never be staff, but this stays
  // consistent with login.html's logic in case someone reaches signup
  // while already signed in under a staff account (Auth.getCurrentUser()
  // check below) with no explicit next/plan.
  async function resolvePostAuthDestination() {
    if (isSafeNextPath) return nextPath;
    if (planId) return '/payment.html?plan=' + encodeURIComponent(planId);

    try {
      const res = await Auth.authedFetch(WORKER_URL + '/api/admin/whoami');
      if (res.ok) return '/admin.html';
    } catch (e) {
      console.error('[signup] staff check failed, defaulting to /app.html:', e.message);
    }

    return '/app.html';
  }

  // Preserve the intended destination (next) or plan when bouncing to
  // the login page instead.
  const loginLink = document.querySelector('.auth-switch a[href="/login.html"]');
  if (loginLink) {
    if (isSafeNextPath) {
      loginLink.href = '/login.html?next=' + encodeURIComponent(nextPath);
    } else if (planId) {
      loginLink.href = '/login.html?plan=' + encodeURIComponent(planId);
    }
  }

  const errorEls = {
    name: document.getElementById('nameError'),
    email: document.getElementById('emailError'),
    password: document.getElementById('passwordError'),
    google: document.getElementById('googleError'),
    general: document.getElementById('generalError'),
  };

  function clearErrors() {
    Object.values(errorEls).forEach((el) => { el.textContent = ''; });
  }

  function showError(error) {
    clearErrors();
    const { field, message } = Auth.classifyAuthError(error);
    (errorEls[field] || errorEls.general).textContent = message;
  }

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.querySelector('.btn-label').hidden = isLoading;
    submitBtn.querySelector('.btn-spinner').hidden = !isLoading;
  }

  function setGoogleLoading(isLoading) {
    googleBtn.disabled = isLoading;
    googleBtn.querySelector('.google-btn-content').hidden = isLoading;
    googleBtn.querySelector('.google-loader').hidden = !isLoading;
  }

  let nameValid = false;
  let emailValid = false;
  let passwordValid = false;

  // The submit button stays enabled regardless of field validity now —
  // clicking it with something missing/invalid runs the same inline
  // error path as before, it just also happens on a direct click. This
  // follows NN/g's guidance against disabling submit buttons: a
  // disabled button doesn't tell an unsure user *why* it isn't
  // responding, so they're left guessing instead of getting feedback.

  nameInput.addEventListener('input', () => {
    const value = nameInput.value.trim();
    nameValid = value.length > 0;
    errorEls.name.textContent = '';
  });

  emailInput.addEventListener('input', () => {
    const value = emailInput.value.trim();
    emailValid = value === '' ? false : Auth.isValidEmail(value);
    emailInput.classList.toggle('is-invalid', value !== '' && !emailValid);
    errorEls.email.textContent = value !== '' && !emailValid ? 'Enter a valid email address.' : '';
  });

  // Registered immediately, independent of Auth/network readiness —
  // showing or hiding typed text should never depend on whether the
  // auth backend has finished initializing.
  passwordToggle.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    passwordToggle.dataset.state = isHidden ? 'visible' : 'hidden';
    passwordToggle.setAttribute('aria-pressed', String(isHidden));
    passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  passwordInput.addEventListener('input', () => {
    const result = Auth.evaluatePasswordStrength(passwordInput.value);
    passwordValid = result.valid;

    strengthFill.style.width = result.percent + '%';
    strengthFill.style.background =
      result.level === 'strong' ? 'var(--success)' :
      result.level === 'fair' ? 'var(--warning)' :
      'var(--danger)';

    strengthLabel.textContent = passwordInput.value
      ? (result.level === 'strong' ? 'Strong' : result.level === 'fair' ? 'Fair' : 'Weak')
      : '';
    strengthLabel.dataset.level = result.level;

    strengthChecklist.querySelectorAll('li').forEach((li) => {
      const key = li.getAttribute('data-check');
      li.classList.toggle('met', !!result.checks[key]);
    });
  });

  // ── Handlers are registered IMMEDIATELY (see the note in login.html) ──
  let submitting = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submitting) return;
    clearErrors();

    const name = nameInput.value.trim();
    if (!nameValid) {
      errorEls.name.textContent = 'Tell us what to call you.';
      return;
    }
    if (!emailValid) {
      errorEls.email.textContent = 'Enter a valid email address.';
      return;
    }
    if (!passwordValid) {
      errorEls.password.textContent = 'Password does not meet the requirements above.';
      return;
    }

    submitting = true;
    setLoading(true);
    try {
      await Auth.signUpWithEmail(emailInput.value.trim(), passwordInput.value, name);
      window.location.replace(await resolvePostAuthDestination());
    } catch (err) {
      showError(err);
      setLoading(false);
      submitting = false;
    }
  });

  googleBtn.addEventListener('click', async () => {
    if (submitting) return;
    clearErrors();
    submitting = true;
    setGoogleLoading(true);
    try {
      await Auth.signInWithGoogle();
      window.location.replace(await resolvePostAuthDestination());
    } catch (err) {
      setGoogleLoading(false);
      showError(err);
      submitting = false;
    }
  });

  // Already signed in on this browser? Skip the form.
  Auth.ready().then(async (user) => {
    if (user && !submitting) {
      submitting = true;
      window.location.replace(await resolvePostAuthDestination());
    }
  }).catch((initErr) => {
    console.error('Auth initialization failed:', initErr);
    errorEls.general.textContent = 'Unable to load authentication. Please refresh the page.';
  });
</script>
</body>
</html>
