<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Practise with a feedback loop</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Small, repeated improvements beat one long rehearsal.</text><rect x="470" y="130" width="260" height="100" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="600" y="190" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Record yourself</text><rect x="770" y="280" width="260" height="100" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="900" y="340" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Listen back</text><rect x="470" y="430" width="260" height="100" rx="18" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="600" y="490" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Pick ONE fix</text><rect x="170" y="280" width="260" height="100" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="300" y="340" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Speak it again</text><line x1="730" y1="215" x2="795.7573593128807" y2="280.75735931288074" stroke="#a8471f" stroke-width="4"/><polygon points="800,285 785,280 795,270" fill="#a8471f"/><line x1="840" y1="380" x2="735.1655591692859" y2="441.94762412724015" stroke="#a8471f" stroke-width="4"/><polygon points="730,445 739,432 746,444" fill="#a8471f"/><line x1="470" y1="445" x2="365.16555916928587" y2="383.05237587275985" stroke="#a8471f" stroke-width="4"/><polygon points="360,380 376,381 369,393" fill="#a8471f"/><line x1="360" y1="285" x2="464.93803107360736" y2="218.22125295315897" stroke="#a8471f" stroke-width="4"/><polygon points="470,215 462,229 454,217" fill="#a8471f"/><text x="600" y="340" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Repeat</text><text x="600" y="373" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">three times</text><circle cx="500" cy="150" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="500" y="158" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="800" cy="300" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="800" y="308" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="500" cy="450" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="500" y="458" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>