<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">A talk in three parts</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Tell them where you are going, go there, then say where you arrived.</text><rect x="60" y="160" width="320" height="420" rx="18" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="220" y="210" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Opening</text><text x="220" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">1  Hook</text><text x="220" y="311" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">2  Topic</text><text x="220" y="341" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">3  Preview</text><text x="220" y="450" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">about 10 percent</text><text x="220" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">of the time</text><rect x="440" y="160" width="320" height="420" rx="18" fil