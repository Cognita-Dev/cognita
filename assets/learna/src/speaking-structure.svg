iddle" style="white-space:pre">2  Call to action</text><text x="980" y="341" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">3  Final line</text><text x="980" y="450" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">about 10 percent</text><text x="980" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">of the time</text><line x1="384" y1="370" x2="430.0" y2="370.0" stroke="#a8471f" stroke-width="4"/><polygon points="436,370 422,377 422,363" fill="#a8471f"/><line x1="764" y1="370" x2="810.0" y2="370.0" stroke="#a8471f" stroke-width="4"/><polygon points="816,370 802,377 802,363" fill="#a8471f"/><circle cx="90" cy="182" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="90" y="190" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="470" cy="182" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="470" y="190" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="850" cy="182" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="850" y="190" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>