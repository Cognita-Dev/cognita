<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">A loop repeats steps</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">for (let i = 0; i &lt; 3; i++) { ... }</text><rect x="50" y="210" width="230" height="110" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="165" y="252" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">1  Start</text><text x="165" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">let i = 0</text><rect x="350" y="210" width="230" height="110" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="465" y="252" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">2  Test</text><text x="465" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">i &lt; 3 ?</text><rect x="650" y="210" width="270" height="110" rx="18" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="785" y="252" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">3  Run the body</text><text x="785" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">console.log(i)</text><rect x="990" y="210" width="170" height="110" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="1075" y="252" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">4  Update</text><text x="1075" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">i++</text><rect x="350" y="420" width="230" height="110" rx="18" fill="#e3eee9" stroke="#3f6b5b" stroke-width="2"/><text x="465" y="462" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">Stop</text><text x="465" y="500" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">the loop ends</text><line x1="280" y1="265" x2="340.0" y2="265.0" stroke="#a8471f" stroke-width="4"/><polygon points="346,265 332,272 332,258" fill="#a8471f"/><line x1="580" y1="265" x2="640.0" y2="265.0" stroke="#a8471f" stroke-width="4"/><polygon points="646,265 632,272 632,258" fill="#a8471f"/><text x="613" y="248" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">true</text><line x1="920" y1="265" x2="980.0" y2="265.0" stroke="#a8471f" stroke-width="4"/><polygon points="986,265 972,272 972,258" fill="#a8471f"/><line x1="465" y1="320" x2="465.0" y2="410.0" stroke="#a8471f" stroke-width="4"/><polygon points="465,416 458,402 472,402" fill="#a8471f"/><text x="445" y="375" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="bold" fill="#a8471f" text-anchor="end" style="white-space:pre">false</text><line x1="1075" y1="210" x2="1075" y2="165" stroke="#a8471f" stroke-width="4"/><line x1="1075" y1="165" x2="465" y2="165" stroke="#a8471f" stroke-width="4"/><line x1="465" y1="165" x2="465.0" y2="200.0" stroke="#a8471f" stroke-width="4"/><polygon points="465,206 458,192 472,192" fill="#a8471f"/><text x="770" y="150" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">then test again</text><text x="600" y="600" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">The output is 0, 1, 2. At i = 3 the test is false, so the loop stops.</text><circle cx="70" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="70" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="370" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="370" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="670" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="670" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><circle cx="1010" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="1010" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">4</text></svg>