<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">A calm breathing pattern</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Use it before you speak. Nobody can see you do it.</text><rect x="130" y="230" width="310" height="150" rx="16" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="285.0" y="290" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="34" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">In</text><text x="285.0" y="335" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">4 counts</text><text x="285.0" y="430" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">through the nose, low into the belly</text><circle cx="175" cy="365" r="7" fill="#a8471f" stroke="#a8471f" stroke-width="0"/><circle cx="245" cy="365" r="7" fill="#a8471f" stroke="#a8471f" stroke-width="0"/><circle cx="315" cy="365" r="7" fill="#a8471f" stroke="#a8471f" stroke-width="0"/><circle cx="385" cy="365" r="7" fill="#a8471f" stroke="#a8471f" stroke-width="0"/><rect x="454" y="230" width="170" height="150" rx="16" fill="#ffffff" stroke="#6f6f6a" stroke-width="2"/><text x="539.0" y="290" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="34" font-weight="bold" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Hold</text><text x="539.0" y="335" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">2 counts</text><text x="539.0" y="430" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">gently, without strain</text><circle cx="499" cy="365" r="7" fill="#6f6f6a" stroke="#6f6f6a" stroke-width="0"/><circle cx="569" cy="365" r="7" fill="#6f6f6a" stroke="#6f6f6a" stroke-width="0"/><rect x="638" y="230" width="450" height="150" rx="16" fill="#e3eee9" stroke="#3f6b5b" stroke-width="2"/><text x="863.0" y="290" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="34" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">Out</text><text x="863.0" y="335" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">6 counts</text><text x="863.0" y="430" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">slowly through the mouth</text><circle cx="683" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><circle cx="753" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><circle cx="823" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><circle cx="893" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><circle cx="963" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><circle cx="1033" cy="365" r="7" fill="#3f6b5b" stroke="#3f6b5b" stroke-width="0"/><text x="600" y="560" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Repeat three times. Longer out-breaths help the body slow down.</text><circle cx="150" cy="232" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="150" y="240" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="505" cy="232" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="505" y="240" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="690" cy="232" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="690" y="240" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>