<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">A function is a small machine</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Inputs go in. One result comes out.</text><rect x="60" y="230" width="240" height="200" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="180" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Inputs</text><text x="180" y="340" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">parameters</text><text x="180" y="368" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">price, quantity</text><rect x="400" y="190" width="400" height="280" rx="22" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="600" y="240" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">function totalPrice</text><text x="600" y="320" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">let subtotal =</text><text x="600" y="351" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">  price * quantity;</text><text x="600" y="420" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">return subtotal;</text><rect x="900" y="230" width="240" height="200" rx="18" fill="#e3eee9" stroke="#3f6b5b" stroke-width="2"/><text x="1020" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">Result</text><text x="1020" y="340" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">the returned</text><text x="1020" y="368" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">value: 3000</text><line x1="300" y1="330" x2="390.0" y2="330.0" stroke="#a8471f" stroke-width="4"/><polygon points="396,330 382,337 382,323" fill="#a8471f"/><line x1="804" y1="330" x2="890.0" y2="330.0" stroke="#a8471f" stroke-width="4"/><polygon points="896,330 882,337 882,323" fill="#a8471f"/><text x="600" y="530" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="28" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">totalPrice(1500, 2)  gives back  3000</text><text x="600" y="585" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">console.log shows a value on screen. return hands the value back to the caller.</text><circle cx="90" cy="250" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="90" y="258" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="430" cy="212" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="430" y="220" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="930" cy="250" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="930" y="258" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>