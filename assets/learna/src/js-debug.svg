<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Debugging is a loop, not a guess</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Change one thing at a time, then test again.</text><rect x="100" y="190" width="300" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="250" y="236" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">1  Reproduce</text><text x="250" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Make the problem</text><text x="250" y="307" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">happen every time.</text><rect x="450" y="190" width="300" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="600" y="236" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">2  Read</text><text x="600" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Read the error message.</text><text x="600" y="307" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Note the line number.</text><rect x="800" y="190" width="300" height="170" rx="18" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="950" y="236" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">3  Narrow down</text><text x="950" y="280" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Print values with</text><text x="950" y="307" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">console.log to find</text><text x="950" y="334" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">where it goes wrong.</text><rect x="800" y="410" width="300" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="950" y="456" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">4  Fix one thing</text><text x="950" y="500" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Change one line.</text><text x="950" y="527" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Not five.</text><rect x="450" y="410" width="300" height="170" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="600" y="456" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">5  Test again</text><text x="600" y="500" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Run the same case.</text><text x="600" y="527" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Then try a new one.</text><line x1="400" y1="275" x2="440.0" y2="275.0" stroke="#a8471f" stroke-width="4"/><polygon points="446,275 432,282 432,268" fill="#a8471f"/><line x1="750" y1="275" x2="790.0" y2="275.0" stroke="#a8471f" stroke-width="4"/><polygon points="796,275 782,282 782,268" fill="#a8471f"/><line x1="950" y1="360" x2="950.0" y2="400.0" stroke="#a8471f" stroke-width="4"/><polygon points="950,406 943,392 957,392" fill="#a8471f"/><line x1="796" y1="495" x2="760.0" y2="495.0" stroke="#a8471f" stroke-width="4"/><polygon points="754,495 768,488 768,502" fill="#a8471f"/><line x1="450" y1="495" x2="250" y2="495" stroke="#a8471f" stroke-width="4"/><line x1="250" y1="495" x2="250.0" y2="370.0" stroke="#a8471f" stroke-width="4"/><polygon points="250,364 257,378 243,378" fill="#a8471f"/><text x="600" y="640" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">If it still fails, go back to step 2 with fresh eyes.</text><circle cx="120" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="120" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="470" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="470" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="820" cy="210" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="820" y="218" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>