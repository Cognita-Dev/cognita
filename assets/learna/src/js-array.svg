<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">An array is an ordered list</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Each item sits in a numbered position. Counting starts at 0.</text><rect x="70" y="250" width="190" height="120" rx="14" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="165" y="322" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">&quot;Ada&quot;</text><text x="165" y="410" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">[0]</text><rect x="280" y="250" width="190" height="120" rx="14" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="375" y="322" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">&quot;Tobi&quot;</text><text x="375" y="410" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">[1]</text><rect x="490" y="250" width="190" height="120" rx="14" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="585" y="322" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">&quot;Zainab&quot;</text><text x="585" y="410" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">[2]</text><rect x="700" y="250" width="190" height="120" rx="14" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="795" y="322" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">&quot;Kemi&quot;</text><text x="795" y="410" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">[3]</text><rect x="910" y="250" width="190" height="120" rx="14" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="1005" y="322" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">&quot;Ife&quot;</text><text x="1005" y="410" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">[4]</text><text x="600" y="170" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">const names = [&quot;Ada&quot;, &quot;Tobi&quot;, &quot;Zainab&quot;, &quot;Kemi&quot;, &quot;Ife&quot;];</text><text x="600" y="495" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">names[0] is &quot;Ada&quot;          names.length is 5</text><text x="600" y="535" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">the last item is names[names.length - 1]</text><text x="600" y="595" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">The last index is always length minus one.</text><circle cx="100" cy="270" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="100" y="278" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="215" cy="400" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="215" y="408" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="940" cy="270" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="940" y="278" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>