<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Variables are labelled boxes</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">The label is the name. The box holds one value at a time.</text><rect x="80" y="170" width="460" height="300" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="310.0" y="214" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">const price</text><rect x="200" y="280" width="220" height="110" rx="14" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="310" y="350" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="44" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">1500</text><rect x="150" y="410" width="320" height="44" rx="22" fill="#e3eee9" stroke="#e3eee9" stroke-width="0"/><text x="310.0" y="439" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">locked: cannot be reassigned</text><rect x="660" y="170" width="460" height="300" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="890.0" y="214" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">let quantity</text><rect x="780" y="280" width="100" height="110" rx="14" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="830" y="350" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="44" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">2</text><line x1="890" y1="335" x2="934.0" y2="335.0" stroke="#a8471f" stroke-width="4"/><polygon points="940,335 926,342 926,328" fill="#a8471f"/><rect x="950" y="280" width="100" height="110" rx="14" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="1000" y="350" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="44" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">3</text><rect x="740" y="410" width="320" height="44" rx="22" fill="#f5e6da" stroke="#f5e6da" stroke-width="0"/><text x="900.0" y="439" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">open: can be given a new value</text><text x="310" y="530" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">const total = price * quantity;</text><text x="890" y="530" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">quantity = quantity + 1;</text><text x="600" y="600" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Use const by default. Use let only when the value must change.</text><circle cx="110" cy="190" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="110" y="198" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="310" cy="270" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="310" y="278" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="122" cy="432" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="122" y="440" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><circle cx="890" cy="300" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="890" y="308" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">4</text></svg>