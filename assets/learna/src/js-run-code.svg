<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">How JavaScript code runs</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">You write instructions. The engine follows them in order.</text><rect x="60" y="190" width="320" height="300" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="220.0" y="234" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">1  You write code</text><rect x="84" y="270" width="272" height="190" rx="12" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/><text x="100" y="312" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#f5e6da" text-anchor="start" style="white-space:pre">const a = 4;</text><text x="100" y="350" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#f5e6da" text-anchor="start" style="white-space:pre">const b = 3;</text><text x="100" y="388" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#f5e6da" text-anchor="start" style="white-space:pre">console.log(a + b);</text><rect x="440" y="190" width="320" height="300" rx="18" fill="#f5e6da" stroke="#d9d6cf" stroke-width="2"/><text x="600.0" y="234" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">2  The engine reads it</text><text x="600" y="290" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Starts at the top.</text><text x="600" y="321" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Reads one line,</text><text x="600" y="351" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">does it, then moves</text><text x="600" y="382" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">to the next line.</text><rect x="820" y="190" width="320" height="300" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="980.0" y="234" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">3  You see the result</text><rect x="844" y="270" width="272" height="190" rx="12" fill="#1f1f1f" stroke="#1f1f1f" stroke-width="2"/><text x="860" y="312" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="30" font-weight="normal" fill="#a7d2c1" text-anchor="start" style="white-space:pre">&gt; 7</text><text x="860" y="370" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#d9d6cf" text-anchor="start" style="white-space:pre">Output appears in</text><text x="860" y="396" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#d9d6cf" text-anchor="start" style="white-space:pre">the console.</text><line x1="384" y1="340" x2="430.0" y2="340.0" stroke="#a8471f" stroke-width="4"/><polygon points="436,340 422,347 422,333" fill="#a8471f"/><line x1="764" y1="340" x2="810.0" y2="340.0" stroke="#a8471f" stroke-width="4"/><polygon points="816,340 802,347 802,333" fill="#a8471f"/><circle cx="356" cy="192" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="356" y="200" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="736" cy="192" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="736" y="200" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="1116" cy="192" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="1116" y="200" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><rect x="60" y="540" width="1080" height="60" rx="30" fill="#f5e6da" stroke="#f5e6da" stroke-width="0"/><text x="600.0" y="578" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Order matters: a line can only use values created above it.</text></svg>