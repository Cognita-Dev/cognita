<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Three openings that work</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Pick one. Say it in under 20 seconds.</text><rect x="60" y="160" width="340" height="400" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="230" y="215" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">A surprising fact</text><rect x="80" y="245" width="300" height="150" rx="12" fill="#f5e6da" stroke="#f5e6da" stroke-width="2"/><text x="230" y="295" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Every year our school loses</text><text x="230" y="321" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">40 hours to paper registers.</text><text x="230" y="450" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Makes the audience</text><text x="230" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">think: really?</text><circle cx="90" cy="180" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="90" y="188" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><rect x="430" y="160" width="340" height="400" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="600" y="215" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">A short question</text><rect x="450" y="245" width="300" height="150" rx="12" fill="#f5e6da" stroke="#f5e6da" stroke-width="2"/><text x="600" y="295" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">When did you last wake up</text><text x="600" y="321" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">feeling truly rested?</text><text x="600" y="450" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Makes the audience</text><text x="600" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">think about themselves.</text><circle cx="460" cy="180" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="460" y="188" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><rect x="800" y="160" width="340" height="400" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="970" y="215" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">A one-line story</text><rect x="820" y="245" width="300" height="150" rx="12" fill="#f5e6da" stroke="#f5e6da" stroke-width="2"/><text x="970" y="295" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Last month a customer called</text><text x="970" y="321" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">me at midnight. She was right.</text><text x="970" y="450" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Makes the audience</text><text x="970" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">want the next line.</text><circle cx="830" cy="180" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="830" y="188" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><rect x="60" y="590" width="1080" height="56" rx="28" fill="#f7ece9" stroke="#f7ece9" stroke-width="0"/><text x="600.0" y="626" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#b3423a" text-anchor="middle" style="white-space:pre">Avoid: an apology, or &quot;Today I am going to talk about...&quot;</text></svg>