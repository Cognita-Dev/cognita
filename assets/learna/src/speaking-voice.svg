<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Four dials of your voice</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">You control each one. Set them for the message.</text><text x="70" y="210" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Pace</text><rect x="260" y="190" width="760" height="14" rx="7" fill="#d9d6cf" stroke="#d9d6cf" stroke-width="0"/><rect x="260" y="190" width="342" height="14" rx="7" fill="#cf7b4a" stroke="#cf7b4a" stroke-width="0"/><circle cx="602" cy="197" r="22" fill="#a8471f" stroke="#ffffff" stroke-width="4"/><text x="260" y="242" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">slow</text><text x="1020" y="242" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="normal" fill="#6f6f6a" text-anchor="end" style="white-space:pre">fast</text><circle cx="1100" cy="197" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="1100" y="205" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><text x="70" y="325" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="30" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Volume</text><rect x="260" y="305" width="760" height="14"