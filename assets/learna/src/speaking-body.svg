<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Stand so your message is clear</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Simple habits. No acting.</text><circle cx="420" cy="230" r="55" fill="#ffffff" stroke="#171717" stroke-width="4"/><line x1="420" y1="285" x2="420" y2="480" stroke="#171717" stroke-width="6"/><line x1="420" y1="330" x2="330" y2="410" stroke="#171717" stroke-width="6"/><line x1="420" y1="330" x2="510" y2="410" stroke="#171717" stroke-width="6"/><line x1="420" y1="480" x2="370" y2="600" stroke="#171717" stroke-width="6"/><line x1="420" y1="480" x2="470" y2="600" stroke="#171717" stroke-width="6"/><rect x="330" y="600" width="80" height="16" rx="6" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><rect x="450" y="600" width="80" height="16" rx="6" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="660" y="200" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Eyes</text><text x="660" y="236" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">Look at one person for one</text><text x="660" y="262" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">thought, then move on.</text><text x="660" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Shoulders and chest</text><text x="660" y="366" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">Relaxed and open. Breathe low.</text><text x="660" y="440" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Hands</text><text x="660" y="476" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">Rest at waist height. Use them</text><text x="660" y="502" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">to show size, number or order.</text><text x="660" y="560" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Feet</text><text x="660" y="596" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">Shoulder width apart, weight even.</text><circle cx="480" cy="205" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="480" y="213" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="480" cy="300" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="480" y="308" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="340" cy="430" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="340" y="438" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><circle cx="520" cy="600" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="520" y="608" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">4</text></svg>