<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Capstone: a pupil results report</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">One small program built from the parts you have learned.</text><rect x="60" y="200" width="260" height="260" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="190" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Data</text><text x="190" y="310" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">an array of</text><text x="190" y="338" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">pupil objects</text><text x="190" y="366" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">with scores</text><rect x="400" y="150" width="400" height="360" rx="22" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="600" y="200" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Functions</text><rect x="440" y="230" width="320" height="50" rx="10" fill="#ffffff" stroke="#cf7b4a" stroke-width="2"/><text x="600" y="263" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">average(scores)</text><rect x="440" y="292" width="320" height="50" rx="10" fill="#ffffff" stroke="#cf7b4a" stroke-width="2"/><text x="600" y="325" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">grade(average)</text><rect x="440" y="354" width="320" height="50" rx="10" fill="#ffffff" stroke="#cf7b4a" stroke-width="2"/><text x="600" y="387" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">topPupil(pupils)</text><rect x="440" y="416" width="320" height="50" rx="10" fill="#ffffff" stroke="#cf7b4a" stroke-width="2"/><text x="600" y="449" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">report(pupils)</text><rect x="880" y="200" width="260" height="260" rx="18" fill="#e3eee9" stroke="#3f6b5b" stroke-width="2"/><text x="1010" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="28" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">Report</text><text x="1010" y="310" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">a clear text</text><text x="1010" y="338" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">summary with</text><text x="1010" y="366" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">grades</text><line x1="320" y1="330" x2="390.0" y2="330.0" stroke="#a8471f" stroke-width="4"/><polygon points="396,330 382,337 382,323" fill="#a8471f"/><line x1="804" y1="330" x2="870.0" y2="330.0" stroke="#a8471f" stroke-width="4"/><polygon points="876,330 862,337 862,323" fill="#a8471f"/><text x="600" y="580" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">Plan on paper first. Build one function at a time. Test each before the next.</text><circle cx="90" cy="220" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="90" y="228" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="430" cy="172" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="430" y="180" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="910" cy="220" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="910" y="228" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>