8471f" text-anchor="start" style="white-space:pre">reduce</text><text x="95" y="592" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">combine into one value</text><rect x="300" y="525" width="58" height="58" rx="10" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="329" y="564" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">2</text><rect x="370" y="525" width="58" height="58" rx="10" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="399" y="564" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">4</text><rect x="440" y="525" width="58" height="58" rx="10" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="469" y="564" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">6</text><line x1="510" y1="554" x2="539.0" y2="554.0" stroke="#a8471f" stroke-width="4"/><polygon points="545,554 531,561 531,547" fill="#a8471f"/><text x="555" y="562" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="20" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">.reduce((s, n) =&gt; s + n, 0)</text><line x1="885" y1="554" x2="919.0" y2="554.0" stroke="#a8471f" stroke-width="4"/><polygon points="925,554 911,561 911,547" fill="#a8471f"/><rect x="935" y="525" width="58" height="58" rx="10" fill="#e3eee9" stroke="#3f6b5b" stroke-width="2"/><text x="964" y="564" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="26" font-weight="bold" fill="#171717" text-anchor="middle" style="white-space:pre">12</text><circle cx="70" cy="190" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/>