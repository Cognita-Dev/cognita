<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Handling questions</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">A steady routine keeps you calm.</text><rect x="40" y="220" width="206" height="280" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="143" y="270" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">1  Listen</text><text x="143" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Let them finish.</text><text x="143" y="357" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Do not plan your</text><text x="143" y="384" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">answer yet.</text><line x1="248" y1="360" x2="260.0" y2="360.0" stroke="#a8471f" stroke-width="4"/><polygon points="266,360 252,367 252,353" fill="#a8471f"/><circle cx="62" cy="242" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="62" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><rect x="268" y="220" width="206" height="280" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="371" y="270" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">2  Pause</text><text x="371" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Take a breath.</text><text x="371" y="357" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">One second is</text><text x="371" y="384" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">enough.</text><line x1="476" y1="360" x2="488.0" y2="360.0" stroke="#a8471f" stroke-width="4"/><polygon points="494,360 480,367 480,353" fill="#a8471f"/><circle cx="290" cy="242" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="290" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><rect x="496" y="220" width="206" height="280" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="599" y="270" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">3  Repeat</text><text x="599" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Say the question</text><text x="599" y="357" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">back in short form</text><text x="599" y="384" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">for the room.</text><line x1="704" y1="360" x2="716.0" y2="360.0" stroke="#a8471f" stroke-width="4"/><polygon points="722,360 708,367 708,353" fill="#a8471f"/><circle cx="518" cy="242" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="518" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text><rect x="724" y="220" width="206" height="280" rx="18" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="827" y="270" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">4  Answer</text><text x="827" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Give the answer</text><text x="827" y="357" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">first, then the</text><text x="827" y="384" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">reason.</text><line x1="932" y1="360" x2="944.0" y2="360.0" stroke="#a8471f" stroke-width="4"/><polygon points="950,360 936,367 936,353" fill="#a8471f"/><circle cx="746" cy="242" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="746" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">4</text><rect x="952" y="220" width="206" height="280" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="1055" y="270" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">5  Check</text><text x="1055" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">Ask: &quot;Does that</text><text x="1055" y="357" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="normal" fill="#171717" text-anchor="middle" style="white-space:pre">answer it?&quot;</text><circle cx="974" cy="242" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="974" y="250" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">5</text><rect x="60" y="560" width="1080" height="56" rx="28" fill="#e3eee9" stroke="#e3eee9" stroke-width="0"/><text x="600.0" y="596" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#3f6b5b" text-anchor="middle" style="white-space:pre">If you do not know: say so, and say how you will find out.</text></svg>