<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Scope: where a name can be seen</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Inner boxes can see outward. Outer boxes cannot see inward.</text><rect x="60" y="150" width="1080" height="470" rx="22" fill="#fbfbfa" stroke="#d9d6cf" stroke-width="2"/><text x="90" y="190" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Global scope</text><text x="90" y="235" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">const school = &quot;Fahmid&quot;;</text><rect x="140" y="270" width="920" height="320" rx="22" fill="#f5e6da" stroke="#a8471f" stroke-width="2"/><text x="170" y="310" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Inside function greet()</text><text x="170" y="352" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">const name = &quot;Ada&quot;;</text><rect x="220" y="390" width="760" height="170" rx="18" fill="#ffffff" stroke="#cf7b4a" stroke-width="2"/><text x="250" y="430" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="bold" fill="#cf7b4a" text-anchor="start" style="white-space:pre">Inside an if block { }</text><text x="250" y="475" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="24" font-weight="normal" fill="#171717" text-anchor="start" style="white-space:pre">let note = school + name;</text><text x="250" y="520" font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="20" font-weight="normal" fill="#3f6b5b" text-anchor="start" style="white-space:pre">// can see school, name and note</text><circle cx="1090" cy="190" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="1090" y="198" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="1010" cy="310" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="1010" y="318" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="930" cy="430" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="930" y="438" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>