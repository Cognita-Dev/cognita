<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><rect x="0" y="0" width="14" height="675" fill="#a8471f"/><text x="56" y="74" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="38" font-weight="bold" fill="#a8471f" text-anchor="start" style="white-space:pre">Know your audience first</text><text x="56" y="112" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="normal" fill="#6f6f6a" text-anchor="start" style="white-space:pre">Three questions shape everything you say.</text><polygon points="600,150 1000,540 200,540" fill="#f5e6da" stroke="#a8471f" stroke-width="3"/><text x="600" y="330" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="32" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Your talk</text><rect x="60" y="150" width="330" height="120" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="225" y="195" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">Who are they?</text><text x="225" y="235" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">age, role, mood</text><rect x="810" y="150" width="330" height="120" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="975" y="195" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">What do they know?</text><text x="975" y="235" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">skip what they know</text><rect x="435" y="570" width="330" height="90" rx="18" fill="#ffffff" stroke="#d9d6cf" stroke-width="2"/><text x="600" y="610" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a8471f" text-anchor="middle" style="white-space:pre">What do they need?</text><text x="600" y="642" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="normal" fill="#6f6f6a" text-anchor="middle" style="white-space:pre">start from their need</text><circle cx="80" cy="170" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="80" y="178" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text><circle cx="830" cy="170" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="830" y="178" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text><circle cx="455" cy="590" r="20" fill="#a8471f" stroke="#ffffff" stroke-width="3"/><text x="455" y="598" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text></svg>