<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Cognita Collection</title>

  <link
    rel="stylesheet"
    href="/css/collection.css"
  />
</head>

<body>
  <div class="collection-shell">

    <header class="collection-header">
      <a
        href="/collections.html"
        class="back-link"
      >
        ← Collections
      </a>

      <div class="brand">
        <div class="brand-mark">C</div>

        <div>
          <strong>Cognita</strong>
          <span>Collection</span>
        </div>
      </div>
    </header>

    <main
      id="collectionMain"
      class="collection-main"
    >

      <section
        id="collectionHero"
        class="collection-hero"
      ></section>

      <section>
        <div class="section-heading">
          <span class="eyebrow">
            INCLUDED RESOURCES
          </span>

          <h2>
            Resources in this collection
          </h2>
        </div>

        <div
          id="resourcesGrid"
          class="resources-grid"
        ></div>
      </section>

    </main>
  </div>

  <script
    type="module"
    src="/js/collection.js"
  ></script>
</body>
</html>
