<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cognita sandbox</title>
<!--
  Tier 1 agent sandbox page. It is only ever loaded inside
  <iframe sandbox="allow-scripts"> by js/sandbox-client.js. That means:
    - it has an opaque origin: no cookies, no localStorage, no Firebase
      session, no access to the Cognita page or its DOM;
    - the parent never sends it a token, key or secret, only workspace
      files and the tool call to run;
    - its own Content-Security-Policy (set for this path in vercel.json)
      allows nothing but this page, its inline code, and Cognita's own Pyodide
      host (pyodide.cognita.com.ng), so model-written code cannot call out to
      other sites.
  Python runs in a Web Worker (Pyodide) and JavaScript in a throwaway Web
  Worker, so a runaway loop is stopped by terminating the worker.
-->
</head>
<body>
<script src="/js/sandbox-shell.js"></script>

<script type="text/plain" id="docs-py-src">
"""cognita_docs: make Word (.docx) and PDF files with only the standard library.

    from cognita_docs import docx, pdf
    blocks = [
        ("title", "Quarterly Report"),
        ("h1", "Summary"),
        ("p", "Plain text with **bold** and *italic*. Use \\n for a line break."),
        ("bullets", ["First point", "Second point"]),
        ("numbered", ["Step one", "Step two"]),
        ("table", [["Item", "Cost"], ["Pens", "500"]]),
        ("p", "Centered line", {"align": "center"}),
        ("pagebreak",),
    ]
    docx("/workspace/report.docx", blocks)
    pdf("/workspace/report.pdf", blocks)

Block types: title, h1, h2, h3, p, quote, bullets, numbered, table, spacer, pagebreak.
An optional last item in a block is a dict: {"align": "left|center|right|justify"}.
A table may be given as ("table", rows, {"header": True}).
"""
import re
import zipfile
from xml.sax.saxutils import escape as _esc

__all__ = ["docx", "pdf"]

_INLINE = re.compile(r"(\*\*.+?\*\*|\*.+?\*)", re.S)


def _runs(text):
    """Split 'a **b** *c*' into [(text, bold, italic)]."""
    out = []
    for part in _INLINE.split(str(text)):
        if not part:
            continue
        if part.startswith("**") and part.endswith("**") and len(part) > 4:
            out.append((part[2:-2], True, False))
        elif part.startswith("*") and part.endswith("*") and len(part) > 2:
            out.append((part[1:-1], False, True))
        else:
            out.append((part, False, False))
    return out


def _norm(blocks):
    """Accept tuples or dicts; return (kind, value, opts) triples."""
    out = []
    for b in blocks or []:
        if isinstance(b, dict):
            kind = b.get("type") or b.get("kind") or "p"
            val = b.get("text", b.get("items", b.get("rows", "")))
            opts = {k: v for k, v in b.items() if k not in ("type", "kind", "text", "items", "rows")}
        else:
            b = list(b)
            kind = b[0]
            val = b[1] if len(b) > 1 and not isinstance(b[1], dict) else ""
            opts = {}
            for extra in b[1:]:
                if isinstance(extra, dict):
                    opts = extra
        out.append((str(kind).lower(), val, opts))
    return out


# ───────────────────────── Word ─────────────────────────

_W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'


def _run_xml(text, bold=False, italic=False, extra=""):
    pr = ("<w:b/>" if bold else "") + ("<w:i/>" if italic else "") + extra
    pr = "<w:rPr>" + pr + "</w:rPr>" if pr else ""
    pieces = str(text).split("\n")
    inner = "<w:br/>".join('<w:t xml:space="preserve">%s</w:t>' % _esc(p) for p in pieces)
    return "<w:r>%s%s</w:r>" % (pr, inner)


def _para(text, style=None, align=None, num=None, runs_extra="", bold_all=False):
    ppr = ""
    if style:
        ppr += '<w:pStyle w:val="%s"/>' % style
    if num is not None:
        ppr += '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="%d"/></w:numPr>' % num
    if align in ("left", "center", "right", "justify"):
        ppr += '<w:jc w:val="%s"/>' % ("both" if align == "justify" else align)
    ppr = "<w:pPr>%s</w:pPr>" % ppr if ppr else ""
    body = "".join(_run_xml(t, b or bold_all, i, runs_extra) for t, b, i in _runs(text))
    return "<w:p>%s%s</w:p>" % (ppr, body)


def _table_xml(rows, header=True):
    rows = [list(r) for r in rows if r is not None]
    if not rows:
        return ""
    cols = max(len(r) for r in rows)
    borders = "".join('<w:%s w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>' % s
                      for s in ("top", "left", "bottom", "right", "insideH", "insideV"))
    xml = ['<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>%s</w:tblBorders>'
           '<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>'
           '<w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>' % borders]
    xml.append("<w:tblGrid>%s</w:tblGrid>" % ("<w:gridCol/>" * cols))
    for ri, row in enumerate(rows):
        xml.append("<w:tr>")
        for ci in range(cols):
            cell = row[ci] if ci < len(row) else ""
            is_head = header and ri == 0
            shade = '<w:shd w:val="clear" w:color="auto" w:fill="E8EEF0"/>' if is_head else ""
            xml.append("<w:tc><w:tcPr>%s</w:tcPr>%s</w:tc>" % (shade, _para(cell, bold_all=is_head)))
        xml.append("</w:tr>")
    xml.append("</w:tbl>")
    return "".join(xml) + "<w:p/>"


def docx(path, blocks, title=None, author="Cognita", page="A4"):
    """Write a .docx file. `blocks` is described at the top of this module."""
    body = []
    nums = []  # numbering instances: (numId, abstractId)
    next_num = 3
    if title and not any(k == "title" for k, _, _ in _norm(blocks)):
        body.append(_para(title, style="Title"))
    for kind, val, opts in _norm(blocks):
        align = opts.get("align")
        if kind in ("title", "h1", "h2", "h3"):
            style = {"title": "Title", "h1": "Heading1", "h2": "Heading2", "h3": "Heading3"}[kind]
            body.append(_para(val, style=style, align=align))
        elif kind == "quote":
            body.append(_para(val, style="Quote", align=align))
        elif kind == "bullets":
            for item in val:
                body.append(_para(item, style="ListParagraph", num=1))
        elif kind == "numbered":
            nid = next_num
            next_num += 1
            nums.append(nid)
            for item in val:
                body.append(_para(item, style="ListParagraph", num=nid))
        elif kind == "table":
            body.append(_table_xml(val, opts.get("header", True)))
        elif kind == "spacer":
            body.append("<w:p/>")
        elif kind == "pagebreak":
            body.append('<w:p><w:r><w:br w:type="page"/></w:r></w:p>')
        else:
            body.append(_para(val, align=align))

    w, h = (12240, 15840) if str(page).lower() == "letter" else (11906, 16838)
    sect = ('<w:sectPr><w:pgSz w:w="%d" w:h="%d"/><w:pgMar w:top="1440" w:right="1440" '
            'w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>' % (w, h))
    document = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document %s><w:body>%s%s</w:body></w:document>'
                % (_W, "".join(body), sect))

    def style(sid, name, size, bold=False, italic=False, color=None, before=0, after=160, based="Normal", extra=""):
        rpr = ('<w:b/>' if bold else '') + ('<w:i/>' if italic else '') + \
              ('<w:color w:val="%s"/>' % color if color else '') + '<w:sz w:val="%d"/>' % size
        return ('<w:style w:type="paragraph" w:styleId="%s"><w:name w:val="%s"/><w:basedOn w:val="%s"/>'
                '<w:qFormat/><w:pPr><w:spacing w:before="%d" w:after="%d"/>%s</w:pPr><w:rPr>%s</w:rPr></w:style>'
                % (sid, name, based, before, after, extra, rpr))

    styles = (
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles %s>'
        '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/>'
        '<w:sz w:val="22"/><w:lang w:val="en-GB"/></w:rPr></w:rPrDefault>'
        '<w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'
        '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>%s%s%s%s%s%s</w:styles>'
        % (_W,
           style("Title", "Title", 52, bold=True, color="1F3A33", after=240, extra='<w:keepNext/>'),
           style("Heading1", "heading 1", 32, bold=True, color="2F5D50", before=320, after=120, extra='<w:keepNext/>'),
           style("Heading2", "heading 2", 26, bold=True, color="2F5D50", before=240, after=100, extra='<w:keepNext/>'),
           style("Heading3", "heading 3", 23, bold=True, color="404040", before=200, after=80, extra='<w:keepNext/>'),
           style("ListParagraph", "List Paragraph", 22, after=60, extra='<w:ind w:left="720"/>'),
           style("Quote", "Quote", 22, italic=True, color="595959", extra='<w:ind w:left="720" w:right="720"/>')))

    def abstract(aid, fmt, text):
        return ('<w:abstractNum w:abstractNumId="%d"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0">'
                '<w:start w:val="1"/><w:numFmt w:val="%s"/><w:lvlText w:val="%s"/><w:lvlJc w:val="left"/>'
                '<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>' % (aid, fmt, text))

    numbering = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering %s>%s%s'
                 '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>%s</w:numbering>'
                 % (_W, abstract(0, "bullet", "\u2022"), abstract(1, "decimal", "%1."),
                    "".join('<w:num w:numId="%d"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0">'
                            '<w:startOverride w:val="1"/></w:lvlOverride></w:num>' % n for n in nums)))

    core = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties '
            'xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" '
            'xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>%s</dc:title><dc:creator>%s</dc:creator></cp:coreProperties>'
            % (_esc(title or ""), _esc(author)))
    ctypes = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
              '<Default Extension="xml" ContentType="application/xml"/>'
              '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
              '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
              '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
              '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>')
    rels = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
            '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>')
    doc_rels = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
                '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>')
    with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as z:
        z.writestr("[Content_Types].xml", ctypes)
        z.writestr("_rels/.rels", rels)
        z.writestr("word/document.xml", document)
        z.writestr("word/styles.xml", styles)
        z.writestr("word/numbering.xml", numbering)
        z.writestr("word/_rels/document.xml.rels", doc_rels)
        z.writestr("docProps/core.xml", core)
    return path


# ───────────────────────── PDF ─────────────────────────

_HW = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278] + [556] * 10 + \
      [278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833,
       722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556,
       556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556,
       500, 722, 500, 500, 500, 334, 260, 334, 584]


def _cp(text):
    t = str(text).replace("\u20a6", "NGN ").replace("\u2011", "-").replace("\u00a0", " ")
    return t.encode("cp1252", "replace").decode("cp1252")


def _cw(ch, bold):
    o = ord(ch)
    w = _HW[o - 32] if 32 <= o <= 126 else 556
    return w * (1.06 if bold else 1.0)


def _tw(text, size, bold=False):
    return sum(_cw(c, bold) for c in text) * size / 1000.0


def _pdf_escape(s):
    return s.replace("\\", "\\\\").replace("(", "\\(").replace(")", "\\)")


def pdf(path, blocks, title=None, page="A4"):
    """Write a simple, clean PDF. `blocks` is described at the top of this module."""
    W, H = (612.0, 792.0) if str(page).lower() == "letter" else (595.0, 842.0)
    M = 64.0
    pages = [[]]
    state = {"y": H - M}

    def newpage():
        pages.append([])
        state["y"] = H - M

    def ensure(h):
        if state["y"] - h < M:
            newpage()

    def text_at(x, y, s, size, font, color="0.1 0.1 0.1"):
        pages[-1].append("%s rg BT /%s %.2f Tf %.2f %.2f Td (%s) Tj ET" % (color, font, size, x, y, _pdf_escape(_cp(s))))

    def wrap(text, size, width, base_bold=False):
        """Return lines; each line is a list of (text, font, bold) pieces."""
        tokens = []
        for t, b, i in _runs(text):
            for k, part in enumerate(str(t).split("\n")):
                if k > 0:
                    tokens.append(("\n", b, i))
                for word in re.findall(r"\S+|\s+", part):
                    tokens.append((word, b or base_bold, i))
        lines, cur, curw = [], [], 0.0
        for word, b, i in tokens:
            if word == "\n":
                lines.append(cur); cur, curw = [], 0.0
                continue
            w = _tw(_cp(word), size, b)
            if curw + w > width and cur and not word.isspace():
                lines.append(cur); cur, curw = [], 0.0
            if not cur and word.isspace():
                continue
            cur.append((word, "F2" if b else ("F3" if i else "F1"), b))
            curw += w
        lines.append(cur)
        return lines

    def draw_para(text, size, x, width, bold=False, align="left", gap=6, color="0.1 0.1 0.1", lead=1.35):
        for line in wrap(text, size, width, bold):
            ensure(size * lead)
            state["y"] -= size * lead
            total = sum(_tw(_cp(w), size, b) for w, _, b in line)
            cx = x
            if align == "center":
                cx = x + (width - total) / 2
            elif align == "right":
                cx = x + width - total
            for word, font, b in line:
                text_at(cx, state["y"], word, size, font, color)
                cx += _tw(_cp(word), size, b)
        state["y"] -= gap

    cw = W - 2 * M
    items = _norm(blocks)
    if title and not any(k == "title" for k, _, _ in items):
        items.insert(0, ("title", title, {}))
    for kind, val, opts in items:
        align = opts.get("align", "left")
        if kind == "title":
            draw_para(val, 24, M, cw, True, align, 14, "0.12 0.23 0.2")
        elif kind in ("h1", "h2", "h3"):
            size = {"h1": 16, "h2": 13.5, "h3": 12}[kind]
            ensure(size * 3)
            state["y"] -= 6
            draw_para(val, size, M, cw, True, align, 6, "0.18 0.36 0.31")
        elif kind == "quote":
            draw_para(val, 11, M + 28, cw - 56, False, align, 8, "0.35 0.35 0.35")
        elif kind in ("bullets", "numbered"):
            for n, item in enumerate(val, 1):
                ensure(16)
                mark = u"\u2022" if kind == "bullets" else "%d." % n
                y0 = state["y"] - 11 * 1.35
                text_at(M + 8, y0, mark, 11, "F1")
                draw_para(item, 11, M + 28, cw - 28, False, "left", 3)
            state["y"] -= 4
        elif kind == "table":
            rows = [list(r) for r in val if r is not None]
            if not rows:
                continue
            cols = max(len(r) for r in rows)
            colw = cw / cols
            for ri, row in enumerate(rows):
                cells = [wrap(row[ci] if ci < len(row) else "", 10, colw - 10, opts.get("header", True) and ri == 0)
                         for ci in range(cols)]
                rh = max(len(c) for c in cells) * 13.5 + 8
                ensure(rh)
                top = state["y"]
                if opts.get("header", True) and ri == 0:
                    pages[-1].append("0.91 0.93 0.94 rg %.2f %.2f %.2f %.2f re f" % (M, top - rh, cw, rh))
                pages[-1].append("0.75 0.75 0.75 RG 0.5 w %.2f %.2f %.2f %.2f re S" % (M, top - rh, cw, rh))
                for ci, lines in enumerate(cells):
                    cy = top - 4
                    for line in lines:
                        cy -= 13.5
                        cx = M + ci * colw + 5
                        for word, font, b in line:
                            text_at(cx, cy + 3, word, 10, font)
                            cx += _tw(_cp(word), 10, b)
                state["y"] = top - rh
            state["y"] -= 10
        elif kind == "spacer":
            state["y"] -= 14
        elif kind == "pagebreak":
            newpage()
        else:
            draw_para(val, 11, M, cw, False, align, 8)

    objs = []

    def add(body):
        objs.append(body)
        return len(objs)

    cat = add("")      # 1 catalog (filled later)
    pgs = add("")      # 2 pages (filled later)
    fonts = [add("<< /Type /Font /Subtype /Type1 /BaseFont /%s /Encoding /WinAnsiEncoding >>" % n)
             for n in ("Helvetica", "Helvetica-Bold", "Helvetica-Oblique")]
    kids = []
    for ops in pages:
        stream = "\n".join(ops).encode("cp1252", "replace")
        cid = add("<< /Length %d >>\nstream\n%s\nendstream" % (len(stream), stream.decode("latin-1")))
        pid = add("<< /Type /Page /Parent %d 0 R /MediaBox [0 0 %.0f %.0f] /Contents %d 0 R "
                  "/Resources << /Font << /F1 %d 0 R /F2 %d 0 R /F3 %d 0 R >> >> >>" % (pgs, W, H, cid, fonts[0], fonts[1], fonts[2]))
        kids.append(pid)
    objs[cat - 1] = "<< /Type /Catalog /Pages %d 0 R >>" % pgs
    objs[pgs - 1] = "<< /Type /Pages /Kids [%s] /Count %d >>" % (" ".join("%d 0 R" % k for k in kids), len(kids))
    out = bytearray(b"%PDF-1.4\n")
    offsets = []
    for n, body in enumerate(objs, 1):
        offsets.append(len(out))
        out += ("%d 0 obj\n" % n).encode() + body.encode("latin-1") + b"\nendobj\n"
    xref = len(out)
    out += ("xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1)).encode()
    for off in offsets:
        out += ("%010d 00000 n \n" % off).encode()
    out += ("trailer\n<< /Size %d /Root %d 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, cat, xref)).encode()
    with open(path, "wb") as f:
        f.write(bytes(out))
    return path
</script>

<script type="text/plain" id="py-worker-src">
/* Pyodide worker. One long-lived interpreter; every run gets fresh globals. */
// Where Pyodide is loaded from: Cognita's own Cloudflare Pages site (built by
// scripts/build-pyodide-bundle.mjs), with the version in the path. The iframe
// CSP in vercel.json allows only this host. To roll back to the public CDN,
// set this to 'https://cdn.jsdelivr.net/pyodide/v0.29.5/full/' and put
// https://cdn.jsdelivr.net back in that CSP.
var PYODIDE_BASE_URL = 'https://pyodide.cognita.com.ng/v0.29.5/';
var pyodide = null;
var loading = null;
var post = function (m) { self.postMessage(m); };

var RUNNER = [
  'import sys, os, runpy, traceback',
  'os.environ["MPLBACKEND"] = "Agg"',
  'def __cognita_run(mode, code, file, args, cwd):',
  '    os.chdir(cwd)',
  '    sys.argv = ([file] if mode == "file" else (["-c"] if mode == "code" else [code])) + list(args)',
  '    sys.path.insert(0, cwd)',
  '    try:',
  '        if mode == "module":',
  '            runpy.run_module(code, run_name="__main__", alter_sys=True)',
  '        else:',
  '            src = open(file).read() if mode == "file" else code',
  '            fname = file if mode == "file" else "<string>"',
  '            g = {"__name__": "__main__", "__file__": fname}',
  '            exec(compile(src, fname, "exec"), g)',
  '        return 0',
  '    except SystemExit as e:',
  '        c = e.code',
  '        if c is None: return 0',
  '        if isinstance(c, int): return c',
  '        sys.stderr.write(str(c) + "\\n"); return 1',
  '    except BaseException as e:',
  '        tb = e.__traceback__.tb_next if e.__traceback__ is not None else None',
  '        traceback.print_exception(type(e), e, tb)',
  '        return 1',
  '    finally:',
  '        try: sys.path.remove(cwd)',
  '        except ValueError: pass'
].join('\n');

async function boot() {
  if (pyodide) return pyodide;
  if (loading) return loading;
  loading = (async function () {
    post({ t: 'status', text: 'Starting Python\u2026' });

          else { b.setAttribute('value', a.value); if (a.checked) b.setAttribute('checked', ''); else b.removeAttribute('checked'); }
        }
        // Keep the page's own scroll position (a page that scrolled itself before the shot).
        var sy = window.pageYOffset || 0;
        var body = clone.getElementsByTagName('body')[0];
        if (body && sy && !cfg.fullPage) { var wrap = document.createElement('div'); wrap.setAttribute('style', 'position:relative;top:' + (-sy) + 'px'); while (body.firstChild) wrap.appendChild(body.firstChild); body.appendChild(wrap); }
        clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        clone.style.minHeight = fullH + 'px'; clone.style.width = w + 'px';
        // A body background normally paints the whole page; inside the copy it must be set on the root.
        var dcs = getComputedStyle(de), bcs = document.body ? getComputedStyle(document.body) : null;
        if (bcs && (dcs.backgroundColor === 'rgba(0, 0, 0, 0)' || dcs.backgroundColor === 'transparent') && dcs.backgroundImage === 'none') {
          clone.style.backgroundColor = bcs.backgroundColor; if (bcs.backgroundImage !== 'none') { clone.style.backgroundImage = bcs.backgroundImage; clone.style.backgroundSize = bcs.backgroundSize; clone.style.backgroundRepeat = bcs.backgroundRepeat; }
        }
        var xml = new XMLSerializer().serializeToString(clone);
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + fullH + '"><foreignObject x="0" y="0" width="' + w + '" height="' + fullH + '">' + xml + '</foreignObject></svg>';
        var im = new Image();
        im.onload = function () {
          try {
            var scale = Math.min(1, 900 / w), cw = Math.round(w * scale), ch = Math.round(fullH * scale);
            var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
            var cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cw, ch);
            cx.drawImage(im, 0, 0, cw, ch);
            var q = 0.72, out = cv.toDataURL('image/jpeg', q);
            while (out.length > 330000 && q > 0.3) { q -= 0.15; out = cv.toDataURL('image/jpeg', q); }
            fin(out.length <= 330000 ? { dataUrl: out, width: cw, height: ch, fullPage: !!cfg.fullPage } : null);
          } catch (e) { fin(null); }
        };
        im.onerror = function () { fin(null); };
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        setTimeout(function () { fin(null); }, 4000);
      } catch (e) { fin(null); }
    }
    post('hello', {});
    window.addEventListener('load', function () { setTimeout(function () {
      var rep; try { rep = report(); } catch (e) { rep = { reportError: String(e && e.message || e), console: logs, errors: errors }; }
      if (cfg.screenshot === false) { rep.screenshotSkipped = true; post('report', rep); return; }
      takeShot(function (shot) { post('report', rep, shot); });
    }, cfg.waitMs); });
  }

  function inlineLocalAssets(html, dir, missing) {
    function rd(ref) {
      if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) return null;
      var p = Shell.resolvePath(ref.split(/[?#]/)[0], dir);
      if (p && vfs.isFile(p)) return vfs.readText(p);
      missing.push(ref); return null;
    }
    html = html.replace(/<link\b[^>]*>/gi, function (tag) {
      if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
      var m = tag.match(/href\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s"'>]+))/i); if (!m) return tag; m[1] = m[1] || m[2] || m[3];
      var css = rd(m[1]); return css === null ? tag : '<style>' + css.replace(/<\/style/gi, '<\\/style') + '</style>';
    });
    html = html.replace(/<script\b([^>]*?)\bsrc\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s"'>]+))([^>]*)>\s*<\/script>/gi, function (tag, pre, q1, q2, q3, post) {
      var src = q1 || q2 || q3, js = rd(src); return js === null ? tag : '<script' + pre + post + '>' + js.replace(/<\/script/gi, '<\\/script') + '</scr' + 'ipt>';
    });
    return html;
  }

  // Only a small JPEG data address from the test page is accepted as a screenshot.
  function validShot(sh) {
    if (!sh || typeof sh.dataUrl !== 'string' || sh.dataUrl.length > 340000) return null;
    if (!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(sh.dataUrl)) return null;
    return { dataUrl: sh.dataUrl, width: Math.min(Math.max(parseInt(sh.width, 10) || 0, 1), 2000), height: Math.min(Math.max(parseInt(sh.height, 10) || 0, 1), 3000), fullPage: !!sh.fullPage };
  }

  async function runBrowserTest(a, io, limits, id) {
    var html, dir = Shell.ROOT, missing = [];
    if (a.path) {
      var fp = relPath(a.path); if (!fp) bad(a.path);
      if (!vfs.isFile(fp)) throw new Error(fp + ' does not exist.');
      html = vfs.readText(fp); dir = fp.slice(0, fp.lastIndexOf('/')) || Shell.ROOT;
    } else html = String(a.html || '');
    if (!html.trim()) throw new Error('The page is empty.');
    html = inlineLocalAssets(html, dir, missing);
    var cfg = {
      waitMs: Math.min(Math.max(parseInt(a.wait_ms, 10) || 300, 0), 5000),
      touch: !!a.touch,
      screenshot: a.screenshot !== false,
      fullPage: !!a.full_page,
      selectors: Array.isArray(a.selectors) ? a.selectors.filter(function (s) { return typeof s === 'string'; }).slice(0, 10) : []
    };
    var width = Math.min(Math.max(parseInt(a.width, 10) || 1024, 200), 2000), height = Math.min(Math.max(parseInt(a.height, 10) || 768, 200), 3000);
    var token = 'cog' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    var meta = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' \'unsafe-eval\'; style-src \'unsafe-inline\'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'">';
    var inject = meta + '<scr' + 'ipt>(' + collectorMain.toString() + ')(' + JSON.stringify(token) + ',' + JSON.stringify(cfg) + ');</scr' + 'ipt>';
    var dt = html.match(/^\s*<!doctype[^>]*>/i);
    var doc = dt ? dt[0] + inject + html.slice(dt[0].length) : inject + html;
    var totalMs = Math.min(limits.timeoutMs || 20000, cfg.waitMs + 12000);
    return new Promise(function (resolve) {
      var fr = document.createElement('iframe'), helloSeen = false, finished = false;
      fr.setAttribute('sandbox', 'allow-scripts');
      fr.style.cssText = 'position:fixed;left:0;top:0;border:0;visibility:hidden;width:' + width + 'px;height:' + height + 'px';
      function end(code, rep, fallback, why, shot) {
        if (finished) return; finished = true; clearTimeout(timer); window.removeEventListener('message', onMsg);
        try { fr.remove(); } catch (e) {}
        if (rep) {
          if (missing.length) rep.missingLocalFiles = missing.slice(0, 10);
          var probs = [];
          if (rep.errors && rep.errors.length) probs.push(rep.errors.length + ' script error(s)');
          if (rep.failedResources && rep.failedResources.length) probs.push(rep.failedResources.length + ' resource(s) failed to load');
          if (rep.blocked && rep.blocked.length) probs.push(rep.blocked.length + ' request(s) blocked (no internet here)');
          if (missing.length) probs.push(missing.length + ' linked local file(s) missing');
          if (rep.horizontalScroll) probs.push('page scrolls sideways at ' + rep.viewport.width + ' px');
          if (rep.brokenImages && rep.brokenImages.length) probs.push(rep.brokenImages.length + ' broken image(s)');
          io.out((shot ? 'A screenshot of the page was captured and is shown to the user (you cannot see it; rely on the measurements below).\n' : (rep.screenshotSkipped ? '' : 'No screenshot could be captured in this browser; rely on the measurements below.\n')) + (probs.length ? 'PROBLEMS FOUND: ' + probs.join('; ') : 'NO PROBLEMS FOUND by these checks') + '\n' + JSON.stringify(rep, null, 1).slice(0, limits.maxOutputChars || 12000) + '\n');
        } else io.err(why + '\n');
        resolve({ code: code, fallback: fallback, screenshot: shot || null, previewHtml: rep ? html.slice(0, 200000) : null, viewport: { width: width, height: height } });
      }
      function onMsg(ev) {
        var m = ev.data; if (ev.source !== fr.contentWindow || !m || m.cog !== token) return;
        if (m.type === 'hello') helloSeen = true;
        else if (m.type === 'report') end(0, m.data && typeof m.data === 'object' ? m.data : {}, null, null, validShot(m.shot));
      }
      var timer = setTimeout(function () {
        if (helloSeen) end(124, null, null, 'The page did not finish loading within ' + Math.round(totalMs / 1000) + ' s. It may have an endless loop or wait for something that never arrives.');
        else end(1, null, { html: html.slice(0, 200000), selectors: cfg.selectors, reason: 'the test page could not start in this browser' }, 'This browser could not run the test page.');
      }, totalMs);
      active = { id: id, kill: function () { end(130, null, null, 'Stopped.'); } };
      window.addEventListener('message', onMsg);
      try { fr.srcdoc = doc; document.body.appendChild(fr); }
      catch (e) { end(1, null, { html: html.slice(0, 200000), selectors: cfg.selectors, reason: 'iframes are not supported here' }, 'This browser could not run the test page.'); }
    });
  }

  async function execTool(call) {
    var name = call.name, a = call.args || {}, limits = call.limits || {};
    vfs.setLimits({ maxFileBytes: limits.maxFileBytes, maxWorkspaceBytes: limits.maxWorkspaceBytes });
    var before = vfs.versions();
    var col = makeCollector(call.id, limits);
    var io = { out: function (t) { col.add('stdout', t); }, err: function (t) { col.add('stderr', t); } };
    var exitCode = 0, command = '', note, fallback, screenshot, previewHtml, previewSize;
    var ctx = {
      fs: vfs, cwd: cwd, env: env, maxOutput: limits.maxOutputChars || 12000,
      // A command line such as "cd src && python a.py" must run Python from src.
      runPython: function (spec, shellIo) { cwd = ctx.cwd; return runPython(spec, shellIo, limits, call.id); },
      runJs: function (spec, shellIo) { cwd = ctx.cwd; return runJs(spec, shellIo, limits, call.id); },
      pipInstall: function (pkgs, shellIo, listOnly) { return pipInstall(pkgs, shellIo, listOnly, limits, call.id); },
      onOutput: null
    };
    var t0 = performance.now();
    try {
      switch (name) {
        case 'sandbox_create_workspace':
          if (a.reset) { vfs.reset(); offered.clear(); cwd = Shell.ROOT; pySyncedVersion = -1; }
          command = a.reset ? 'reset workspace' : 'workspace'; io.out('Workspace ready at ' + Shell.ROOT + ' (' + vfs.files.size + ' files).\n'); break;
        case 'sandbox_get_working_directory': command = 'pwd'; io.out(cwd + '\n'); break;
        case 'sandbox_write_file': {
          var wp = relPath(a.path); if (!wp) bad(a.path);
          vfs.writeFile(wp, String(a.content)); command = (a.imported ? 'import ' : 'write ') + wp;
          io.out((a.imported ? 'Placed ' : 'Wrote ') + wp + ' (' + enc.encode(String(a.content)).length + ' bytes).\n'); break;
        }
        case 'sandbox_read_file': {
          var rp = relPath(a.path); if (!rp) bad(a.path);
          var text = vfs.readText(rp), cap = Math.min(Math.max(parseInt(a.maxChars, 10) || 8000, 1), 20000);
          command = 'read ' + rp; io.out(text.length > cap ? text.slice(0, cap) + '\n[file continues: ' + (text.length - cap) + ' more characters]\n' : text); break;
        }
        case 'sandbox_list_files': {
          var lp = relPath(a.path || '.'); if (!lp) bad(a.path);
          command = 'ls ' + lp;
          if (!vfs.isDir(lp)) throw new Error(lp + ' is not a folder.');
          if (a.recursive) { vfs.walk(lp).forEach(function (f) { io.out(f + '  ' + vfs.readBytes(f).length + ' bytes\n'); }); if (!vfs.walk(lp).length) io.out('(no files)\n'); }
          else { var es = vfs.list(lp); es.forEach(function (e) { io.out((e.type === 'dir' ? 'dir   ' : 'file  ') + e.name + (e.type === 'file' ? '  ' + e.size + ' bytes' : '') + '\n'); }); if (!es.length) io.out('(empty)\n'); }
          break;
        }
        case 'sandbox_make_directory': { var mp = relPath(a.path); if (!mp) bad(a.path); vfs.mkdirp(mp); command = 'mkdir ' + mp; io.out('Created ' + mp + '\n'); break; }
        case 'sandbox_move_file': {
          var f1 = relPath(a.from), f2 = relPath(a.to); if (!f1) bad(a.from); if (!f2) bad(a.to);
          vfs.move(f1, f2); command = 'mv ' + f1 + ' ' + f2; io.out('Moved.\n'); break;
        }
        case 'sandbox_delete_file': {
          var dp = relPath(a.path); if (!dp) bad(a.path);
          if (dp === Shell.ROOT) throw new Error('The workspace root cannot be deleted. Use reset instead.');
          vfs.remove(dp, true); offered.delete(dp); if (cwd === dp || cwd.indexOf(dp + '/') === 0) cwd = Shell.ROOT;
          command = 'rm ' + dp; io.out('Deleted ' + dp + '\n'); break;
        }
        case 'sandbox_offer_file': {
          var op = relPath(a.path); if (!op) bad(a.path);
          if (!vfs.isFile(op)) throw new Error(op + ' does not exist.');
          offered.set(op, String(a.title || Shell.basename(op)).slice(0, 120)); command = 'offer ' + op; io.out('Ready for download: ' + op + '\n');
          // An offered web page also gets a live preview for the person (local css/js inlined, size capped).
          if (/\.html?$/i.test(op)) {
            try {
              var ph = inlineLocalAssets(vfs.readText(op), op.slice(0, op.lastIndexOf('/')) || Shell.ROOT, []);
              if (ph.length <= 200000) { previewHtml = ph; previewSize = { width: 1024, height: 480 }; }
            } catch (e) { /* no preview; the download still works */ }
          }
          break;
        }
        case 'sandbox_run_python': {
          var pf = null;
          if (a.filename) { pf = relPath(a.filename); if (!pf) bad(a.filename); vfs.writeFile(pf, String(a.code)); }
          command = pf ? 'python ' + pf : 'python (inline code)';
          exitCode = await runPython(pf ? { mode: 'file', file: pf, args: [] } : { mode: 'code', code: String(a.code), args: [] }, io, limits, call.id);
          break;
        }
        case 'sandbox_run_javascript': command = 'node (inline code)'; exitCode = await runJs({ code: String(a.code) }, io, limits, call.id); break;
        case 'sandbox_run_tests': {
          var runner = a.runner === 'pytest' ? 'pytest' : 'unittest', tp = a.path ? relPath(a.path) : null;
          if (a.path && !tp) bad(a.path);
          command = runner + (tp ? ' ' + tp : '');
          if (runner === 'pytest') exitCode = await runPython({ mode: 'module', code: 'pytest', args: tp ? [tp] : ['-q'] }, io, limits, call.id);
          else exitCode = await runPython({ mode: 'module', code: 'unittest', args: tp && vfs.isFile(tp) ? ['-v', tp] : ['discover', '-v'].concat(tp ? ['-s', tp] : []) }, io, limits, call.id);
          break;
        }
        case 'sandbox_run_command': {
          command = String(a.command);
          var r = await Shell.runShell(command, Object.assign(ctx, { onOutput: function (s, t) { send({ t: 'out', id: call.id, stream: s, text: t }); } }));
          cwd = ctx.cwd; exitCode = r.exitCode; col.stdout = r.stdout; col.stderr = r.stderr; col.truncated = col.truncated || r.truncated;
          break;
        }
        case 'sandbox_browser_test': {
          command = 'browser test ' + (a.path ? String(a.path) : '(inline html)');
          var bt = await runBrowserTest(a, io, limits, call.id);
          exitCode = bt.code; fallback = bt.fallback || undefined; screenshot = bt.screenshot || undefined; previewHtml = bt.previewHtml || undefined; previewSize = bt.viewport;
          break;
        }
        default:
          exitCode = 127; io.err('This sandbox does not support ' + name + '.\n'); command = name;
      }
    } catch (e) {
      exitCode = exitCode || 1; io.err((e && e.message || String(e)) + '\n');
    }
    var changes = vfs.diffSince(before);
    var res = {
      command: command, cwd: cwd, stdout: col.stdout, stderr: col.stderr, exitCode: exitCode,
      durationMs: Math.round(performance.now() - t0), truncated: col.truncated, files: changes,
      cancelled: exitCode === 130 || undefined, note: note, fallback: fallback,
      screenshot: screenshot, previewHtml: previewHtml, previewSize: previewSize
    };
    var off = [];
    offered.forEach(function (title, p) { if (vfs.isFile(p)) off.push({ path: p, title: title, size: vfs.readBytes(p).length }); });
    if (name === 'sandbox_offer_file' || off.length) res.offered = off;
    return { result: res, changed: changes.length > 0 };
  }

  function exportSnapshot() {
    var files = [], transfer = [];
    vfs.files.forEach(function (f, p) { var b = f.data.slice().buffer; files.push({ path: p, data: b }); transfer.push(b); });
    return { snapshot: { files: files, dirs: Array.from(vfs.dirs), cwd: cwd, offered: Array.from(offered.entries()) }, transfer: transfer };
  }

  // ── Messages from the parent page ───────────────────────────────
  window.addEventListener('message', function (ev) {
    if (ev.source !== parentWin) return;
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.t === 'call') {
      queue = queue.then(async function () {
        var out;
        try { out = await execTool(m.call); }
        catch (e) { out = { result: { command: m.call.name, cwd: cwd, stdout: '', stderr: String(e && e.message || e), exitCode: 1, durationMs: 0 }, changed: false }; }
        active = null;
        var pack = out.changed ? exportSnapshot() : null;
        send({ t: 'result', id: m.call.id, result: out.result, snapshot: pack ? pack.snapshot : null, cwd: cwd }, pack ? pack.transfer : []);
      });
    } else if (m.t === 'cancel') {
      if (active && active.id === m.id) active.kill();
    } else if (m.t === 'load') {
      vfs.reset(); offered.clear(); pySyncedVersion = -1;
      var s = m.snapshot || {};
      (s.dirs || []).forEach(function (d) { try { vfs.dirs.add(d); } catch (e) {} });
      (s.files || []).forEach(function (f) { try { vfs.files.set(f.path, { data: new Uint8Array(f.data), version: ++vfs.version }); } catch (e) {} });
      cwd = s.cwd && (s.cwd === Shell.ROOT || s.cwd.indexOf(Shell.ROOT + '/') === 0) ? s.cwd : Shell.ROOT;
      (s.offered || []).forEach(function (p) { if (vfs.isFile(p[0])) offered.set(p[0], p[1]); });
      send({ t: 'loaded', id: m.id });
    } else if (m.t === 'put') {
      // Files the person attached. They land in /workspace/uploads, with a
      // number added to the name if one with that name is already there.
      queue = queue.then(function () {
        var lim = m.limits || {};
        vfs.setLimits({ maxFileBytes: lim.maxFileBytes || 2097152, maxWorkspaceBytes: lim.maxWorkspaceBytes || 10485760 });
        var saved = [], errors = [], dir = Shell.ROOT + '/uploads';
        (m.files || []).forEach(function (f) {
          try {
            var base = String(f.name || 'file').split(/[\\/]/).pop().replace(/[\u0000-\u001f]/g, '').replace(/^\.+/, '').slice(0, 100) || 'file';
            var dot = base.lastIndexOf('.'), stem = dot > 0 ? base.slice(0, dot) : base, ext = dot > 0 ? base.slice(dot) : '';
            var name = base, n = 2;
            while (vfs.exists(dir + '/' + name)) { name = stem + '-' + (n++) + ext; }
            vfs.mkdirp(dir);
            vfs.writeFile(dir + '/' + name, new Uint8Array(f.data));
            saved.push({ name: f.name, path: dir + '/' + name, size: f.data.byteLength });
          } catch (e) { errors.push({ name: f.name, error: String(e && e.message || e) }); }
        });
        var pack = saved.length ? exportSnapshot() : null;
        send({ t: 'stored', id: m.id, ok: errors.length === 0, saved: saved, errors: errors, snapshot: pack ? pack.snapshot : null }, pack ? pack.transfer : []);
      });
    } else if (m.t === 'export') {
      var p = Shell.resolvePath(String(m.path), Shell.ROOT);
      if (!p || !vfs.isFile(p)) { send({ t: 'exported', id: m.id, ok: false }); return; }
      var buf = vfs.readBytes(p).slice().buffer;
      send({ t: 'exported', id: m.id, ok: true, path: p, data: buf }, [buf]);
    } else if (m.t === 'warm') {
      getPy().then(function () { send({ t: 'warmed', id: m.id, ok: true }); }, function (e) { send({ t: 'warmed', id: m.id, ok: false, message: e.message }); });
    }
  });

  send({ t: 'ready' });
})();
</script>
</body>
</html>
