    SW, SH = 12192000, 6858000
    m = re.search(r'<p:sldSz cx="(\d+)" cy="(\d+)"', z.read("ppt/presentation.xml").decode("utf8", "ignore"))
    if m:
        SW, SH = int(m.group(1)), int(m.group(2))
    slides = []
    for n in names:
        root = ET.fromstring(z.read(n))
        relp = n.replace("slides/", "slides/_rels/") + ".rels"
        rels = {}
        if relp in z.namelist():
            for rid, tgt in re.findall(r'Id="([^"]+)"[^>]*Target="([^"]+)"', z.read(relp).decode("utf8", "ignore")):
                rels[rid] = tgt
            for tgt, rid in re.findall(r'Target="([^"]+)"[^>]*Id="([^"]+)"', z.read(relp).decode("utf8", "ignore")):
                rels.setdefault(rid, tgt)
        bg = "FFFFFF"
        bgn = root.find(".//" + P + "bg")
        if bgn is not None and bgn.find(".//" + A + "srgbClr") is not None:
            bg = bgn.find(".//" + A + "srgbClr").get("val")
        sh, pics, tables = [], [], []
        for el in root.iter():
            if el.tag == P + "sp":
                nm = (el.find(".//" + P + "cNvPr").get("name") or "").strip()
                off, ext = el.find(".//" + A + "off"), el.find(".//" + A + "ext")
                if off is None or ext is None:
                    continue
                fill = None
                spPr = el.find(P + "spPr")
                if spPr is not None and spPr.find(A + "solidFill") is not None and spPr.find(A + "solidFill").find(A + "srgbClr") is not None:
                    fill = spPr.find(A + "solidFill").find(A + "srgbClr").get("val")
                paras = []
                for p in el.findall(".//" + A + "p"):
                    t = "".join(x.text or "" for x in p.iter(A + "t"))
                    rp = [r for r in p.iter(A + "rPr")]
                    szs = [int(r.get("sz")) / 100.0 for r in rp if r.get("sz")]
                    cols = [c.get("val") for r in rp for c in r.iter(A + "srgbClr")]
                    bullet = p.find(".//" + A + "buChar") is not None or p.find(".//" + A + "buAutoNum") is not None
                    paras.append({"t": t, "sz": max(szs) if szs else 18.0, "bold": any(r.get("b") == "1" for r in rp), "cols": cols, "bullet": bullet})
                text = "\n".join(p["t"] for p in paras).strip()
                sh.append({"name": nm, "x": int(off.get("x")), "y": int(off.get("y")), "cx": int(ext.get("cx")), "cy": int(ext.get("cy")),
                           "fill": fill, "paras": paras, "text": text, "words": len(text.split())})
            elif el.tag == P + "pic":
                off, ext = el.find(".//" + A + "off"), el.find(".//" + A + "ext")
                bl = el.find(".//" + A + "blip")
                if off is None or ext is None:
                    continue
                nat = None
                try:
                    rid = bl.get(R + "embed")
                    tgt = rels.get(rid, "")
                    mp = "ppt/" + tgt.replace("../", "") if not tgt.startswith("/") else tgt[1:]
                    nat = _img_size(z.read(mp))
                except Exception:
                    nat = None
                crop = el.find(".//" + A + "srcRect") is not None
                pics.append({"x": int(off.get("x")), "y": int(off.get("y")), "cx": int(ext.get("cx")), "cy": int(ext.get("cy")), "nat": nat, "crop": crop})
            elif el.tag == P + "graphicFrame":
                off, ext = el.find(".//" + P + "xfrm/" + A + "off"), el.find(".//" + P + "xfrm/" + A + "ext")
                if off is not None and ext is not None:
                    tables.append({"x": int(off.get("x")), "y": int(off.get("y")), "cx": int(ext.get("cx")), "cy": int(ext.get("cy")),
                                   "text": " ".join(t.text or "" for t in el.iter(A + "t"))})
        slides.append({"bg": bg, "shapes": sh, "pics": pics, "tables": tables})
    return {"SW": SW, "SH": SH, "slides": slides}


def _taste_pptx(model):
    pen = []
    SW, SH, slides = model["SW"], model["SH"], model["slides"]
    content = slides[1:] if len(slides) > 1 else slides
    title_boxes, sigs, allcols, totw, filler_all = [], [], set(), 0, []
    for i, s in enumerate(slides, 1):
        txt = [x for x in s["shapes"] if x["text"] and not any(k in x["name"] for k in ("Footer", "PageNo", "Deco"))]
        for x in s["shapes"]:
            for p in x["paras"]:
                allcols.update(c.upper() for c in p["cols"])
            if x["fill"] and x["cx"] * x["cy"] < SW * SH * 0.5:
                allcols.add(x["fill"].upper())
        body = [x for x in txt if "Title" not in x["name"]]
        titles = [x for x in txt if "Title" in x["name"]]
        is_content = i > 1 or len(slides) == 1
        if is_content and titles and body:
            tsz = max(p["sz"] for p in titles[0]["paras"] if p["t"].strip()) if any(p["t"].strip() for p in titles[0]["paras"]) else 0
            bsz = max([p["sz"] for x in body for p in x["paras"] if p["t"].strip()] or [0])
            if tsz and bsz and tsz < bsz * 1.35:
                pen.append((6, "Slide %d: the title (%d pt) is barely bigger than the body (%d pt). Make the title at least 1.4x the body size so the eye knows where to start." % (i, tsz, bsz)))
        if is_content and titles:
            title_boxes.append((i, titles[0]["x"], titles[0]["y"], titles[0]["cx"]))
        # margins
        out = [x for x in txt if x["x"] < SW * 0.04 or x["x"] + x["cx"] > SW * 0.96]
        out += [{"name": "picture"} for q in s["pics"] if q["x"] < SW * 0.03 or q["x"] + q["cx"] > SW * 0.97]
        if is_content and out:
            pen.append((4, "Slide %d: content sits closer than 4%% to the slide edge. Keep a clear margin on every side." % i))
        # alignment: too many different left edges
        lefts = set(round(x["x"] / (SW * 0.015)) for x in txt)
        lefts |= set(round(q["x"] / (SW * 0.015)) for q in s["pics"])
        if is_content and len(lefts) > 5:
            pen.append((4, "Slide %d: text starts at %d different left edges. Line things up on two or three shared edges." % (i, len(lefts))))
        # whitespace and balance
        boxes = [(x["x"], x["y"], x["cx"], x["cy"]) for x in txt if x["words"] > 0] + [(q["x"], q["y"], q["cx"], q["cy"]) for q in s["pics"]] + [(t["x"], t["y"], t["cx"], t["cy"]) for t in s["tables"]]
        if is_content and boxes:
            x0, y0 = min(b[0] for b in boxes), min(b[1] for b in boxes)
            x1, y1 = max(b[0] + b[2] for b in boxes), max(b[1] + b[3] for b in boxes)
            cover = (x1 - x0) * (y1 - y0) / float(SW * SH)
            if cover < 0.20 and len(boxes) <= 3:
                pen.append((5, "Slide %d: the content fills only %d%% of the slide, so it looks empty. Add the missing point or enlarge the content." % (i, cover * 100)))
            elif cover > 0.82:
                pen.append((5, "Slide %d: the slide is crammed edge to edge. Cut something so it can breathe." % i))
            mass = sum(b[2] * b[3] for b in boxes) or 1
            mx = sum((b[0] + b[2] / 2.0) * b[2] * b[3] for b in boxes) / mass
            if len(boxes) >= 2 and abs(mx - SW / 2.0) > SW * 0.24:
                pen.append((4, "Slide %d: everything leans to one side. Balance it with a picture, a table or a second column." % i))
        # words and walls of text
        words = sum(x["words"] for x in txt) + sum(len(t["text"].split()) for t in s["tables"])
        totw += words
        for x in body:
            if x["words"] > 55 and not any(p["bullet"] for p in x["paras"]):
                pen.append((5, "Slide %d: '%s' is a block of %d words. Break it into short points or numbered steps." % (i, x["name"], x["words"])))
                break
        # stretched pictures
        for q in s["pics"]:
            if q["nat"] and not q["crop"] and q["cy"] and q["nat"][1]:
                ratio = (q["cx"] / float(q["cy"])) / (q["nat"][0] / float(q["nat"][1]))
                if abs(ratio - 1) > 0.08:
                    pen.append((8, "Slide %d: a picture is stretched out of shape (%d%% off its real proportions). Keep the original width-to-height ratio." % (i, abs(ratio - 1) * 100)))
                    break
        filler_all.append(" ".join(x["text"] for x in txt))
        sigs.append(tuple(sorted((x["name"].split()[0] if x["name"] else "x") for x in txt)) + tuple("pic" for _ in s["pics"]) + tuple("table" for _ in s["tables"]))
    _t_filler(" ".join(filler_all), "The deck", pen)
    if len(title_boxes) >= 3:
        xs = [t[1] for t in title_boxes]
        ys = [t[2] for t in title_boxes]
        if max(xs) - min(xs) > SW * 0.02 or max(ys) - min(ys) > SH * 0.03:
            pen.append((6, "The slide titles jump around from slide to slide. Put every title in the same spot at the same size."))
    if len(allcols) > 12:
        pen.append((6, "The deck uses %d different colours. Stay with one main colour, one accent and neutrals." % len(allcols)))
    if len(slides) >= 5 and len(set(sigs[1:])) == 1:
        pen.append((8, "Every content slide has the same layout. Mix in a table, numbered steps, a big number or a picture where the content suits it."))
    elif len(sigs) >= 6:
        run, best = 1, 1
        for a, b in zip(sigs[1:], sigs[2:]):
            run = run + 1 if a == b else 1
            best = max(best, run)
        if best >= 5:
            pen.append((4, "Five or more slides in a row look identical. Break the rhythm."))
    if len(content) >= 3 and totw / float(len(slides)) > 70:
        pen.append((6, "The slides average %d words each. Presentations read better at 30 to 50 words a slide." % (totw / len(slides))))
    return pen


def _font(size):
    from PIL import ImageFont
    for p in ("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", "DejaVuSans.ttf", "/usr/share/fonts/dejavu/DejaVuSans.ttf"):
        try:
            return ImageFont.truetype(p, int(size))
        except Exception:
            pass
    try:
        return ImageFont.load_default(size=int(size))
    except Exception:
        return ImageFont.load_default()


def _wrap_px(draw, text, font, maxw):
    out = []
    for part in text.split("\n"):
        line = ""
        for w in part.split(" "):
            t = (line + " " + w).strip()
            if draw.textlength(t, font=font) <= maxw or not line:
                line = t
            else:
                out.append(line)
                line = w
        out.append(line)
    return out


def _draw_pptx(model, maxn=6, width=480):
    from PIL import Image, ImageDraw
    SW, SH = model["SW"], model["SH"]
    k = width / float(SW)
    H = int(SH * k)
    shots = []
    for s in model["slides"][:maxn]:
        bg = s["bg"] if re.match(r"^[0-9A-Fa-f]{6}$", s["bg"] or "") else "FFFFFF"
        im = Image.new("RGB", (width, H), "#" + bg)
        d = ImageDraw.Draw(im)
        for x in s["shapes"]:
            bx, by, bw, bh = x["x"] * k, x["y"] * k, x["cx"] * k, x["cy"] * k
            if x["fill"]:
                d.rectangle([bx, by, bx + bw, by + bh], fill="#" + x["fill"])
            yy = by + 3
            for p in x["paras"]:
                if not p["t"].strip():
                    yy += 4
                    continue
                px = max(7, p["sz"] * 12700 * k * 1.0)
                f = _font(px)
                col = "#" + (p["cols"][0] if p["cols"] else "222222")
                for ln in _wrap_px(d, p["t"], f, max(10, bw - 8)):
                    if yy > by + bh + 2 or yy > H:
                        break
                    d.text((bx + 4, yy), ln, fill=col, font=f)
                    yy += px * 1.2
        for q in s["pics"]:
            bx, by = q["x"] * k, q["y"] * k
            d.rectangle([bx, by, bx + q["cx"] * k, by + q["cy"] * k], outline="#888888", fill="#E6E6E6")
        for t in s["tables"]:
            bx, by = t["x"] * k, t["y"] * k
            d.rectangle([bx, by, bx + t["cx"] * k, by + t["cy"] * k], outline="#888888", fill="#F3F3F3")
        shots.append(im)
    return shots


def _docx_model(path):
    import xml.etree.ElementTree as ET
    W = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
    Aa = "{http://schemas.openxmlformats.org/drawingml/2006/main}"
    z = zipfile.ZipFile(path)
    xml = z.read("word/document.xml").decode("utf8", "ignore")
    root = ET.fromstring(xml)
    paras, imgs = [], []
    for p in root.iter(W + "p"):
        t = "".join(x.text or "" for x in p.iter(W + "t"))
        st = p.find(W + "pPr/" + W + "pStyle")
        style = (st.get(W + "val") if st is not None else "") or ""
        szs = [int(s.get(W + "val")) / 2.0 for s in p.iter(W + "sz") if s.get(W + "val", "").isdigit()]
        fonts = [f.get(W + "ascii") for f in p.iter(W + "rFonts") if f.get(W + "ascii")]
        paras.append({"t": t, "style": style, "sz": max(szs) if szs else 11.0, "fonts": fonts,
                      "bold": p.find(".//" + W + "b") is not None, "bullet": p.find(".//" + W + "numPr") is not None})
        for dr in p.iter("{http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing}extent"):
            imgs.append((int(dr.get("cx", 0)), int(dr.get("cy", 0)), p))
    nat = []
    for n in z.namelist():
        if n.startswith("word/media/"):
            nat.append(_img_size(z.read(n)))
    mar = re.search(r"<w:pgMar[^>]*>", xml)
    margins = {}
    if mar:
        for k2, v in re.findall(r'w:(top|left|right|bottom)="(-?\d+)"', mar.group(0)):
            margins[k2] = int(v)
    return {"paras": paras, "imgs": [(a, b) for a, b, _ in imgs], "nat": nat, "margins": margins}


def _taste_docx(m):
    pen = []
    paras = m["paras"]
    words = sum(len(p["t"].split()) for p in paras)
    heads = [(p, int(re.sub(r"\D", "", p["style"]) or 1)) for p in paras if p["style"].lower().startswith("heading")]
    titles = [p for p in paras if p["style"].lower() == "title"]
    if words > 150 and not heads and not titles:
        pen.append((10, "There are no headings, so the reader cannot find their way. Add a title and section headings."))
    if words > 150 and heads and not titles and heads[0][1] != 1:
        pen.append((4, "The first heading is not a top-level heading. Start with a title or Heading 1."))
    last = 0
    for p, lv in heads:
        if last and lv > last + 1:
            pen.append((5, "Headings skip a level (Heading %d straight to Heading %d). Go down one level at a time." % (last, lv)))
            break
        last = lv
    walls = [p for p in paras if len(p["t"].split()) > 140]
    if walls:
        pen.append((min(12, 6 * len(walls)), "%d paragraph(s) run past 140 words. Split them, or turn a list inside them into bullets." % len(walls)))
    _bl = sum(1 for p in paras if p.get("bullet") and p["t"].strip())
    _pl = sum(1 for p in paras if not p.get("bullet") and len(p["t"].split()) >= 15)
    if _bl >= 8 and _bl > 2 * max(1, _pl):
        pen.append((10, "Most of the document is bullets (%d bullets, %d real paragraphs). Write explanations as full paragraphs and keep bullets for real lists." % (_bl, _pl)))
    fonts = set(f for p in paras for f in p["fonts"])
    if len(fonts) > 3:
        pen.append((5, "%d different fonts are used. Two is enough: one for headings, one for body." % len(fonts)))
    sizes = set(round(p["sz"]) for p in paras if p["t"].strip())
    if words > 250 and len(sizes) < 2 and not heads:
        pen.append((5, "Everything is one text size, so nothing stands out. Make headings larger than the body."))
    mg = m["margins"]
    if mg and min(mg.get(k, 1440) for k in ("top", "left", "right", "bottom")) < 720:
        pen.append((6, "The page margins are under 1.27 cm. Use about 2 cm so the text does not crowd the edge."))
    for i, (cx, cy) in enumerate(m["imgs"]):
        if i < len(m["nat"]) and m["nat"][i] and cy:
            r = (cx / float(cy)) / (m["nat"][i][0] / float(m["nat"][i][1]))
            if abs(r - 1) > 0.08:
                pen.append((8, "A picture is stretched out of shape. Keep its original width-to-height ratio."))
                break
    _t_filler(" ".join(p["t"] for p in paras), "The text", pen)
    return pen


def _draw_docx(m, maxn=3, width=420):
    from PIL import Image, ImageDraw
    H = int(width * 1.414)
    pages = []
    mx, my = int(width * 0.11), int(H * 0.09)
    k = width / 595.0

    def new():
        im = Image.new("RGB", (width, H), "white")
        return im, ImageDraw.Draw(im)
    im, d = new()
    y = my
    for p in m["paras"]:
        if not p["t"].strip():
            y += 5 * k
            continue
        sz = p["sz"] * (1.5 if p["style"].lower() == "title" else 1.0)
        if p["style"].lower().startswith("heading"):
            sz = max(sz, 15 - 2 * (int(re.sub(r"\D", "", p["style"]) or 1) - 1))
        px = max(6, sz * k)
        f = _font(px)
        for ln in _wrap_px(d, p["t"], f, width - 2 * mx):
            if y + px > H - my:
                pages.append(im)
                if len(pages) >= maxn:
                    return pages
                im, d = new()
                y = my
            d.text((mx, y), ln, fill="#111111", font=f)
            y += px * 1.35
        y += 4 * k
    pages.append(im)
    return pages[:maxn]


def _pdf_model(path):
    data = open(path, "rb").read()
    streams = [s for s in re.findall(rb"stream\n(.*?)\nendstream", data, re.S) if b" Tj" in s]
    pages = []
    for s in streams:
        items = []
        for blk in re.findall(rb"BT(.*?)ET", s, re.S):
            fs = re.search(rb"/F\d+ ([\d.]+) Tf", blk)
            td = re.search(rb"([\d.]+) ([\d.]+) Td", blk)
            tj = re.findall(rb"\(((?:\\.|[^\\)])*)\) Tj", blk)
            if td and tj:
                items.append({"x": float(td.group(1)), "y": float(td.group(2)), "sz": float(fs.group(1)) if fs else 11.0,
                              "t": b"".join(tj).decode("latin-1").replace("\\(", "(").replace("\\)", ")").replace("\\\\", "\\")})
        pages.append(items)
    mb = re.search(rb"/MediaBox\s*\[\s*0\s+0\s+([\d.]+)\s+([\d.]+)", data)
    size = (float(mb.group(1)), float(mb.group(2))) if mb else (595.0, 842.0)
    return {"pages": pages, "size": size}


def _taste_pdf(m):
    pen = []
    W, H = m["size"]
    items = [i for pg in m["pages"] for i in pg if i["y"] > 40 and i["t"].strip()]
    if not items:
        return pen
    body = [i for i in items if i["sz"] <= 13]
    lens = [len(i["t"]) for i in body]
    if lens and sum(lens) / float(len(lens)) > 100:
        pen.append((6, "Lines are very long (about %d characters). 60 to 90 characters a line is easier to read; widen the margins or use columns." % (sum(lens) / len(lens))))
    if min(i["x"] for i in items) < 36:
        pen.append((6, "Text starts less than 0.5 inch from the left edge. Use a margin of about 2 cm."))
    sizes = sorted(set(round(i["sz"]) for i in items))
    if len(items) > 25 and len(sizes) < 2:
        pen.append((8, "Everything is one text size, so there is no hierarchy. Make the title and headings clearly larger than the body."))
    elif sizes and len(sizes) > 5:
        pen.append((5, "%d different text sizes. Keep to a title, headings and body." % len(sizes)))
    bodysz = max(set(round(i["sz"]) for i in body) or {11}, key=lambda s: sum(1 for i in body if round(i["sz"]) == s)) if body else 11
    for pn, pg in enumerate(m["pages"], 1):
        rows = sorted([i for i in pg if i["y"] > 40 and i["t"].strip()], key=lambda i: -i["y"])
        if len(rows) >= 2 and rows[-1]["sz"] >= bodysz * 1.2 and rows[-1]["sz"] > 11:
            pen.append((8, "Page %d ends with a heading and no text under it. Move the heading to the next page." % pn))
            break
    for pn, pg in enumerate(m["pages"], 1):
        rows = [i for i in pg if i["y"] > 40 and i["t"].strip()]
        if len(rows) > 70:
            pen.append((5, "Page %d is a wall of text (%d lines). Add spacing, headings or bullets." % (pn, len(rows))))
            break
    _np = len(m["pages"])
    for pn, pg in enumerate(m["pages"], 1):
        rows = [i for i in pg if i["y"] > 40 and i["t"].strip()]
        if _np > 1 and len(rows) <= 6:
            # A short page 1 or last page with large type is a cover or back cover. That is right for
            # some documents (reports, proposals, brochures, books) and wrong for others (letters,
            # one-pagers, a 2-page request), so it is a note to decide on, not a fault.
            _cover = (pn == 1 or pn == _np) and any(i["sz"] >= bodysz * 1.5 for i in rows)
            if _cover:
                pen.append((0, "Page %d looks like a %s. Keep it only if this kind of document or the request calls for one (formal report, proposal, book, brochure); otherwise remove it so the content starts on page 1 and the page count matches what was asked." % (pn, "cover" if pn == 1 else "back cover")))
            elif pn < _np:
                pen.append((10, "Page %d is almost empty. Fill it, merge it with the next page, or remove it, keeping the page count the person asked for." % pn))
                break
    _all = [i for i in items if i["t"].strip()]
    _bul = sum(1 for i in _all if i["t"].strip() == u"\u2022")
    _words = sum(len(i["t"].split()) for i in _all)
    if _bul >= 8 and _words > 0 and _bul * 14 > _words * 0.6:
        pen.append((10, "Almost everything is bullets. Write the explanations as full paragraphs (\"p\" blocks) and keep bullets for real lists only."))
    _t_filler(" ".join(i["t"] for i in items), "The text", pen)
    return pen


def _draw_pdf(m, maxn=3, width=420):
    from PIL import Image, ImageDraw
    W, H = m["size"]
    k = width / W
    out = []
    for pg in m["pages"][:maxn]:
        im = Image.new("RGB", (width, int(H * k)), "white")
        d = ImageDraw.Draw(im)
        for i in pg:
            px = max(5, i["sz"] * k * 0.92)
            d.text((i["x"] * k, (H - i["y"]) * k - px), i["t"][:140], fill="#111111", font=_font(px))
        out.append(im)
    return out


def _taste_xlsx(path):
    pen = []
    z = zipfile.ZipFile(path)
    sheets = sorted(n for n in z.namelist() if re.match(r"xl/worksheets/sheet\d+\.xml$", n))
    styles = z.read("xl/styles.xml").decode("utf8", "ignore") if "xl/styles.xml" in z.namelist() else ""
    shared = z.read("xl/sharedStrings.xml").decode("utf8", "ignore") if "xl/sharedStrings.xml" in z.namelist() else ""
    for n in sheets:
        x = z.read(n).decode("utf8", "ignore")
        rows = re.findall(r"<row[^>]*>(.*?)</row>", x, re.S)
        if len(rows) < 2:
            continue
        first = re.findall(r'<c [^>]*?s="(\d+)"', rows[0])
        if not first or all(s == "0" for s in first):
            pen.append((14, "Sheet %s: the header row has no styling. Make it bold with a fill colour." % n.split("/")[-1]))
        if len(rows) > 15 and "state=\"frozen\"" not in x:
            pen.append((6, "Sheet %s: the header row is not frozen. Set ws.freeze_panes = 'A2'." % n.split("/")[-1]))
        raw = 0
        for tag, v in re.findall(r"<c ([^>]*)>\s*<v>([^<]*)</v>", "".join(rows[1:])):
            if 't="s"' in tag or 't="str"' in tag or 't="b"' in tag:
                continue
            try:
                num = float(v)
            except ValueError:
                continue
            sm = re.search(r'\bs="(\d+)"', tag)
            if (not sm or sm.group(1) == "0") and (abs(num) >= 10000 or (abs(num - round(num, 2)) > 1e-9)):
                raw += 1
        if raw >= 3:
            pen.append((10, "Sheet %s: %d numbers have no number format (long decimals or no thousands separators). Set cell.number_format, e.g. '#,##0.00'." % (n.split("/")[-1], raw)))
        if "<fill>" not in styles and "<fills" in styles and styles.count("<fill>") < 3 and first and all(s == "0" for s in first):
            pass
    _t_filler(shared, "The sheet text", pen)
    return pen


def _taste_img(path):
    pen = []
    try:
        from PIL import Image, ImageChops
    except Exception:
        return pen
    im = Image.open(path).convert("RGB")
    w, h = im.size
    if w < 1000:
        pen.append((8, "The picture is %d px wide. Save it larger (figsize and dpi=200) so it stays sharp." % w))
    if h and (w / float(h) > 3.2 or w / float(h) < 0.3):

    bg = im.getpixel((0, 0))
    box = ImageChops.difference(im, Image.new("RGB", im.size, bg)).convert("L").point(lambda v: 255 if v > 30 else 0).getbbox()
    if box:
        cover = (box[2] - box[0]) * (box[3] - box[1]) / float(w * h)
        if cover < 0.35:
            pen.append((16, "The content fills only %d%% of the picture; the rest is empty. Crop it or enlarge the content." % (cover * 100)))
        cx = (box[0] + box[2]) / 2.0
        if abs(cx - w / 2.0) > w * 0.2:
            pen.append((4, "The content leans to one side of the picture. Centre it."))
    return pen

    """Returns (score, messages, preview_images)."""
    pen, shots = [], []
    if ext == "pptx":
        mo = _slide_model(path)
        pen = _taste_pptx(mo)
        try:
            shots = _draw_pptx(mo)
        except Exception:
            shots = []
    elif ext == "docx":
        mo = _docx_model(path)
        pen = _taste_docx(mo)
        try:
            shots = _draw_docx(mo)
        except Exception:
            shots = []
    elif ext == "pdf":
        mo = _pdf_model(path)
        pen = _taste_pdf(mo)
        try:
            shots = _draw_pdf(mo)
        except Exception:
            shots = []
    elif ext == "xlsx":
        pen = _taste_xlsx(path)
    elif ext in ("png", "jpg", "jpeg"):
        pen = _taste_img(path)
    score = max(0, 100 - sum(p for p, _ in pen))
    return score, [m for _, m in sorted(pen, key=lambda t: -t[0])], shots


def _save_preview(shots):
    """Tile the drawn pages side by side into one small JPEG the page can pick up for the vision review."""
    import os
    from PIL import Image
    if not shots:
        return
    shots = shots[:6]
    h = max(s.size[1] for s in shots)
    cols = min(3, len(shots))
    rows = -(-len(shots) // cols)
    w = max(s.size[0] for s in shots)
    sheet = Image.new("RGB", (cols * (w + 8) + 8, rows * (h + 8) + 8), "#BBBBBB")
    for i, s in enumerate(shots):
        sheet.paste(s, (8 + (i % cols) * (w + 8), 8 + (i // cols) * (h + 8)))
    if sheet.size[0] > 1100:
        sheet = sheet.resize((1100, int(sheet.size[1] * 1100.0 / sheet.size[0])))
    os.makedirs("/workspace/.cognita-taste", exist_ok=True)
    for q in (62, 50, 40, 30):
        sheet.save("/workspace/.cognita-taste/preview.jpg", "JPEG", quality=q)
        if os.path.getsize("/workspace/.cognita-taste/preview.jpg") < 130000:
            break


def check(path, quiet=False):
    """Inspect a finished file for layout and content problems and return a short report.
    Run it on every file before offering it; fix what it lists, rebuild, and run it again until it says PASS."""
    import os
    path = str(path)
    name = os.path.basename(path)
    ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
    issues, notes = [], []
    try:
        if not os.path.exists(path):
            issues.append("The file does not exist.")
        elif os.path.getsize(path) < 50:
            issues.append("The file is empty.")
        elif ext == "pptx":
            _qa_pptx(path, issues, notes)
        elif ext == "docx":
            _qa_docx(path, issues, notes)
        elif ext == "pdf":
            _qa_pdf(path, issues, notes)
        elif ext in ("png", "jpg", "jpeg"):
            _qa_img(path, issues, notes)
        elif ext == "xlsx":
            _qa_xlsx(path, issues, notes)
        elif ext in ("html", "htm"):
            notes.append("check pages with the browser test tool instead")
    except Exception as e:
        notes.append("could not fully inspect this file (%s)" % str(e)[:80])
    # Taste: how the file looks, not only whether it is broken. Runs after the functional checks.
    if ext in ("pptx", "docx", "pdf", "xlsx", "png", "jpg", "jpeg") and os.path.exists(path) and os.path.getsize(path) >= 50:
        try:
            score, tmsgs, shots = _taste(path, ext)
            if score < _TASTE_PASS:
                issues.append("Design taste score %d/100 (it must reach %d). Fix these, most costly first:" % (score, _TASTE_PASS))
                issues.extend(tmsgs[:6])
            else:
                notes.append("taste %d/100" % score + ("; " + "; ".join(tmsgs[:2]) if tmsgs else ""))
            try:
                _save_preview(shots)
            except Exception:
                pass
        except Exception as e:
            notes.append("taste check skipped (%s)" % str(e)[:60])
    seen, uniq = set(), []
    for s in issues:
        if s not in seen:
            seen.add(s)
            uniq.append(s)
    head = "QA REPORT [%s]: " % name
    if uniq:
        return head + "NEEDS FIXES (%d)\n- " % len(uniq) + "\n- ".join(uniq[:10]) + "\nFix these, rebuild the file and run check() again."
    return head + "PASS" + ((" (" + "; ".join(notes) + ")") if notes else "")


def _with_check(fn):
    def wrapper(*a, **k):
        p = fn(*a, **k)
        try:
            print(check(p))
        except Exception as e:
            print("QA REPORT [%s]: could not inspect (%s)" % (p, str(e)[:60]))
        return p
    wrapper.__doc__ = fn.__doc__
    wrapper.__name__ = fn.__name__
    return wrapper


docx, pdf, pptx = _with_check(docx), _with_check(pdf), _with_check(pptx)

        }
        Array.prototype.forEach.call(clone.querySelectorAll('script,noscript,iframe,object,embed,meta[http-equiv]'), function (n) { n.remove(); });
        var liveIn = de.querySelectorAll('input,textarea,select'), cloneIn = clone.querySelectorAll('input,textarea,select');
        for (var j = 0; j < liveIn.length && j < cloneIn.length; j++) {
          var a = liveIn[j], b = cloneIn[j];
          if (a.tagName === 'TEXTAREA') b.textContent = a.value;
          else if (a.tagName === 'SELECT') Array.prototype.forEach.call(b.options, function (o, k) { if (a.options[k] && a.options[k].selected) o.setAttribute('selected', ''); else o.removeAttribute('selected'); });
          else { b.setAttribute('value', a.value); if (a.checked) b.setAttribute('checked', ''); else b.removeAttribute('checked'); }
        }
        // Keep the page's own scroll position (a page that scrolled itself before the shot).
        var sy = window.pageYOffset || 0;
        var body = clone.getElementsByTagName('body')[0];
        if (body && sy && !cfg.fullPage) { var wrap = document.createElement('div'); wrap.setAttribute('style', 'position:relative;top:' + (-sy) + 'px'); while (body.firstChild) wrap.appendChild(body.firstChild); body.appendChild(wrap); }
        clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        clone.style.minHeight = fullH + 'px'; clone.style.width = w + 'px';
        // A body background normally paints the whole page; inside the copy it must be set on the root.
        var dcs = getComputedStyle(de), bcs = document.body ? getComputedStyle(document.body) : null;
        if (bcs && (dcs.backgroundColor === 'rgba(0, 0, 0, 0)' || dcs.backgroundColor === 'transparent') && dcs.backgroundImage === 'none') {
          clone.style.backgroundColor = bcs.backgroundColor; if (bcs.backgroundImage !== 'none') { clone.style.backgroundImage = bcs.backgroundImage; clone.style.backgroundSize = bcs.backgroundSize; clone.style.backgroundRepeat = bcs.backgroundRepeat; }
        }
        var xml = new XMLSerializer().serializeToString(clone);
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + fullH + '"><foreignObject x="0" y="0" width="' + w + '" height="' + fullH + '">' + xml + '</foreignObject></svg>';
        var im = new Image();
        im.onload = function () {
          try {
            var scale = Math.min(1, 900 / w), cw = Math.round(w * scale), ch = Math.round(fullH * scale);
            var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
            var cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cw, ch);
            cx.drawImage(im, 0, 0, cw, ch);
            var q = 0.72, out = cv.toDataURL('image/jpeg', q);
            while (out.length > 330000 && q > 0.3) { q -= 0.15; out = cv.toDataURL('image/jpeg', q); }
            fin(out.length <= 330000 ? { dataUrl: out, width: cw, height: ch, fullPage: !!cfg.fullPage } : null);
          } catch (e) { fin(null); }
        };
        im.onerror = function () { fin(null); };
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        setTimeout(function () { fin(null); }, 4000);
      } catch (e) { fin(null); }
    }
    post('hello', {});
    window.addEventListener('load', function () { setTimeout(function () {
      var rep; try { rep = report(); } catch (e) { rep = { reportError: String(e && e.message || e), console: logs, errors: errors }; }
      if (cfg.screenshot === false) { rep.screenshotSkipped = true; post('report', rep); return; }
      takeShot(function (shot) { post('report', rep, shot); });
    }, cfg.waitMs); });
  }

  function inlineLocalAssets(html, dir, missing) {
    function rd(ref) {
      if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) return null;
      var p = Shell.resolvePath(ref.split(/[?#]/)[0], dir);
      if (p && vfs.isFile(p)) return vfs.readText(p);
      missing.push(ref); return null;
    }
    html = html.replace(/<link\b[^>]*>/gi, function (tag) {
      if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
      var m = tag.match(/href\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s"'>]+))/i); if (!m) return tag; m[1] = m[1] || m[2] || m[3];
      var css = rd(m[1]); return css === null ? tag : '<style>' + css.replace(/<\/style/gi, '<\\/style') + '</style>';
    });
    html = html.replace(/<script\b([^>]*?)\bsrc\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s"'>]+))([^>]*)>\s*<\/script>/gi, function (tag, pre, q1, q2, q3, post) {
      var src = q1 || q2 || q3, js = rd(src); return js === null ? tag : '<script' + pre + post + '>' + js.replace(/<\/script/gi, '<\\/script') + '</scr' + 'ipt>';
    });
    return html;
  }

  // Only a small JPEG data address from the test page is accepted as a screenshot.
  function validShot(sh) {
    if (!sh || typeof sh.dataUrl !== 'string' || sh.dataUrl.length > 340000) return null;
    if (!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(sh.dataUrl)) return null;
    return { dataUrl: sh.dataUrl, width: Math.min(Math.max(parseInt(sh.width, 10) || 0, 1), 2000), height: Math.min(Math.max(parseInt(sh.height, 10) || 0, 1), 3000), fullPage: !!sh.fullPage };
  }

  async function runBrowserTest(a, io, limits, id) {
    var html, dir = Shell.ROOT, missing = [];
    if (a.path) {
      var fp = relPath(a.path); if (!fp) bad(a.path);
      if (!vfs.isFile(fp)) throw new Error(fp + ' does not exist.');
      html = vfs.readText(fp); dir = fp.slice(0, fp.lastIndexOf('/')) || Shell.ROOT;
    } else html = String(a.html || '');
    if (!html.trim()) throw new Error('The page is empty.');
    html = inlineLocalAssets(html, dir, missing);
    var cfg = {
      waitMs: Math.min(Math.max(parseInt(a.wait_ms, 10) || 300, 0), 5000),
      touch: !!a.touch,
      screenshot: a.screenshot !== false,
      fullPage: !!a.full_page,
      selectors: Array.isArray(a.selectors) ? a.selectors.filter(function (s) { return typeof s === 'string'; }).slice(0, 10) : []
    };
    var width = Math.min(Math.max(parseInt(a.width, 10) || 1024, 200), 2000), height = Math.min(Math.max(parseInt(a.height, 10) || 768, 200), 3000);
    var token = 'cog' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    var meta = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' \'unsafe-eval\'; style-src \'unsafe-inline\'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'">';
    var inject = meta + '<scr' + 'ipt>(' + collectorMain.toString() + ')(' + JSON.stringify(token) + ',' + JSON.stringify(cfg) + ');</scr' + 'ipt>';
    var dt = html.match(/^\s*<!doctype[^>]*>/i);
    var doc = dt ? dt[0] + inject + html.slice(dt[0].length) : inject + html;
    var totalMs = Math.min(limits.timeoutMs || 20000, cfg.waitMs + 12000);
    return new Promise(function (resolve) {
      var fr = document.createElement('iframe'), helloSeen = false, finished = false;
      fr.setAttribute('sandbox', 'allow-scripts');
      fr.style.cssText = 'position:fixed;left:0;top:0;border:0;visibility:hidden;width:' + width + 'px;height:' + height + 'px';
      function end(code, rep, fallback, why, shot) {
        if (finished) return; finished = true; clearTimeout(timer); window.removeEventListener('message', onMsg);
        try { fr.remove(); } catch (e) {}
        if (rep) {
          if (missing.length) rep.missingLocalFiles = missing.slice(0, 10);
          var probs = [];
          if (rep.errors && rep.errors.length) probs.push(rep.errors.length + ' script error(s)');
          if (rep.failedResources && rep.failedResources.length) probs.push(rep.failedResources.length + ' resource(s) failed to load');
          if (rep.blocked && rep.blocked.length) probs.push(rep.blocked.length + ' request(s) blocked (no internet here)');
          if (missing.length) probs.push(missing.length + ' linked local file(s) missing');
          if (rep.horizontalScroll) probs.push('page scrolls sideways at ' + rep.viewport.width + ' px');
          if (rep.brokenImages && rep.brokenImages.length) probs.push(rep.brokenImages.length + ' broken image(s)');
          io.out((shot ? 'A screenshot of the page was captured and is shown to the user (you cannot see it; rely on the measurements below).\n' : (rep.screenshotSkipped ? '' : 'No screenshot could be captured in this browser; rely on the measurements below.\n')) + (probs.length ? 'PROBLEMS FOUND: ' + probs.join('; ') : 'NO PROBLEMS FOUND by these checks') + '\n' + JSON.stringify(rep, null, 1).slice(0, limits.maxOutputChars || 12000) + '\n');
        } else io.err(why + '\n');
        resolve({ code: code, fallback: fallback, screenshot: shot || null, previewHtml: rep ? html.slice(0, 200000) : null, viewport: { width: width, height: height } });
      }
      function onMsg(ev) {
        var m = ev.data; if (ev.source !== fr.contentWindow || !m || m.cog !== token) return;
        if (m.type === 'hello') helloSeen = true;
        else if (m.type === 'report') end(0, m.data && typeof m.data === 'object' ? m.data : {}, null, null, validShot(m.shot));
      }
      var timer = setTimeout(function () {
        if (helloSeen) end(124, null, null, 'The page did not finish loading within ' + Math.round(totalMs / 1000) + ' s. It may have an endless loop or wait for something that never arrives.');
        else end(1, null, { html: html.slice(0, 200000), selectors: cfg.selectors, reason: 'the test page could not start in this browser' }, 'This browser could not run the test page.');
      }, totalMs);
      active = { id: id, kill: function () { end(130, null, null, 'Stopped.'); } };
      window.addEventListener('message', onMsg);
      try { fr.srcdoc = doc; document.body.appendChild(fr); }
      catch (e) { end(1, null, { html: html.slice(0, 200000), selectors: cfg.selectors, reason: 'iframes are not supported here' }, 'This browser could not run the test page.'); }
    });
  }

  async function execTool(call) {
    var name = call.name, a = call.args || {}, limits = call.limits || {};
    vfs.setLimits({ maxFileBytes: limits.maxFileBytes, maxWorkspaceBytes: limits.maxWorkspaceBytes });
    var before = vfs.versions();
    var col = makeCollector(call.id, limits);
    var io = { out: function (t) { col.add('stdout', t); }, err: function (t) { col.add('stderr', t); } };
    var exitCode = 0, command = '', note, fallback, screenshot, previewHtml, previewSize;
    var ctx = {
      fs: vfs, cwd: cwd, env: env, maxOutput: limits.maxOutputChars || 12000,
      // A command line such as "cd src && python a.py" must run Python from src.
      runPython: function (spec, shellIo) { cwd = ctx.cwd; return runPython(spec, shellIo, limits, call.id); },
      runJs: function (spec, shellIo) { cwd = ctx.cwd; return runJs(spec, shellIo, limits, call.id); },
      pipInstall: function (pkgs, shellIo, listOnly) { return pipInstall(pkgs, shellIo, listOnly, limits, call.id); },
      onOutput: null
    };
    var t0 = performance.now();
    try {
      switch (name) {
        case 'sandbox_create_workspace':
          if (a.reset) { vfs.reset(); offered.clear(); cwd = Shell.ROOT; pySyncedVersion = -1; }
          command = a.reset ? 'reset workspace' : 'workspace'; io.out('Workspace ready at ' + Shell.ROOT + ' (' + vfs.files.size + ' files).\n'); break;
        case 'sandbox_get_working_directory': command = 'pwd'; io.out(cwd + '\n'); break;
        case 'sandbox_write_file': {
          var wp = relPath(a.path); if (!wp) bad(a.path);
          vfs.writeFile(wp, String(a.content)); command = (a.imported ? 'import ' : 'write ') + wp;
          io.out((a.imported ? 'Placed ' : 'Wrote ') + wp + ' (' + enc.encode(String(a.content)).length + ' bytes).\n'); break;
        }
        case 'sandbox_read_file': {
          var rp = relPath(a.path); if (!rp) bad(a.path);
          var text = vfs.readText(rp), cap = Math.min(Math.max(parseInt(a.maxChars, 10) || 8000, 1), 20000);
          command = 'read ' + rp; io.out(text.length > cap ? text.slice(0, cap) + '\n[file continues: ' + (text.length - cap) + ' more characters]\n' : text); break;
        }
        case 'sandbox_list_files': {
          var lp = relPath(a.path || '.'); if (!lp) bad(a.path);
          command = 'ls ' + lp;
          if (!vfs.isDir(lp)) throw new Error(lp + ' is not a folder.');
          if (a.recursive) { vfs.walk(lp).forEach(function (f) { io.out(f + '  ' + vfs.readBytes(f).length + ' bytes\n'); }); if (!vfs.walk(lp).length) io.out('(no files)\n'); }
          else { var es = vfs.list(lp); es.forEach(function (e) { io.out((e.type === 'dir' ? 'dir   ' : 'file  ') + e.name + (e.type === 'file' ? '  ' + e.size + ' bytes' : '') + '\n'); }); if (!es.length) io.out('(empty)\n'); }
          break;
        }
        case 'sandbox_make_directory': { var mp = relPath(a.path); if (!mp) bad(a.path); vfs.mkdirp(mp); command = 'mkdir ' + mp; io.out('Created ' + mp + '\n'); break; }
        case 'sandbox_move_file': {
          var f1 = relPath(a.from), f2 = relPath(a.to); if (!f1) bad(a.from); if (!f2) bad(a.to);
          vfs.move(f1, f2); command = 'mv ' + f1 + ' ' + f2; io.out('Moved.\n'); break;
        }
        case 'sandbox_delete_file': {
          var dp = relPath(a.path); if (!dp) bad(a.path);
          if (dp === Shell.ROOT) throw new Error('The workspace root cannot be deleted. Use reset instead.');
          vfs.remove(dp, true); offered.delete(dp); if (cwd === dp || cwd.indexOf(dp + '/') === 0) cwd = Shell.ROOT;
          command = 'rm ' + dp; io.out('Deleted ' + dp + '\n'); break;
        }
        case 'sandbox_offer_file': {
          var op = relPath(a.path); if (!op) bad(a.path);
          if (!vfs.isFile(op)) throw new Error(op + ' does not exist.');
          offered.set(op, String(a.title || Shell.basename(op)).slice(0, 120)); command = 'offer ' + op; io.out('Ready for download: ' + op + '\n');
          // An offered web page also gets a live preview for the person (local css/js inlined, size capped).
          if (/\.html?$/i.test(op)) {
            try {
              var ph = inlineLocalAssets(vfs.readText(op), op.slice(0, op.lastIndexOf('/')) || Shell.ROOT, []);
              if (ph.length <= 200000) { previewHtml = ph; previewSize = { width: 1024, height: 480 }; }
            } catch (e) { /* no preview; the download still works */ }
          }
          break;
        }
        case 'sandbox_run_python': {
          var pf = null;
          if (a.filename) { pf = relPath(a.filename); if (!pf) bad(a.filename); vfs.writeFile(pf, String(a.code)); }
          command = pf ? 'python ' + pf : 'python (inline code)';
          exitCode = await runPython(pf ? { mode: 'file', file: pf, args: [] } : { mode: 'code', code: String(a.code), args: [] }, io, limits, call.id);
          break;
        }
        case 'sandbox_run_javascript': command = 'node (inline code)'; exitCode = await runJs({ code: String(a.code) }, io, limits, call.id); break;
        case 'sandbox_run_tests': {
          var runner = a.runner === 'pytest' ? 'pytest' : 'unittest', tp = a.path ? relPath(a.path) : null;
          if (a.path && !tp) bad(a.path);
          command = runner + (tp ? ' ' + tp : '');
          if (runner === 'pytest') exitCode = await runPython({ mode: 'module', code: 'pytest', args: tp ? [tp] : ['-q'] }, io, limits, call.id);
          else exitCode = await runPython({ mode: 'module', code: 'unittest', args: tp && vfs.isFile(tp) ? ['-v', tp] : ['discover', '-v'].concat(tp ? ['-s', tp] : []) }, io, limits, call.id);
          break;
        }
        case 'sandbox_run_command': {
          command = String(a.command);
          var r = await Shell.runShell(command, Object.assign(ctx, { onOutput: function (s, t) { send({ t: 'out', id: call.id, stream: s, text: t }); } }));
          cwd = ctx.cwd; exitCode = r.exitCode; col.stdout = r.stdout; col.stderr = r.stderr; col.truncated = col.truncated || r.truncated;
          break;
        }
        case 'sandbox_browser_test': {
          command = 'browser test ' + (a.path ? String(a.path) : '(inline html)');
          var bt = await runBrowserTest(a, io, limits, call.id);
          exitCode = bt.code; fallback = bt.fallback || undefined; screenshot = bt.screenshot || undefined; previewHtml = bt.previewHtml || undefined; previewSize = bt.viewport;
          break;
        }
        default:
          exitCode = 127; io.err('This sandbox does not support ' + name + '.\n'); command = name;
      }
    } catch (e) {
      exitCode = exitCode || 1; io.err((e && e.message || String(e)) + '\n');
    }
    // The taste check leaves a small picture of the pages in a hidden folder. Take it for the vision review
    // (the page forwards it to the server) and remove it so it never shows up as one of the person's files.
    var tastePicture;
    try {
      var tp = '/workspace/.cognita-taste/preview.jpg';
      if (vfs.isFile(tp)) {
        var tb = vfs.readBytes(tp), bin = '';
        for (var ti = 0; ti < tb.length; ti += 8192) bin += String.fromCharCode.apply(null, tb.subarray(ti, ti + 8192));
        if (tb.length <= 140000) tastePicture = 'data:image/jpeg;base64,' + btoa(bin);
        vfs.remove('/workspace/.cognita-taste', true);
      }
    } catch (e) { tastePicture = undefined; }
    var changes = vfs.diffSince(before);
    var res = {
      command: command, cwd: cwd, stdout: col.stdout, stderr: col.stderr, exitCode: exitCode,
      durationMs: Math.round(performance.now() - t0), truncated: col.truncated, files: changes,
      cancelled: exitCode === 130 || undefined, note: note, fallback: fallback,
      screenshot: screenshot, previewHtml: previewHtml, previewSize: previewSize, tastePicture: tastePicture
    };
    var off = [];
    offered.forEach(function (title, p) { if (vfs.isFile(p)) off.push({ path: p, title: title, size: vfs.readBytes(p).length }); });
    if (name === 'sandbox_offer_file' || off.length) res.offered = off;
    return { result: res, changed: changes.length > 0 };
  }

  function exportSnapshot() {
    var files = [], transfer = [];
    vfs.files.forEach(function (f, p) { var b = f.data.slice().buffer; files.push({ path: p, data: b }); transfer.push(b); });
    return { snapshot: { files: files, dirs: Array.from(vfs.dirs), cwd: cwd, offered: Array.from(offered.entries()) }, transfer: transfer };
  }

  // ── Messages from the parent page ───────────────────────────────
  window.addEventListener('message', function (ev) {
    if (ev.source !== parentWin) return;
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.t === 'call') {
      queue = queue.then(async function () {
        var out;
        try { out = await execTool(m.call); }
        catch (e) { out = { result: { command: m.call.name, cwd: cwd, stdout: '', stderr: String(e && e.message || e), exitCode: 1, durationMs: 0 }, changed: false }; }
        active = null;
        var pack = out.changed ? exportSnapshot() : null;
        send({ t: 'result', id: m.call.id, result: out.result, snapshot: pack ? pack.snapshot : null, cwd: cwd }, pack ? pack.transfer : []);
      });
    } else if (m.t === 'cancel') {
      if (active && active.id === m.id) active.kill();
    } else if (m.t === 'load') {
      vfs.reset(); offered.clear(); pySyncedVersion = -1;
      var s = m.snapshot || {};
      (s.dirs || []).forEach(function (d) { try { vfs.dirs.add(d); } catch (e) {} });
      (s.files || []).forEach(function (f) { try { vfs.files.set(f.path, { data: new Uint8Array(f.data), version: ++vfs.version }); } catch (e) {} });
      cwd = s.cwd && (s.cwd === Shell.ROOT || s.cwd.indexOf(Shell.ROOT + '/') === 0) ? s.cwd : Shell.ROOT;
      (s.offered || []).forEach(function (p) { if (vfs.isFile(p[0])) offered.set(p[0], p[1]); });
      send({ t: 'loaded', id: m.id });
    } else if (m.t === 'put') {
      // Files the person attached. They land in /workspace/uploads, with a
      // number added to the name if one with that name is already there.
      queue = queue.then(function () {
        var lim = m.limits || {};
        vfs.setLimits({ maxFileBytes: lim.maxFileBytes || 2097152, maxWorkspaceBytes: lim.maxWorkspaceBytes || 10485760 });
        var saved = [], errors = [], dir = Shell.ROOT + '/uploads';
        (m.files || []).forEach(function (f) {
          try {
            var base = String(f.name || 'file').split(/[\\/]/).pop().replace(/[\u0000-\u001f]/g, '').replace(/^\.+/, '').slice(0, 100) || 'file';
            var dot = base.lastIndexOf('.'), stem = dot > 0 ? base.slice(0, dot) : base, ext = dot > 0 ? base.slice(dot) : '';
            var name = base, n = 2;
            while (vfs.exists(dir + '/' + name)) { name = stem + '-' + (n++) + ext; }
            vfs.mkdirp(dir);
            vfs.writeFile(dir + '/' + name, new Uint8Array(f.data));
            saved.push({ name: f.name, path: dir + '/' + name, size: f.data.byteLength });
          } catch (e) { errors.push({ name: f.name, error: String(e && e.message || e) }); }
        });
        var pack = saved.length ? exportSnapshot() : null;
        send({ t: 'stored', id: m.id, ok: errors.length === 0, saved: saved, errors: errors, snapshot: pack ? pack.snapshot : null }, pack ? pack.transfer : []);
      });
    } else if (m.t === 'export') {
      var p = Shell.resolvePath(String(m.path), Shell.ROOT);
      if (!p || !vfs.isFile(p)) { send({ t: 'exported', id: m.id, ok: false }); return; }
      var buf = vfs.readBytes(p).slice().buffer;
      send({ t: 'exported', id: m.id, ok: true, path: p, data: buf }, [buf]);
    } else if (m.t === 'warm') {
      getPy().then(function () { send({ t: 'warmed', id: m.id, ok: true }); }, function (e) { send({ t: 'warmed', id: m.id, ok: false, message: e.message }); });
    }
  });

  send({ t: 'ready' });
})();
</script>
