<meta charset="utf-8">
<title>Cognita sandbox</title>
<!--
  Tier 1 agent sandbox page. It is only ever loaded inside
  <iframe sandbox="allow-scripts"> by js/sandbox-client.js. That means:
    - it has an opaque origin: no cookies, no localStorage, no Firebase
      session, no access to the Cognita page or its DOM;
    - the parent never sends it a token, key or secret, only workspace
      files and the tool call to run;
    - its own Content-Security-Policy (set for this path in vercel.json)
      allows nothing but this page, its inline code, and Cognita's own Pyodide
      host (pyodide.cognita.com.ng), so model-written code cannot call out to
      other sites.
  Python runs in a Web Worker (Pyodide) and JavaScript in a throwaway Web
  Worker, so a runaway loop is stopped by terminating the worker.
-->
</head>
<body>
<script src="/js/sandbox-shell.js"></script>

<script type="text/plain" id="docs-py-src">
"""cognita_docs: make Word (.docx), PDF and PowerPoint (.pptx) files with only the standard library.

    from cognita_docs import docx, pdf, pptx
    blocks = [
        ("title", "Quarterly Report"),
        ("h1", "Summary"),
        ("p", "Plain text with **bold** and *italic*. Use \\n for a line break."),
        ("bullets", ["First point", "Second point"]),
        ("numbered", ["Step one", "Step two"]),
        ("table", [["Item", "Cost"], ["Pens", "500"]]),
        ("p", "Centered line", {"align": "center"}),
        ("pagebreak",),
    ]
    docx("/workspace/report.docx", blocks)
    pdf("/workspace/report.pdf", blocks)
    pptx("/workspace/deck.pptx", blocks)   # designed slides: title block = cover, each h1 = new slide; pass palette=0..5 to pick colours

Every build prints a "QA REPORT" for the new file. check("/workspace/file.pptx") re-inspects any docx, pdf, pptx, xlsx or png/jpg.

Block types: title, h1, h2, h3, p, quote, bullets, numbered, table, image, spacer, pagebreak.
A picture (PNG or JPEG, e.g. a matplotlib chart or organogram saved with savefig) is ("image", "/workspace/chart.png", {"width": 420, "caption": "Figure 1"}); width is in points. Word, PDF and PowerPoint (placed beside the slide text).
A logo for every page or slide: pdf("/workspace/a.pdf", blocks, logo="/workspace/uploads/logo.png") and pptx("/workspace/a.pptx", blocks, logo="/workspace/uploads/logo.png"). PNG or JPEG only. By default it is stamped on EVERY page or slide, the cover too; add logo_pages= to limit it: "cover", "not-cover", "last", or a list of page or slide numbers like [1, 3] (PDF: top right; slides: top left on the cover and section slides on a white plate, bottom right on content slides). When the person attached a logo, its path is in the attachment note; use that path. If the logo cannot be read, a "Logo not added" line is printed: tell the person.
An optional last item in a block is a dict: {"align": "left|center|right|justify"}.
A table may be given as ("table", rows, {"header": True}).
"""
import re
import struct
import zipfile
import zlib
from xml.sax.saxutils import escape as _esc

__all__ = ["docx", "pdf", "pptx", "check"]

_INLINE = re.compile(r"(\*\*.+?\*\*|\*.+?\*)", re.S)


def _runs(text):
    """Split 'a **b** *c*' into [(text, bold, italic)]."""
    out = []
    for part in _INLINE.split(str(text)):
        if not part:
            continue
        if part.startswith("**") and part.endswith("**") and len(part) > 4:
            out.append((part[2:-2], True, False))
        elif part.startswith("*") and part.endswith("*") and len(part) > 2:
            out.append((part[1:-1], False, True))
        else:
            out.append((part, False, False))
    return out


_TEXT_KINDS = ("p", "title", "h1", "h2", "h3", "quote")
_LIST_KINDS = ("bullets", "numbered")


def _flat(x):
    if x is None:
        return ""
    if isinstance(x, (list, tuple, set)):
        return ", ".join(t for t in (_flat(i) for i in x) if t)
    if isinstance(x, dict):
        return ": ".join(t for t in (_flat(i) for i in x.values()) if t)
    return str(x).strip()


def _parse_list_text(s):
    """Turn "['a', 'b']" or '["a", "b"]' (a list written out as text) into a real list, else None."""
    import ast, json
    t = re.sub(r"^\s*```\w*\s*|\s*```\s*$", "", str(s)).strip()
    if not (t.startswith("[") and t.endswith("]")):
        return None
    for loader in (json.loads, ast.literal_eval):
        try:
            v = loader(t)
            if isinstance(v, (list, tuple)):
                return list(v)
        except Exception:
            pass
    inner = t[1:-1].strip()
    m = re.match(r"^(['\"])(.*)\1$", inner, re.S)
    if m:
        q = m.group(1)
        return [x.replace("\\" + q, q).strip() for x in re.split(q + r"\s*,\s*" + q, m.group(2))]
    return None


def _as_items(val):
    """Anything list-like -> a clean list of one-line strings."""
    if val is None:
        return []
    if isinstance(val, str):
        parsed = _parse_list_text(val)
        if parsed is not None:
            return _as_items(parsed)
        lines = [re.sub(r"^\s*(?:[-*\u2022]|\d+[.)])\s+", "", ln).strip() for ln in val.splitlines()]
        return [ln for ln in lines if ln]
    if isinstance(val, dict):
        val = list(val.values())
    if isinstance(val, (list, tuple, set)):
        return [t for t in (_flat(i) for i in val) if t]
    return [str(val)]


def _as_rows(val):
    if isinstance(val, str):
        parsed = _parse_list_text(val)
        val = parsed if parsed is not None else [[c.strip() for c in ln.split("|")] for ln in val.splitlines() if ln.strip()]
    rows = []
    for r in val or []:
        if r is None:
            continue
        if isinstance(r, dict):
            r = list(r.values())
        rows.append([_flat(c) for c in (r if isinstance(r, (list, tuple)) else [r])])
    return rows


def _norm(blocks):
    """Accept tuples or dicts; return (kind, value, opts) triples.
    Values are cleaned: a list given as a paragraph becomes bullets, a list written out as text
    ("['a', 'b']") becomes a real list, and nothing is ever printed as raw brackets or quotes."""
    out = []
    for b in blocks or []:
        if isinstance(b, dict):
            kind = b.get("type") or b.get("kind") or "p"
            val = b.get("text", b.get("items", b.get("rows", "")))
            opts = {k: v for k, v in b.items() if k not in ("type", "kind", "text", "items", "rows")}
        else:
            b = list(b)
            kind = b[0]
            val = b[1] if len(b) > 1 and not isinstance(b[1], dict) else ""
            opts = {}
            for extra in b[1:]:
                if isinstance(extra, dict):
                    opts = extra
        kind = str(kind).lower()
        if kind in _LIST_KINDS:
            val = _as_items(val)
        elif kind == "table":
            val = _as_rows(val)
        elif kind in ("image", "spacer", "pagebreak"):
            pass
        else:
            listy = isinstance(val, (list, tuple, set, dict)) or (isinstance(val, str) and _parse_list_text(val) is not None)
            if listy and kind == "p":
                items = _as_items(val)
                if len(items) > 1:
                    out.append(("bullets", items, {}))
                    continue
                val = items[0] if items else ""
            elif listy:
                val = _flat(_as_items(val))
            elif not isinstance(val, str):
                val = _flat(val)
        out.append((kind, val, opts))
    return out


# ───────────────────────── Pictures ─────────────────────────

def _load_image(path):
    """Read a PNG or JPEG file. Returns {kind, w, h, data, comps, raw}. Raises ValueError if unsupported."""
    with open(path, "rb") as f:
        data = f.read()
    if data[:8] == b"\x89PNG\r\n\x1a\n":
        pos, idat, plte, hdr, trns = 8, [], None, None, None
        while pos + 8 <= len(data):
            n, typ = struct.unpack(">I4s", data[pos:pos + 8])
            body = data[pos + 8:pos + 8 + n]
            if typ == b"IHDR":
                hdr = struct.unpack(">IIBBBBB", body)
            elif typ == b"PLTE":
                plte = body
            elif typ == b"tRNS":
                trns = body
            elif typ == b"IDAT":
                idat.append(body)
            elif typ == b"IEND":
                break
            pos += 12 + n
        if not hdr:
            raise ValueError("bad png")
        w, h, depth, ctype, _c, _f, interlace = hdr
        if depth != 8 or interlace != 0 or ctype not in (0, 2, 3, 4, 6):
            raise ValueError("unsupported png (needs 8-bit, not interlaced)")
        return {"kind": "png", "w": w, "h": h, "ctype": ctype, "plte": plte, "trns": trns, "idat": b"".join(idat), "ext": "png"}
    if data[:2] == b"\xff\xd8":
        pos = 2
        while pos + 9 < len(data):
            if data[pos] != 0xFF:
                pos += 1
                continue
            mk = data[pos + 1]
            if mk in (0xD8, 0x01) or 0xD0 <= mk <= 0xD7:
                pos += 2
                continue
            ln = struct.unpack(">H", data[pos + 2:pos + 4])[0]
            if mk in (0xC0, 0xC1, 0xC2):
                h, w = struct.unpack(">HH", data[pos + 5:pos + 9])
                return {"kind": "jpeg", "w": w, "h": h, "comps": data[pos + 9], "raw": data, "ext": "jpeg"}
            pos += 2 + ln
        raise ValueError("bad jpeg")
    raise ValueError("pictures must be PNG or JPEG")


def _png_file(im):
    """Re-wrap the stored PNG data as a complete PNG file."""
    def chunk(t, d):
        return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
    out = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", im["w"], im["h"], 8, im["ctype"], 0, 0, 0))
    if im["plte"]:
        out += chunk(b"PLTE", im["plte"])
    return out + chunk(b"IDAT", im["idat"]) + chunk(b"IEND", b"")


def _png_planes(im):
    """Unfilter a PNG. Returns (rgb_bytes, alpha_bytes_or_None, width, height)."""
    w, h, ct = im["w"], im["h"], im["ctype"]
    ch = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}[ct]
    stride = w * ch
    raw = zlib.decompress(im["idat"])
    prev = bytearray(stride)
    rgb, alp = bytearray(), bytearray()
    pos = 0
    pal = im["plte"] or b""
    tr = [bytes(pal[i::3][:256]).ljust(256, b"\0") for i in range(3)] if ct == 3 else None
    # Transparency stored in a tRNS chunk: a per-colour alpha table (palette) or one see-through colour (grey / RGB).
    trns = im.get("trns")
    atab, key = None, None
    if trns and ct == 3:
        atab = bytes(trns[:256]).ljust(256, b"\xff")
    elif trns and ct == 0 and len(trns) >= 2:
        key = trns[1]
        atab = bytes(0 if v == key else 255 for v in range(256))
    elif trns and ct == 2 and len(trns) >= 6:
        key = (trns[1], trns[3], trns[5])
    for _ in range(h):
        ft = raw[pos]
        line = bytearray(raw[pos + 1:pos + 1 + stride])
        pos += 1 + stride
        if ft == 1:
            for i in range(ch, stride):
                line[i] = (line[i] + line[i - ch]) & 255
        elif ft == 2:
            for i in range(stride):
                line[i] = (line[i] + prev[i]) & 255
        elif ft == 3:
            for i in range(stride):
                a = line[i - ch] if i >= ch else 0
                line[i] = (line[i] + ((a + prev[i]) >> 1)) & 255
        elif ft == 4:
            for i in range(stride):
                a = line[i - ch] if i >= ch else 0
                b = prev[i]
                c = prev[i - ch] if i >= ch else 0
                p = a + b - c
                pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                line[i] = (line[i] + pr) & 255
        prev = line
        row = bytearray(w * 3)
        if ct == 2:
            row = line
            if key:
                alp += bytes(0 if (line[i], line[i + 1], line[i + 2]) == key else 255 for i in range(0, stride, 3))
        elif ct == 6:
            row[0::3], row[1::3], row[2::3] = line[0::4], line[1::4], line[2::4]
            alp += line[3::4]
        elif ct == 0:
            row[0::3] = row[1::3] = row[2::3] = line
            if atab:
                alp += bytes(line).translate(atab)
        elif ct == 4:
            g = line[0::2]
            row[0::3] = row[1::3] = row[2::3] = g
            alp += line[1::2]
        else:  # palette
            idx = bytes(line)
            row[0::3], row[1::3], row[2::3] = idx.translate(tr[0]), idx.translate(tr[1]), idx.translate(tr[2])
            if atab:
                alp += idx.translate(atab)
        rgb += row
    return bytes(rgb), (bytes(alp) if alp and any(b != 255 for b in alp) else None)


# ───────────────────────── Word ─────────────────────────

_W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'


def _run_xml(text, bold=False, italic=False, extra=""):
    pr = ("<w:b/>" if bold else "") + ("<w:i/>" if italic else "") + extra
    pr = "<w:rPr>" + pr + "</w:rPr>" if pr else ""
    pieces = str(text).split("\n")
    inner = "<w:br/>".join('<w:t xml:space="preserve">%s</w:t>' % _esc(p) for p in pieces)
    return "<w:r>%s%s</w:r>" % (pr, inner)


def _para(text, style=None, align=None, num=None, runs_extra="", bold_all=False):
    ppr = ""
    if style:
        ppr += '<w:pStyle w:val="%s"/>' % style
    if num is not None:
        ppr += '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="%d"/></w:numPr>' % num
    if align in ("left", "center", "right", "justify"):
        ppr += '<w:jc w:val="%s"/>' % ("both" if align == "justify" else align)
    ppr = "<w:pPr>%s</w:pPr>" % ppr if ppr else ""
    body = "".join(_run_xml(t, b or bold_all, i, runs_extra) for t, b, i in _runs(text))
    return "<w:p>%s%s</w:p>" % (ppr, body)


def _table_xml(rows, header=True):
    rows = [list(r) for r in rows if r is not None]
    if not rows:
        return ""
    cols = max(len(r) for r in rows)
    borders = "".join('<w:%s w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>' % s
                      for s in ("top", "left", "bottom", "right", "insideH", "insideV"))
    xml = ['<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>%s</w:tblBorders>'
           '<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>'
           '<w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>' % borders]
    xml.append("<w:tblGrid>%s</w:tblGrid>" % ("<w:gridCol/>" * cols))
    for ri, row in enumerate(rows):
        xml.append("<w:tr>")
        for ci in range(cols):
            cell = row[ci] if ci < len(row) else ""
            is_head = header and ri == 0
            shade = '<w:shd w:val="clear" w:color="auto" w:fill="E8EEF0"/>' if is_head else ""
            xml.append("<w:tc><w:tcPr>%s</w:tcPr>%s</w:tc>" % (shade, _para(cell, bold_all=is_head)))
        xml.append("</w:tr>")
    xml.append("</w:tbl>")
    return "".join(xml) + "<w:p/>"


def docx(path, blocks, title=None, author="Cognita", page="A4"):
    """Write a .docx file. `blocks` is described at the top of this module."""
    body = []
    media = []  # (name, bytes, ext)
    nums = []  # numbering instances: (numId, abstractId)
    next_num = 3
    if title and not any(k == "title" for k, _, _ in _norm(blocks)):
        body.append(_para(title, style="Title"))
    for kind, val, opts in _norm(blocks):
        align = opts.get("align")
        if kind in ("title", "h1", "h2", "h3"):
            style = {"title": "Title", "h1": "Heading1", "h2": "Heading2", "h3": "Heading3"}[kind]
            body.append(_para(val, style=style, align=align))
        elif kind == "quote":
            body.append(_para(val, style="Quote", align=align))
        elif kind == "bullets":
            for item in val:
                body.append(_para(item, style="ListParagraph", num=1))
        elif kind == "numbered":
            nid = next_num
            next_num += 1
            nums.append(nid)
            for item in val:
                body.append(_para(item, style="ListParagraph", num=nid))
        elif kind == "table":
            body.append(_table_xml(val, opts.get("header", True)))
        elif kind == "image":
            try:
                im = _load_image(val)
                maxw = 468.0 if str(page).lower() == "letter" else 451.0
                wpt = min(float(opts.get("width", 420)), maxw)
                hpt = min(wpt * im["h"] / im["w"], 620.0)
                wpt = hpt * im["w"] / im["h"]
                n = len(media) + 1
                media.append(("image%d.%s" % (n, im["ext"]), im, im["ext"]))
                cx, cy = int(wpt * 12700), int(hpt * 12700)
                body.append(
                    '<w:p><w:pPr><w:keepNext/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>'
                    '<wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0">'
                    '<wp:extent cx="%d" cy="%d"/><wp:docPr id="%d" name="Picture %d"/>'
                    '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
                    '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="%d" name="image%d"/><pic:cNvPicPr/></pic:nvPicPr>'
                    '<pic:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rIdImg%d"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
                    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="%d" cy="%d"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>'
                    '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>' % (cx, cy, n, n, n, n, n, cx, cy))
                if opts.get("caption"):
                    body.append(_para(opts["caption"], style="Quote", align="center"))
            except Exception as e:
                body.append(_para("[Picture could not be added: %s]" % e))
        elif kind == "spacer":
            body.append("<w:p/>")
        elif kind == "pagebreak":
            body.append('<w:p><w:r><w:br w:type="page"/></w:r></w:p>')
        else:
            body.append(_para(val, align=align))

    w, h = (12240, 15840) if str(page).lower() == "letter" else (11906, 16838)
    sect = ('<w:sectPr><w:pgSz w:w="%d" w:h="%d"/><w:pgMar w:top="1440" w:right="1440" '
            'w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>' % (w, h))
    document = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document %s><w:body>%s%s</w:body></w:document>'
                % (_W, "".join(body), sect))

    def style(sid, name, size, bold=False, italic=False, color=None, before=0, after=160, based="Normal", extra=""):
        rpr = ('<w:b/>' if bold else '') + ('<w:i/>' if italic else '') + \
              ('<w:color w:val="%s"/>' % color if color else '') + '<w:sz w:val="%d"/>' % size
        return ('<w:style w:type="paragraph" w:styleId="%s"><w:name w:val="%s"/><w:basedOn w:val="%s"/>'
                '<w:qFormat/><w:pPr><w:spacing w:before="%d" w:after="%d"/>%s</w:pPr><w:rPr>%s</w:rPr></w:style>'
                % (sid, name, based, before, after, extra, rpr))

    styles = (
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles %s>'
        '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/>'
        '<w:sz w:val="22"/><w:lang w:val="en-GB"/></w:rPr></w:rPrDefault>'
        '<w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'
        '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>%s%s%s%s%s%s</w:styles>'
        % (_W,
           style("Title", "Title", 52, bold=True, color="1F3A33", after=240, extra='<w:keepNext/>'),
           style("Heading1", "heading 1", 32, bold=True, color="2F5D50", before=320, after=120, extra='<w:keepNext/>'),
           style("Heading2", "heading 2", 26, bold=True, color="2F5D50", before=240, after=100, extra='<w:keepNext/>'),
           style("Heading3", "heading 3", 23, bold=True, color="404040", before=200, after=80, extra='<w:keepNext/>'),
           style("ListParagraph", "List Paragraph", 22, after=60, extra='<w:ind w:left="720"/>'),
           style("Quote", "Quote", 22, italic=True, color="595959", extra='<w:ind w:left="720" w:right="720"/>')))

    def abstract(aid, fmt, text):
        return ('<w:abstractNum w:abstractNumId="%d"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0">'
                '<w:start w:val="1"/><w:numFmt w:val="%s"/><w:lvlText w:val="%s"/><w:lvlJc w:val="left"/>'
                '<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>' % (aid, fmt, text))

    numbering = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering %s>%s%s'
                 '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>%s</w:numbering>'
                 % (_W, abstract(0, "bullet", "\u2022"), abstract(1, "decimal", "%1."),
                    "".join('<w:num w:numId="%d"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0">'
                            '<w:startOverride w:val="1"/></w:lvlOverride></w:num>' % n for n in nums)))

    core = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties '
            'xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" '
            'xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>%s</dc:title><dc:creator>%s</dc:creator></cp:coreProperties>'
            % (_esc(title or ""), _esc(author)))
    ctypes = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
              '<Default Extension="xml" ContentType="application/xml"/>'
              '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
              '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
              '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
              '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>')
    rels = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
            '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>')
    doc_rels = ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
                '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
                '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>')
    if media:
        ctypes = ctypes.replace("</Types>", '<Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/></Types>')
        doc_rels = doc_rels.replace("</Relationships>", "".join(
            '<Relationship Id="rIdImg%d" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/%s"/>' % (i + 1, m[0])
            for i, m in enumerate(media)) + "</Relationships>")
    with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as z:
        z.writestr("[Content_Types].xml", ctypes)
        z.writestr("_rels/.rels", rels)
        for name, im, ext in media:
            z.writestr("word/media/" + name, _png_file(im) if im["kind"] == "png" else im["raw"])
        z.writestr("word/document.xml", document)
        z.writestr("word/styles.xml", styles)
        z.writestr("word/numbering.xml", numbering)
        z.writestr("word/_rels/document.xml.rels", doc_rels)
        z.writestr("docProps/core.xml", core)
    return path

_HW = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278] + [556] * 10 + \
      [278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833,
       722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556,
       556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556,
       500, 722, 500, 500, 500, 334, 260, 334, 584]


def _cp(text):
    t = str(text).replace("\u20a6", "NGN ").replace("\u2011", "-").replace("\u00a0", " ")
    return t.encode("cp1252", "replace").decode("cp1252")


def _cw(ch, bold):
    o = ord(ch)
    w = _HW[o - 32] if 32 <= o <= 126 else 556
    return w * (1.06 if bold else 1.0)


def _tw(text, size, bold=False):
    return sum(_cw(c, bold) for c in text) * size / 1000.0


def _pdf_escape(s):
    return s.replace("\\", "\\\\").replace("(", "\\(").replace(")", "\\)")


def _prep_logo(logo):
    """Load a logo file for pdf()/pptx(). Returns (image, data_bytes) or (None, None) after printing why not."""
    if not logo:
        return None, None
    try:
        im = _load_image(str(logo))
        with open(str(logo), "rb") as f:
            data = f.read()
        if not im["w"] or not im["h"]:
            raise ValueError("the picture has no size")
        return im, data
    except FileNotFoundError:
        print("Logo not added: %s was not found. Ask the person to attach the logo again." % logo)
    except Exception as e:
        print("Logo not added: %s (use a PNG or JPEG file)" % e)
    return None, None


def _logo_pages(spec):
    """Turn logo_pages into a function (n, total) -> bool. Accepts "all", "cover"/"first", "not-cover"/"not-first", "last",
    or a list of 1-based page/slide numbers such as [1, 3]."""
    if spec is None:
        return lambda n, t: True
    if isinstance(spec, (list, tuple, set)):
        try:
            nums = set(int(x) for x in spec)
            return lambda n, t: n in nums
        except Exception:
            pass
    elif isinstance(spec, int) and not isinstance(spec, bool):
        return lambda n, t: n == spec
    else:
        k = str(spec).strip().lower().replace("_", "-").replace(" ", "-")
        table = {
            "all": lambda n, t: True, "every": lambda n, t: True,
            "cover": lambda n, t: n == 1, "first": lambda n, t: n == 1,
            "not-cover": lambda n, t: n != 1, "not-first": lambda n, t: n != 1, "except-cover": lambda n, t: n != 1,
            "last": lambda n, t: n == t,
        }
        if k in table:
            return table[k]
    print("logo_pages %r was not understood, so the logo goes on every page. Use \"all\", \"cover\", \"not-cover\", \"last\" or a list like [1, 3]." % (spec,))
    return lambda n, t: True


def pdf(path, blocks, title=None, page="A4", logo=None, logo_pages="all"):
    """Write a simple, clean PDF. `blocks` is described at the top of this module. logo= a PNG/JPEG path stamped on every page."""
    logo_im, _logo_data = _prep_logo(logo)
    logo_on = _logo_pages(logo_pages)
    W, H = (612.0, 792.0) if str(page).lower() == "letter" else (595.0, 842.0)
    M = 64.0
    pages = [[]]
    state = {"y": H - M}
    pdf_images = []

    def newpage():
        pages.append([])
        state["y"] = H - M

    def ensure(h):
        if state["y"] - h < M:
            newpage()

    def text_at(x, y, s, size, font, color="0.1 0.1 0.1"):
        pages[-1].append("%s rg BT /%s %.2f Tf %.2f %.2f Td (%s) Tj ET" % (color, font, size, x, y, _pdf_escape(_cp(s))))

    def wrap(text, size, width, base_bold=False):
        """Return lines; each line is a list of (text, font, bold) pieces."""
        tokens = []
        for t, b, i in _runs(text):
            for k, part in enumerate(str(t).split("\n")):
                if k > 0:
                    tokens.append(("\n", b, i))
                for word in re.findall(r"\S+|\s+", part):
                    tokens.append((word, b or base_bold, i))
        lines, cur, curw = [], [], 0.0
        for word, b, i in tokens:
            if word == "\n":
                lines.append(cur); cur, curw = [], 0.0
                continue
            w = _tw(_cp(word), size, b)
            if curw + w > width and cur and not word.isspace():
                lines.append(cur); cur, curw = [], 0.0
            if not cur and word.isspace():
                continue
            cur.append((word, "F2" if b else ("F3" if i else "F1"), b))
            curw += w
        lines.append(cur)
        return lines

    def draw_para(text, size, x, width, bold=False, align="left", gap=6, color="0.1 0.1 0.1", lead=1.35):
        for line in wrap(text, size, width, bold):
            ensure(size * lead)
            state["y"] -= size * lead
            total = sum(_tw(_cp(w), size, b) for w, _, b in line)
            cx = x
            if align == "center":
                cx = x + (width - total) / 2
            elif align == "right":
                cx = x + width - total
            for word, font, b in line:
                text_at(cx, state["y"], word, size, font, color)
                cx += _tw(_cp(word), size, b)
        state["y"] -= gap

    cw = W - 2 * M
    items = _norm(blocks)
    if title and not any(k == "title" for k, _, _ in items):
        items.insert(0, ("title", title, {}))
    _tt = next((str(v) for k, v, _o in items if k == "title"), "")
    _P = _pal(sum(ord(c) for c in (_tt or "doc")))

    def rgb(h):
        return "%.3f %.3f %.3f" % tuple(int(h[i:i + 2], 16) / 255.0 for i in (0, 2, 4))

    C_INK, C_ACC, C_ACC2, C_TINT, C_DARK, C_ACCT = rgb(_P["ink"]), rgb(_P["accent"]), rgb(_P["accent2"]), rgb(_P["tint"]), rgb(_P["dark"]), rgb(_P["at"])
    C_BODY = "0.2 0.25 0.33"
    for kind, val, opts in items:
        align = opts.get("align", "left")
        if kind == "title":
            ensure(80)
            tl = wrap(val, 26, cw, True)
            draw_para(val, 26, M, cw, True, align, 8, C_INK, 1.2)
            # The short accent rule is a choice, not a requirement: pass {"rule": True/False}. By default it is
            # drawn only under a one-line title, and it follows the title's alignment.
            want = opts.get("rule", "auto")
            if want == "auto":
                want = len(tl) == 1
            if want:
                rw = 64.0 + 6 + 18
                rx = M if align == "left" else (M + (cw - rw) / 2 if align == "center" else M + cw - rw)
                pages[-1].append("%s rg %.2f %.2f 64 4 re f %s rg %.2f %.2f 18 4 re f" % (C_ACC, rx, state["y"] - 4, C_ACC2, rx + 70, state["y"] - 4))
                state["y"] -= 26
            else:
                state["y"] -= 6
        elif kind in ("h1", "h2", "h3"):
            size = {"h1": 16, "h2": 13.5, "h3": 12}[kind]
            ensure(size * 3)
            state["y"] -= 10
            # Marker bar sits on the first line of the heading: baseline is size*1.35 below the cursor,
            # the bar runs from just under the baseline to the top of the capital letters.
            base = state["y"] - size * 1.35
            pages[-1].append("%s rg %.2f %.2f 4 %.2f re f" % (C_ACC, M - 12, base - size * 0.12, size * 0.9))
            draw_para(val, size, M, cw, True, align, 6, C_INK)
        elif kind == "quote":
            q0 = state["y"]
            draw_para(val, 12.5, M + 28, cw - 56, False, align, 10, C_INK, 1.4)
            pages[-1].append("%s rg %.2f %.2f 3 %.2f re f" % (C_ACC, M + 10, state["y"] + 8, q0 - state["y"] - 6))
        elif kind in ("bullets", "numbered"):
            for n, item in enumerate(val, 1):
                ensure(16)
                mark = u"\u2022" if kind == "bullets" else "%d." % n
                y0 = state["y"] - 11 * 1.35
                text_at(M + 8, y0, mark, 11, "F2", C_ACCT)
                draw_para(item, 11, M + 28, cw - 28, False, "left", 4, C_BODY)
            state["y"] -= 4
        elif kind == "table":
            rows = [list(r) for r in val if r is not None]
            if not rows:
                continue
            cols = max(len(r) for r in rows)
            colw = cw / cols
            for ri, row in enumerate(rows):
                cells = [wrap(row[ci] if ci < len(row) else "", 10, colw - 10, opts.get("header", True) and ri == 0)
                         for ci in range(cols)]
                rh = max(len(c) for c in cells) * 13.5 + 8
                ensure(rh)
                top = state["y"]
                hdr_row = opts.get("header", True) and ri == 0
                if hdr_row:
                    pages[-1].append("%s rg %.2f %.2f %.2f %.2f re f" % (C_DARK, M, top - rh, cw, rh))
                elif ri % 2 == 0:
                    pages[-1].append("%s rg %.2f %.2f %.2f %.2f re f" % (C_TINT, M, top - rh, cw, rh))
                pages[-1].append("0.88 0.9 0.93 RG 0.5 w %.2f %.2f m %.2f %.2f l S" % (M, top - rh, M + cw, top - rh))
                for ci, lines in enumerate(cells):
                    cy = top - 4
                    for line in lines:
                        cy -= 13.5
                        cx = M + ci * colw + 5
                        for word, font, b in line:
                            text_at(cx, cy + 3, word, 10, font, "1 1 1" if hdr_row else C_INK)
                            cx += _tw(_cp(word), 10, b)
                state["y"] = top - rh
            state["y"] -= 10
        elif kind == "image":
            try:
                im = _load_image(val)
            except Exception as e:
                draw_para("[Picture could not be added: %s]" % e, 10, M, cw, False, "left", 8)
            else:
                wpt = min(float(opts.get("width", 420)), cw)
                hpt = wpt * im["h"] / im["w"]
                if hpt > H - 2 * M - 30:
                    hpt = H - 2 * M - 30
                    wpt = hpt * im["w"] / im["h"]
                ensure(hpt + 10)
                pdf_images.append(("Im%d" % (len(pdf_images) + 1), im))
                pages[-1].append("q %.2f 0 0 %.2f %.2f %.2f cm /%s Do Q" % (wpt, hpt, M + (cw - wpt) / 2, state["y"] - hpt, pdf_images[-1][0]))
                state["y"] -= hpt + 8
                if opts.get("caption"):
                    draw_para(opts["caption"], 9, M, cw, False, "center", 10)
        elif kind == "spacer":
            state["y"] -= 14
        elif kind == "pagebreak":
            newpage()
        else:
            draw_para(val, 11, M, cw, False, align, 8, C_BODY)

    logo_box = None
    if logo_im and any(logo_on(n, len(pages)) for n in range(1, len(pages) + 1)):
        lw_max, lh_max = 150.0, 36.0
        sc = min(lw_max / logo_im["w"], lh_max / logo_im["h"])
        lw, lh = logo_im["w"] * sc, logo_im["h"] * sc
        pdf_images.append(("ImLogo", logo_im))
        logo_box = (W - M - lw, H - 8 - 12 - lh, lw, lh)

    for pn, ops in enumerate(pages, 1):
        ops.insert(0, "%s rg 0 %.2f %.2f 8 re f" % (C_ACC, H - 8, W))
        if logo_box and logo_on(pn, len(pages)):
            ops.append("q %.2f 0 0 %.2f %.2f %.2f cm /ImLogo Do Q" % (logo_box[2], logo_box[3], logo_box[0], logo_box[1]))
        ops.append("%s rg BT /F1 8.5 Tf %.2f 28 Td (%s) Tj ET" % ("0.45 0.5 0.58", M, _pdf_escape(_cp(_tt[:70]))))
        lab = "%d / %d" % (pn, len(pages))
        ops.append("%s rg BT /F2 8.5 Tf %.2f 28 Td (%s) Tj ET" % (C_ACCT, W - M - _tw(lab, 8.5, True), lab))

    objs = []

    def add(body):
        objs.append(body)
        return len(objs)

    cat = add("")      # 1 catalog (filled later)
    pgs = add("")      # 2 pages (filled later)
    fonts = [add("<< /Type /Font /Subtype /Type1 /BaseFont /%s /Encoding /WinAnsiEncoding >>" % n)
             for n in ("Helvetica", "Helvetica-Bold", "Helvetica-Oblique")]
    xobj = []
    for name, im in pdf_images:
        if im["kind"] == "jpeg":
            cs = {1: "/DeviceGray", 3: "/DeviceRGB", 4: "/DeviceCMYK"}.get(im["comps"], "/DeviceRGB")
            body = im["raw"].decode("latin-1")
            oid = add("<< /Type /XObject /Subtype /Image /Width %d /Height %d /ColorSpace %s /BitsPerComponent 8 /Filter /DCTDecode /Length %d >>\nstream\n%s\nendstream"
                      % (im["w"], im["h"], cs, len(im["raw"]), body))
        else:
            rgb, alpha = _png_planes(im)
            extra = ""
            if alpha:
                ad = zlib.compress(alpha)
                sid = add("<< /Type /XObject /Subtype /Image /Width %d /Height %d /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length %d >>\nstream\n%s\nendstream"
                          % (im["w"], im["h"], len(ad), ad.decode("latin-1")))
                extra = " /SMask %d 0 R" % sid
            cd = zlib.compress(rgb)
            oid = add("<< /Type /XObject /Subtype /Image /Width %d /Height %d /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /Length %d%s >>\nstream\n%s\nendstream"
                      % (im["w"], im["h"], len(cd), extra, cd.decode("latin-1")))
        xobj.append("/%s %d 0 R" % (name, oid))
    xres = (" /XObject << %s >>" % " ".join(xobj)) if xobj else ""
    kids = []
    for ops in pages:
        stream = "\n".join(ops).encode("cp1252", "replace")
        cid = add("<< /Length %d >>\nstream\n%s\nendstream" % (len(stream), stream.decode("latin-1")))
        pid = add("<< /Type /Page /Parent %d 0 R /MediaBox [0 0 %.0f %.0f] /Contents %d 0 R "
                  "/Resources << /Font << /F1 %d 0 R /F2 %d 0 R /F3 %d 0 R >>%s >> >>" % (pgs, W, H, cid, fonts[0], fonts[1], fonts[2], xres))
        kids.append(pid)
    objs[cat - 1] = "<< /Type /Catalog /Pages %d 0 R >>" % pgs
    objs[pgs - 1] = "<< /Type /Pages /Kids [%s] /Count %d >>" % (" ".join("%d 0 R" % k for k in kids), len(kids))
    out = bytearray(b"%PDF-1.4\n")
    offsets = []
    for n, body in enumerate(objs, 1):
        offsets.append(len(out))
        out += ("%d 0 obj\n" % n).encode() + body.encode("latin-1") + b"\nendobj\n"
    xref = len(out)
    out += ("xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1)).encode()
    for off in offsets:
        out += ("%010d 00000 n \n" % off).encode()
    out += ("trailer\n<< /Size %d /Root %d 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, cat, xref)).encode()
    with open(path, "wb") as f:
        f.write(bytes(out))
    return path

    dict(dark="1E1B4B", mid="312E81", accent="6366F1", accent2="F43F5E", tint="ECEEFF", ink="1E1B4B", muted="64748B", soft="C7D2FE"),
    dict(dark="0B2545", mid="13315C", accent="2563EB", accent2="F97316", tint="E8F0FE", ink="0B2545", muted="64748B", soft="BFDBFE"),
    dict(dark="14301F", mid="1F4630", accent="16A34A", accent2="EAB308", tint="E8F5EC", ink="14301F", muted="5B6B61", soft="BBF7D0"),

]


def _text_safe(hexs, pairs):
    """Darken a colour until it reads on each (background, minimum contrast) pair; used for text and pills on light slides."""
    c = [int(hexs[i:i + 2], 16) for i in (0, 2, 4)]
    for _ in range(40):
        h = "%02X%02X%02X" % tuple(c)
        if all(_contrast(h, bg) >= mn for bg, mn in pairs):
            return h
        c = [int(v * 0.93) for v in c]
    return "%02X%02X%02X" % tuple(c)


def _pal(i):
    p = dict(_PALETTES[int(i) % len(_PALETTES)])
    p["at"] = _text_safe(p["accent"], [("FFFFFF", 4.5), (p["tint"], 3.5)])
    p["a2t"] = _text_safe(p["accent2"], [("FFFFFF", 4.5), (p["tint"], 3.5)])
    return p


def pptx(path, blocks, title=None, author="Cognita", palette=None, logo=None, logo_pages="all"):
    """Make a designed 16:9 .pptx. A "title" block makes the cover; every h1 starts a new slide.
    Bullets become cards, steps or rows; tables become real tables; images are placed beside the text.
    Long lists and tables continue on a following slide. Pass palette=0..5 to pick a colour theme.
    Pass logo="/path/logo.png" (PNG or JPEG) to stamp a logo on every slide, the cover included."""
    logo_im, logo_data = _prep_logo(logo)
    logo_on = _logo_pages(logo_pages)
    A = 'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"'
    REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships"
    W, H = 12192000, 6858000
    PT = 12700
    HEAD, BODY = "Georgia", "Calibri"
    items = _norm(blocks)

    # ── 1. group blocks into slides ──
    deck_title = title or ""
    for k, v, o in items:
        if k == "title":
            deck_title = str(v)
            if isinstance(o, dict) and o.get("palette") is not None:
                palette = o.get("palette")
            break
    if palette is None:
        palette = sum(ord(c) for c in (deck_title or "deck")) % len(_PALETTES)
    P = _pal(palette)

    raw = []
    cur = None
    for kind, val, opts in items:
        if kind == "title":
            cur = {"head": str(val), "kind": "cover", "els": []}
            raw.append(cur)
        elif kind == "h1":
            cur = {"head": str(val), "kind": "content", "els": []}
            raw.append(cur)
        elif kind == "pagebreak":
            cur = {"head": "", "kind": "content", "els": [], "cont": True}
            raw.append(cur)
        elif kind == "spacer":
            continue
        else:
            if cur is None:
                cur = {"head": title or "", "kind": "cover", "els": []}
                raw.append(cur)
            cur["els"].append((kind, val, opts))
    if not raw:
        raw.append({"head": title or "Presentation", "kind": "cover", "els": []})

    # split long lists / tables so nothing overflows
    slides = []
    for s in raw:
        if s["kind"] == "cover":
            slides.append(s)
            continue
        cap = 4 if any(e[0] == "image" for e in s["els"]) else 6
        big = None
        for n, e in enumerate(s["els"]):
            if (e[0] in ("bullets", "numbered") and len(e[1] or []) > cap) or (e[0] == "table" and len(e[1] or []) > 8):
                big = n
                break
        if big is None:
            slides.append(s)
            continue
        kind, val, opts = s["els"][big]
        val = list(val)
        if kind == "table":
            hdr, body = val[0], val[1:]
            chunks = [[hdr] + body[i:i + 7] for i in range(0, len(body), 7)]
        else:
            chunks = [val[i:i + cap] for i in range(0, len(val), cap)]
        for ci, ch in enumerate(chunks):
            if ci == 0:
                els = list(s["els"][:big]) + [(kind, ch, opts)] + list(s["els"][big + 1:])
                slides.append({"head": s["head"], "kind": "content", "els": els})
            else:
                slides.append({"head": s["head"] + " (cont.)", "kind": "content", "els": [(kind, ch, opts)]})

    # ── 2. drawing helpers ──
    def est_lines(text, sz, width):
        cpl = max(4, int((width / PT) / (sz * 0.5)))
        n = 0
        for part in str(text).split("\n"):
            n += max(1, -(-len(part) // cpl))
        return n

    def fit(texts, width, height, mx, mn, gap=0, lead=1.22):
        sz = mx
        while sz > mn:
            tot = sum(est_lines(t, sz, width) * sz * lead * PT + gap for t in texts)
            if tot <= height:
                break
            sz -= 1
        return sz

    def run(t, sz, color, bold=False, italic=False, font=BODY):
        out = ""
        for tx, b, i in _runs(t):
            out += ('<a:r><a:rPr lang="en-US" sz="%d"%s%s dirty="0"><a:solidFill><a:srgbClr val="%s"/></a:solidFill><a:latin typeface="%s"/><a:cs typeface="%s"/></a:rPr><a:t>%s</a:t></a:r>'
                    % (int(sz * 100), ' b="1"' if (b or bold) else "", ' i="1"' if (i or italic) else "", color, font, font, _esc(tx)))
        return out

    def para(t, sz, color, bold=False, italic=False, algn="l", font=BODY, after=0, lead=100):
        segs = str(t).split("\n")
        out = ""
        for j, seg in enumerate(segs):
            out += ('<a:p><a:pPr algn="%s"><a:lnSpc><a:spcPct val="%d000"/></a:lnSpc><a:spcBef><a:spcPts val="0"/></a:spcBef><a:spcAft><a:spcPts val="%d"/></a:spcAft><a:buNone/></a:pPr>%s</a:p>'
                    % (algn, lead, after if j == len(segs) - 1 else 0, run(seg, sz, color, bold, italic, font)))
        return out

    class Slide:
        def __init__(self, bg):
            self.bg, self.xml, self.n, self.rels = bg, "", 1, []

        def nid(self):
            self.n += 1
            return self.n

        def shape(self, x, y, w, h, fill=None, geom="rect", paras="", anchor="t", ins=(0, 0, 0, 0), adj=None, name="Shape"):
            i = self.nid()
            g = '<a:prstGeom prst="%s"><a:avLst>%s</a:avLst></a:prstGeom>' % (geom, ('<a:gd name="adj" fmla="val %d"/>' % adj) if adj is not None else "")
            f = ('<a:solidFill><a:srgbClr val="%s"/></a:solidFill>' % fill) if fill else "<a:noFill/>"
            tb = ""
            if paras:
                tb = ('<p:txBody><a:bodyPr wrap="square" lIns="%d" tIns="%d" rIns="%d" bIns="%d" anchor="%s"><a:noAutofit/></a:bodyPr><a:lstStyle/>%s</p:txBody>'
                      % (ins[0], ins[1], ins[2], ins[3], anchor, paras))
            self.xml += ('<p:sp><p:nvSpPr><p:cNvPr id="%d" name="%s %d"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="%d" y="%d"/><a:ext cx="%d" cy="%d"/></a:xfrm>%s%s<a:ln><a:noFill/></a:ln></p:spPr>%s</p:sp>'
                         % (i, name, i, x, y, max(w, 1), max(h, 1), g, f, tb))

        def text(self, x, y, w, h, paras, anchor="t", name="Text"):
            self.shape(x, y, w, h, None, "rect", paras, anchor, name=name)

        def pic(self, x, y, w, h, rid, descr):
            i = self.nid()
            self.xml += ('<p:pic><p:nvPicPr><p:cNvPr id="%d" name="Picture %d" descr="%s"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="%s"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="%d" y="%d"/><a:ext cx="%d" cy="%d"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>'
                         % (i, i, _esc(descr or "Picture", {'"': "&quot;"}), rid, x, y, w, h))

        def table(self, x, y, w, rows, sz):
            i = self.nid()
            nc = max(len(r) for r in rows)
            lens = [max([len(str(r[c])) if c < len(r) else 0 for r in rows] + [4]) for c in range(nc)]
            lens = [min(max(l, 6), 40) for l in lens]
            tot = float(sum(lens))
            cws = [int(w * l / tot) for l in lens]
            cws[-1] = w - sum(cws[:-1])
            rh = int(sz * 2.3 * PT)
            trs = ""
            for ri, r in enumerate(rows):
                tcs = ""
                for c in range(nc):
                    cell = str(r[c]) if c < len(r) else ""
                    hd = ri == 0
                    fill = P["dark"] if hd else (P["tint"] if ri % 2 == 0 else "FFFFFF")
                    col = "FFFFFF" if hd else P["ink"]
                    tcs += ('<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>%s</a:txBody><a:tcPr marL="137160" marR="137160" marT="64008" marB="64008" anchor="ctr"><a:lnL w="0"><a:noFill/></a:lnL><a:lnR w="0"><a:noFill/></a:lnR><a:lnT w="0"><a:noFill/></a:lnT><a:lnB w="9525"><a:solidFill><a:srgbClr val="E2E8F0"/></a:solidFill></a:lnB><a:solidFill><a:srgbClr val="%s"/></a:solidFill></a:tcPr></a:tc>'
                            % (para(cell, sz, col, bold=hd), fill))
                trs += '<a:tr h="%d">%s</a:tr>' % (rh, tcs)
            grid = "".join('<a:gridCol w="%d"/>' % c for c in cws)
            self.xml += ('<p:graphicFrame><p:nvGraphicFramePr><p:cNvPr id="%d" name="Table %d"/><p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr><p:xfrm><a:off x="%d" y="%d"/><a:ext cx="%d" cy="%d"/></p:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table"><a:tbl><a:tblPr firstRow="1" bandRow="1"/><a:tblGrid>%s</a:tblGrid>%s</a:tbl></a:graphicData></a:graphic></p:graphicFrame>'
                         % (i, i, x, y, w, rh * len(rows), grid, trs))
            return rh * len(rows)

        def render(self):
            return ('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sld %s><p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="%s"/></a:solidFill><a:effectLst/></p:bgPr></p:bg><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>%s</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>'
                    % (A, self.bg, self.xml))

    def split_lead(t):
        t = str(t)
        m = re.match(r"^\*\*(.{1,48}?)\*\*[\s:\-\u2013\u2014]*(.*)$", t, re.S)
        if m and m.group(2):
            return m.group(1), m.group(2)
        m = re.match(r"^([^:\u2013\u2014]{2,40}?)(?::|\s[-\u2013\u2014]\s)\s*(.{6,})$", t, re.S)
        if m:
            return m.group(1).strip(), m.group(2).strip()
        return "", t

    media = []  # (name, bytes, ext)

    def add_image(sl, p):
        try:
            im = _load_image(p)
            with open(p, "rb") as f:
                data = f.read()
        except Exception:
            return None
        ext = "png" if im["kind"] == "png" else "jpeg"
        media.append(("image%d.%s" % (len(media) + 1, ext), data, ext))
        rid = "rId%d" % (len(sl.rels) + 2)
        sl.rels.append((rid, media[-1][0]))
        return rid, im["w"], im["h"]

    LM = 700000
    RW = W - 2 * LM
    total = len(slides)
    logo_name = None
    if logo_im and any(logo_on(n, len(slides)) for n in range(1, len(slides) + 1)):
        logo_name = "logo.%s" % ("png" if logo_im["kind"] == "png" else "jpeg")
        media.append((logo_name, logo_data, "png" if logo_im["kind"] == "png" else "jpeg"))

    def stamp_logo(sl, dark):
        """One shared picture file, one small placement per slide."""
        if not logo_name or not logo_on(len(out_slides) + 1, len(slides)):
            return
        rid = "rId%d" % (len(sl.rels) + 2)
        sl.rels.append((rid, logo_name))
        if dark:
            mw, mh, pad = 2200000, 640000, 90000
            sc = min(mw / float(logo_im["w"]), mh / float(logo_im["h"]))
            lw, lh = int(logo_im["w"] * sc), int(logo_im["h"] * sc)
            x, y = LM + 200000, 420000
            sl.shape(x - pad, y - pad, lw + 2 * pad, lh + 2 * pad, "FFFFFF", "roundRect", adj=12000, name="LogoPlate")
        else:
            mw, mh = 1700000, 380000
            sc = min(mw / float(logo_im["w"]), mh / float(logo_im["h"]))
            lw, lh = int(logo_im["w"] * sc), int(logo_im["h"] * sc)
            x, y = W - LM - 560000 - 220000 - lw, H - 470000 + (320000 - lh) // 2
        sl.pic(x, y, lw, lh, rid, "Logo")

    out_slides = []
    sec = 0

    for idx, s in enumerate(slides):
        els = s["els"]
        # ---- cover ----
        if s["kind"] == "cover":
            sl = Slide(P["dark"])
            sl.shape(7400000, -1200000, 6200000, 6200000, P["mid"], "ellipse", name="Deco")
            sl.shape(9700000, 3900000, 3600000, 3600000, P["accent"], "ellipse", name="Deco")
            sl.shape(8300000, 2300000, 900000, 900000, P["accent2"], "ellipse", name="Deco")
            sl.shape(0, 0, 220000, H, P["accent"], name="Bar")
            tsz = 48 if len(s["head"]) <= 28 else 40 if len(s["head"]) <= 56 else 32
            tsz = fit([s["head"]], 7600000, 2450000, tsz, 20)  # a very long title shrinks to fit instead of overflowing
            sl.text(LM + 200000, 1500000, 7600000, 2600000, para(s["head"], tsz, "FFFFFF", True, font=HEAD, lead=95), "b", "Title")
            sl.shape(LM + 200000, 4300000, 1100000, 60000, P["accent"], name="Rule")
            subs = []
            for k, v, o in els:
                if k in ("bullets", "numbered"):
                    subs += [str(x) for x in (v or [])]
                elif k == "table":
                    subs += ["  |  ".join(str(c) for c in r) for r in (v or [])]
                elif k != "image":
                    subs.append(str(v))
            subs = subs[:4]
            # The subtitle box has a fixed size, so the text size is chosen to fit it (every other slide does this
            # with fit()). Without this a long cover line overflowed at 22 pt, the quality check kept failing it, and
            # the only thing left was to shorten the words again and again. If even the smallest size does not fit,
            # the last lines are dropped rather than overflowing.
            sub_w, sub_h = 7000000, 1700000
            sub_sz = 22
            while subs:
                sub_sz = 0
                for try_sz in (22, 20, 18, 16, 14):
                    need = sum(est_lines(t, try_sz, sub_w) * try_sz * 1.25 * PT + 400 * PT / 100.0 for t in subs)
                    if need <= sub_h:
                        sub_sz = try_sz
                        break
                if sub_sz or len(subs) == 1:
                    break
                subs = subs[:-1]
            if subs:
                if not sub_sz:
                    sub_sz = 14
                    keep = int((sub_h / (14 * 1.25 * PT)) * ((sub_w / PT) / (14 * 0.5))) - 3
                    subs = [subs[0][:max(40, keep)].rstrip(" ,;:-") + "..."] if len(subs[0]) > keep else subs
                sl.text(LM + 200000, 4550000, sub_w, sub_h, "".join(para(t, sub_sz, P["soft"], after=400) for t in subs), "t", "Subtitle")
            stamp_logo(sl, True)
            out_slides.append(sl)
            continue
        # ---- section divider (heading only) ----
        if not els:
            sec += 1
            sl = Slide(P["dark"])
            sl.shape(8800000, -900000, 5200000, 5200000, P["mid"], "ellipse", name="Deco")
            sl.shape(0, 0, 220000, H, P["accent"], name="Bar")
            sl.text(LM + 200000, 1900000, 3000000, 1400000, para("%02d" % sec, 72, P["accent"], True, font=HEAD), "b", "Number")
            sl.text(LM + 200000, 3400000, 9000000, 1800000, para(s["head"], 40 if len(s["head"]) <= 40 else 32, "FFFFFF", True, font=HEAD, lead=95), "t", "Title")
            stamp_logo(sl, True)
            out_slides.append(sl)
            continue
        # ---- content ----
        sl = Slide("FFFFFF")
        sl.shape(0, 0, W, 150000, P["accent"], name="Top")
        hsz = 36 if len(s["head"]) <= 36 else 30 if len(s["head"]) <= 56 else 24
        sl.text(LM, 420000, RW, 820000, para(s["head"], hsz, P["ink"], True, font=HEAD, lead=95), "ctr", "Title")
        sl.shape(LM, 1290000, 900000, 50000, P["accent2"], name="Rule")
        # footer
        foot = (deck_title or "").replace("\n", " ")
        if len(foot) > 100:  # the footer is one line; a long deck title is cut so it cannot wrap and overflow
            foot = foot[:97].rstrip(" ,;:-") + "..."
        sl.text(LM, H - 460000, 8000000, 300000, para(foot, 11, P["muted"]), "ctr", "Footer")
        sl.shape(W - LM - 560000, H - 470000, 560000, 320000, P["at"], "roundRect", para(str(idx + 1), 12, "FFFFFF", True, algn="ctr"), "ctr", adj=50000, name="PageNo")
        top, bottom = 1600000, H - 640000
        RH = bottom - top

        paras_t = [str(v) for k, v, o in els if k == "p"]
        quotes = [str(v) for k, v, o in els if k == "quote"]
        lists = [(k, [str(x) for x in (v or [])]) for k, v, o in els if k in ("bullets", "numbered")]
        tables = [(v, o) for k, v, o in els if k == "table"]
        imgs = [(v, o) for k, v, o in els if k == "image"]
        for k, v, o in els:
            if k in ("h2", "h3"):
                paras_t.insert(0, "**%s**" % v)
        y = top
        # image layout
        placed = None
        if imgs:
            for pth, o in imgs:
                r = add_image(sl, pth)
                if r:
                    placed = (r, o)
                    break
        has_text = bool(paras_t or lists or quotes)
        if placed:
            (rid, iw, ih), o = placed
            cap = o.get("caption") if isinstance(o, dict) else None
            bx = LM + (int(RW * 0.46) if has_text else 0)
            bw = RW - (int(RW * 0.46) if has_text else 0)
            capH = 380000 if cap else 0
            bh = RH - capH
            sc = min(bw / float(iw), bh / float(ih))
            pw, ph = int(iw * sc), int(ih * sc)
            px = bx + (bw - pw) // 2
            py = top + (bh - ph) // 2
            sl.shape(px - 60000, py - 60000, pw + 120000, ph + 120000, P["tint"], "roundRect", adj=2500, name="Frame")
            sl.pic(px, py, pw, ph, rid, str(cap or s["head"]))
            if cap:
                sl.text(bx, py + ph + 110000, bw, 300000, para(str(cap), 11, P["muted"], italic=True, algn="ctr"), "t", "Caption")
            RWt = int(RW * 0.46) - 300000 if has_text else RW
        else:
            RWt = RW
        # text column
        if has_text:
            if paras_t:
                psz = fit(paras_t, RWt, int(RH * (0.3 if (lists or tables) else 0.9)), 26, 14, 150000)
                ph_ = int(sum(est_lines(t, psz, RWt) * psz * 1.22 * PT + 150000 for t in paras_t))
                sl.text(LM, y, RWt, ph_ + 60000, "".join(para(t, psz, "334155", after=11) for t in paras_t), "t", "Body")
                y += ph_ + 100000
            for q in quotes:
                qh = 1500000
                sl.shape(LM, y, 70000, qh, P["accent"], name="QuoteBar")
                qs = fit([q], RWt - 350000, qh, 26, 16)
                sl.text(LM + 280000, y, RWt - 280000, qh, para(q, qs, P["ink"], italic=True, font=HEAD), "ctr", "Quote")
                y += qh + 150000
            reserve = (int(len(tables[0][0]) * 14 * 2.3 * PT) + 250000) if (tables and tables[0][0]) else 0
            for kind, lst in lists:
                avail = bottom - reserve - y
                used = avail
                n = len(lst)
                lead = [split_lead(t) for t in lst]
                if kind == "numbered" and 2 <= n <= 6 and not placed:
                    rh_ = min(int(avail / n), 880000)
                    tsz = min(fit([("%s %s" % (a, b))], RWt - 1000000, rh_ - 40000, 26, 14) for a, b in lead)
                    for j, (a, b) in enumerate(lead):
                        ry = y + j * rh_
                        sl.shape(LM, ry + (rh_ - 560000) // 2, 560000, 560000, P["at"], "ellipse", para(str(j + 1), 18, "FFFFFF", True, algn="ctr", font=HEAD), "ctr", name="Step")
                        if j < n - 1:
                            sl.shape(LM + 275000, ry + (rh_ - 560000) // 2 + 560000, 10000, rh_ - 560000, P["soft"], name="Link")
                        body = (para(a, tsz, P["ink"], True) if a else "") + para(b, tsz - (1 if a else 0), "475569")
                        sl.text(LM + 800000, ry, RWt - 800000, rh_, body, "ctr", "StepText")
                    used = n * rh_
                elif kind == "bullets" and 2 <= n <= 4 and not placed and all(len(t) <= 130 for t in lst) and not paras_t:
                    cols = n if n <= 3 else 2
                    rows_ = -(-n // cols)
                    gap = 260000
                    cw_ = int((RWt - gap * (cols - 1)) / cols)
                    ch_ = int(min(avail, 3600000 if rows_ == 1 else 2000000 * rows_) / rows_) - (gap if rows_ > 1 else 0)
                    # Size the cards to their content (a tall, half-empty card looks unfinished), then sit the
                    # group slightly above the centre of the free space.
                    need_ = 0
                    for (a_, b_) in lead:
                        bs_ = fit([b_], cw_ - 440000, ch_ - 1000000, 22, 12)
                        cpl_ = max(6, int((cw_ - 440000) / 12700.0 / (bs_ * 0.5)))
                        ln_ = -(-len(b_) // cpl_) + (-(-len(a_) // max(6, int(cpl_ * 0.85))) if a_ else 0)
                        need_ = max(need_, 800000 + int(ln_ * (bs_ + 2) * 1.25 * 12700) + 300000)
                    ch_ = max(1500000, min(ch_, need_))
                    used_ = rows_ * ch_ + (rows_ - 1) * gap
                    y_off = max(0, int((avail - used_) * 0.35))
                    for j, (a, b) in enumerate(lead):
                        cx = LM + (j % cols) * (cw_ + gap)
                        cy = y + y_off + (j // cols) * (ch_ + gap)
                        acc = P["accent"] if j % 2 == 0 else P["accent2"]
                        acct = P["at"] if j % 2 == 0 else P["a2t"]
                        sl.shape(cx, cy, cw_, ch_, P["tint"], "roundRect", adj=4000, name="Card")
                        sl.shape(cx, cy + 200000, 70000, 520000, acc, name="CardAccent")
                        sl.text(cx + 220000, cy + 190000, 700000, 520000, para("%02d" % (j + 1), 22, acct, True, font=HEAD), "ctr", "Num")
                        tb = a if a else ""
                        bsz = fit([b], cw_ - 440000, ch_ - 1000000, 22, 12)
                        paras = (para(tb, bsz + 3, P["ink"], True, font=HEAD, after=6) if tb else "") + para(b, bsz, "475569")
                        sl.text(cx + 220000, cy + 800000, cw_ - 440000, ch_ - 900000, paras, "t", "CardText")
                    used = rows_ * ch_ + (rows_ - 1) * gap
                else:
                    gap = 90000
                    rh_ = min(int(avail / n), 820000)
                    tsz = min(fit([("%s %s" % (a, b))], RWt - 520000, rh_ - 30000, 26, 12) for a, b in lead)
                    for j, (a, b) in enumerate(lead):
                        ry = y + j * rh_
                        sl.shape(LM, ry + rh_ // 2 - 80000, 160000, 160000, P["accent"] if j % 2 == 0 else P["accent2"], "roundRect", adj=30000, name="Marker")
                        body = para(("**%s** %s" % (a, b)) if a else b, tsz, "334155")
                        sl.text(LM + 400000, ry, RWt - 400000, rh_, body, "ctr", "Row")
                    used = n * rh_
                y += used + 200000
        for rows, o in tables[:1]:
            rows = [list(r) for r in rows]
            if not rows:
                continue
            avail = bottom - y
            tsz = 20 if len(rows) <= 6 else 16
            while tsz > 10 and tsz * 2.3 * PT * len(rows) > avail:

            sl.table(LM, y, RW, rows, tsz)
        stamp_logo(sl, False)
        out_slides.append(sl)

# ───────────────────────── Quality check ─────────────────────────
# The model cannot look at a screenshot, so it reads this report instead. pdf(), docx() and pptx() print it
# automatically after every build; check("/workspace/file") can be run on any file again after a fix.

def _lum(hexs):
    def ch(v):
        v = int(v, 16) / 255.0
        return v / 12.92 if v <= 0.03928 else ((v + 0.055) / 1.055) ** 2.4
    return 0.2126 * ch(hexs[0:2]) + 0.7152 * ch(hexs[2:4]) + 0.0722 * ch(hexs[4:6])


def _contrast(a, b):
    la, lb = _lum(a), _lum(b)
    hi, lo = max(la, lb), min(la, lb)
    return (hi + 0.05) / (lo + 0.05)


_LEAK = re.compile(r"\*\*[^*\s][^*]*\*\*|(?:^|\n)\s*#{1,6}\s+\S|```|\[\[|\]\]")
_PLACE = re.compile(r"lorem ipsum|\bTBD\b|\bTODO\b|placeholder|\bXXX+\b|insert (?:name|text|date) here", re.I)


def _qa_pptx(path, issues, notes):
    import xml.etree.ElementTree as ET
    A = "{http://schemas.openxmlformats.org/drawingml/2006/main}"
    P = "{http://schemas.openxmlformats.org/presentationml/2006/main}"
    R = "{http://schemas.openxmlformats.org/officeDocument/2006/relationships}"
    z = zipfile.ZipFile(path)
    names = sorted([n for n in z.namelist() if re.match(r"ppt/slides/slide\d+\.xml$", n)], key=lambda n: int(re.sub(r"\D", "", n)))
    if not names:
        issues.append("The file has no slides.")
        return
    SW, SH = 12192000, 6858000
    m = re.search(r'<p:sldSz cx="(\d+)" cy="(\d+)"', z.read("ppt/presentation.xml").decode("utf8", "ignore"))
    if m:
        SW, SH = int(m.group(1)), int(m.group(2))
    sigs = []

    def idx_is_content(k):
        return k > 1

    for i, n in enumerate(names, 1):
        root = ET.fromstring(z.read(n))
        relp = n.replace("slides/", "slides/_rels/") + ".rels"
        rel_ids = set(re.findall(r'Id="([^"]+)"', z.read(relp).decode("utf8", "ignore"))) if relp in z.namelist() else set()
        bgn = root.find(".//" + P + "bg")
        bgc = "FFFFFF"
        if bgn is not None:
            c = bgn.find(".//" + A + "srgbClr")
            if c is not None:
                bgc = c.get("val")
        placed = []   # (x, y, cx, cy, fill)
        words, pics, texts, kinds = 0, 0, 0, []
        for el in root.iter():
            tag = el.tag
            if tag == P + "sp":
                nm = (el.find(".//" + P + "cNvPr").get("name") or "").strip()
                off, ext = el.find(".//" + A + "off"), el.find(".//" + A + "ext")
                if off is None or ext is None:
                    continue
                x, y, cx, cy = int(off.get("x")), int(off.get("y")), int(ext.get("cx")), int(ext.get("cy"))
                spPr = el.find(P + "spPr")
                fillc = None
                if spPr is not None:
                    sf = spPr.find(A + "solidFill")
                    if sf is not None and sf.find(A + "srgbClr") is not None:
                        fillc = sf.find(A + "srgbClr").get("val")
                big_deco = cx * cy > SW * SH * 0.5
                if "Deco" not in nm and not big_deco and (x < -SW * 0.02 or x + cx > SW * 1.02 or y + cy > SH * 1.02):
                    issues.append("Slide %d: '%s' runs off the slide edge." % (i, nm))
                paras = el.findall(".//" + A + "p")
                txt_all = "\n".join("".join(t.text or "" for t in p.iter(A + "t")) for p in paras).strip()
                if txt_all:
                    texts += 1
                    kinds.append(nm.split()[0] if nm else "x")
                    words += len(txt_all.split())
                    bp = el.find(".//" + A + "bodyPr")
                    li = int(bp.get("lIns", 91440)) if bp is not None else 91440
                    ri = int(bp.get("rIns", 91440)) if bp is not None else 91440
                    ti = int(bp.get("tIns", 45720)) if bp is not None else 45720
                    bi = int(bp.get("bIns", 45720)) if bp is not None else 45720
                    wpt = max(10.0, (cx - li - ri) / 12700.0)
                    need, minsz = 0.0, 999.0
                    for p in paras:
                        t = "".join(t.text or "" for t in p.iter(A + "t"))
                        szs = [int(r.get("sz")) / 100.0 for r in p.iter(A + "rPr") if r.get("sz")]
                        sz = max(szs) if szs else 18.0
                        if t.strip():
                            minsz = min(minsz, min(szs) if szs else 18.0)
                        cpl = max(4, int(wpt / (sz * 0.5)))
                        lines = sum(max(1, -(-len(part) // cpl)) for part in t.split("\n"))
                        sa = p.find(".//" + A + "spcAft/" + A + "spcPts")
                        need += lines * sz * 1.2 + (int(sa.get("val")) / 100.0 if sa is not None else 0)
                    have = (cy - ti - bi) / 12700.0
                    if need > have * 1.12 + 4:
                        issues.append("Slide %d: text in '%s' is too long for its box (needs about %d pt of height, has %d). Shorten it or move part to another slide." % (i, nm, need, have))
                    if minsz < 11 and "Footer" not in nm and "PageNo" not in nm:
                        issues.append("Slide %d: text in '%s' is only %d pt, too small to read when presented. Use fewer words." % (i, nm, minsz))
                    if _LEAK.search(txt_all):
                        issues.append("Slide %d: raw markdown symbols (** or #) are showing in '%s'." % (i, nm))
                    if _PLACE.search(txt_all):
                        issues.append("Slide %d: placeholder text found in '%s'. Write the real content." % (i, nm))
                    # contrast against what is really behind the text
                    cxm, cym = x + cx // 2, y + cy // 2
                    back = fillc
                    if not back:
                        for (px, py, pw, ph, pf) in reversed(placed):
                            if pf and px <= cxm <= px + pw and py <= cym <= py + ph:
                                back = pf
                                break
                    back = back or bgc
                    for r in el.iter(A + "rPr"):
                        c = r.find(".//" + A + "srgbClr")
                        if c is not None:
                            if _contrast(c.get("val"), back) < 3.0:
                                issues.append("Slide %d: text colour #%s is hard to read on #%s in '%s'." % (i, c.get("val"), back, nm))
                                break
                if txt_all and idx_is_content(i) and y + cy > SH - 480000 and not any(k in nm for k in ("Footer", "PageNo", "Deco")):
                    issues.append("Slide %d: '%s' runs into the footer. Shorten the text or split the slide." % (i, nm))
                placed.append((x, y, cx, cy, fillc))
            elif tag == P + "pic":
                pics += 1
                bl = el.find(".//" + A + "blip")
                rid = bl.get(R + "embed") if bl is not None else None
                if rid not in rel_ids:
                    issues.append("Slide %d: a picture is missing from the file." % i)
                off, ext = el.find(".//" + A + "off"), el.find(".//" + A + "ext")
                if off is not None and ext is not None and int(off.get("y")) + int(ext.get("cy")) > SH * 1.01:
                    issues.append("Slide %d: a picture runs off the bottom of the slide." % i)
            elif tag == P + "graphicFrame":
                kinds.append("table")
                off, ext = el.find(".//" + P + "xfrm/" + A + "off"), el.find(".//" + P + "xfrm/" + A + "ext")
                if off is not None and ext is not None and int(off.get("y")) + int(ext.get("cy")) > SH - 520000:
                    issues.append("Slide %d: the table runs into the footer or off the slide. Use fewer rows per slide." % i)
                for t in el.iter(A + "t"):
                    words += len((t.text or "").split())
                    if _LEAK.search(t.text or ""):
                        issues.append("Slide %d: raw markdown symbols are showing in the table." % i)
                        break
        if words > 95:
            issues.append("Slide %d has %d words. Slides should hold about 60 or fewer. Split it or cut the text." % (i, words))
        if texts == 0 and pics == 0 and "graphicFrame" not in z.read(n).decode("utf8", "ignore"):
            issues.append("Slide %d is empty." % i)
        sigs.append(tuple(sorted(kinds)))
    if len(names) >= 6 and len(set(sigs[1:])) == 1:
        notes.append("every slide uses the same layout; vary it with a table, numbered steps or a picture where the content suits it")
    if len(names) == 1:
        notes.append("only one slide")


def _qa_docx(path, issues, notes):
    import xml.etree.ElementTree as ET
    W = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
    z = zipfile.ZipFile(path)
    root = ET.fromstring(z.read("word/document.xml"))
    rels = z.read("word/_rels/document.xml.rels").decode("utf8", "ignore") if "word/_rels/document.xml.rels" in z.namelist() else ""
    ids = set(re.findall(r'Id="([^"]+)"', rels))
    blank, run_blank, heads, words = 0, 0, 0, 0
    for p in root.iter(W + "p"):
        t = "".join(x.text or "" for x in p.iter(W + "t"))
        has_obj = any(True for _ in p.iter("{http://schemas.openxmlformats.org/drawingml/2006/main}blip"))
        st = p.find(W + "pPr/" + W + "pStyle")
        if st is not None and (st.get(W + "val") or "").lower().startswith(("heading", "title")):
            heads += 1
        if not t.strip() and not has_obj:
            run_blank += 1
            if run_blank == 4:
                blank += 1
        else:
            run_blank = 0
            words += len(t.split())
        if _LEAK.search(t):
            issues.append("Raw markdown symbols (** or #) are showing in the text: '%s'." % t.strip()[:50])
            break
        if _PLACE.search(t):
            issues.append("Placeholder text found: '%s'. Write the real content." % t.strip()[:50])
            break
        if "could not be added" in t:
            issues.append("A picture failed to load: '%s'." % t.strip()[:80])
    if blank:
        issues.append("There are long runs of empty paragraphs. Use spacing or a page break instead.")
    for emb in re.findall(r'r:embed="([^"]+)"', z.read("word/document.xml").decode("utf8", "ignore")):
        if emb not in ids:
            issues.append("A picture is missing from the file.")
            break
    if words > 350 and heads == 0:
        issues.append("A long document with no headings. Add a title and section headings.")
    if words < 5:
        issues.append("The document has almost no text.")


def _qa_pdf(path, issues, notes):
    data = open(path, "rb").read()
    if not data.startswith(b"%PDF"):
        issues.append("This is not a valid PDF.")
        return
    streams = [s for s in re.findall(rb"stream\n(.*?)\nendstream", data, re.S) if b" Tj" in s]
    if not streams:
        notes.append("no text layer found to check (a scanned or image-only PDF)")
        return
    alltext = []
    for pn, s in enumerate(streams, 1):
        ys = [float(y) for x, y in re.findall(rb"([\d.]+) ([\d.]+) Td \(", s) if float(y) > 40]
        xs = [float(x) for x, y in re.findall(rb"([\d.]+) ([\d.]+) Td \(", s)]
        alltext.append(b"".join(re.findall(rb"\(((?:\\.|[^\\)])*)\) Tj", s)).decode("latin-1"))
        if xs and max(xs) > 560:
            issues.append("Page %d: text runs past the right margin." % pn)
        if pn == len(streams) and len(streams) > 1 and ys and (max(ys) - min(ys)) < 60:
            issues.append("The last page holds only a few lines. Tighten the content so it ends cleanly, or add what is missing.")
        if not ys:
            issues.append("Page %d has no body text." % pn)
    joined = "\n".join(alltext)
    if _LEAK.search(joined.replace("\\", "")):
        issues.append("Raw markdown symbols (** or #) are showing in the text.")
    if _PLACE.search(joined):
        issues.append("Placeholder text found. Write the real content.")
    if "could not be added" in joined:
        issues.append("A picture failed to load.")


def _qa_img(path, issues, notes):
    try:
        from PIL import Image, ImageStat
    except Exception:
        notes.append("picture checks need Pillow")
        return
    im = Image.open(path).convert("RGB")
    w, h = im.size
    if w < 600:
        issues.append("The picture is only %d px wide. Save charts with dpi=150 or more." % w)
    if sum(ImageStat.Stat(im).stddev) / 3.0 < 3:
        issues.append("The picture looks blank.")
        return
    bg = im.getpixel((0, 0))
    def far(px):
        return sum(abs(px[k] - bg[k]) for k in range(3)) > 90
    for name, box in (("left", (0, 0, 2, h)), ("right", (w - 2, 0, w, h)), ("top", (0, 0, w, 2)), ("bottom", (0, h - 2, w, h))):
        strip = list(im.crop(box).getdata())
        if strip and sum(1 for px in strip if far(px)) / float(len(strip)) > 0.04:
            issues.append("Content touches or is cut off at the %s edge. Use bbox_inches='tight' with pad_inches=0.3, or leave more margin." % name)
            break


def _qa_xlsx(path, issues, notes):
    z = zipfile.ZipFile(path)
    sheets = [n for n in z.namelist() if re.match(r"xl/worksheets/sheet\d+\.xml$", n)]
    if not sheets:
        issues.append("The workbook has no sheets.")
        return
    shared = z.read("xl/sharedStrings.xml").decode("utf8", "ignore") if "xl/sharedStrings.xml" in z.namelist() else ""
    for n in sheets:
        x = z.read(n).decode("utf8", "ignore")
        if "<c " not in x:
            issues.append("%s is empty." % n.split("/")[-1])
        if "<cols>" not in x:
            issues.append("%s has no column widths set, so text will look cramped. Set ws.column_dimensions widths." % n.split("/")[-1])
        if re.search(r't="e"', x) or re.search(r"#(?:DIV/0!|REF!|NAME\?|VALUE!|N/A)", shared):
            issues.append("%s contains formula errors (#REF!, #DIV/0! and so on)." % n.split("/")[-1])


# ───────────────────────── Taste ─────────────────────────
# check() also scores how a file LOOKS (not just whether it is broken): out of 100, failing below 78.
# The rules are measurable ones: hierarchy, margins, alignment, whitespace, balance, colour, rhythm, word count,
# filler wording and stretched pictures. Every penalty comes with the fix. The same pass draws a small picture
# of the pages (slides, Word and PDF) into /workspace/.cognita-taste/preview.jpg so a vision model can review it.

_TASTE_PASS = 78
_FILLER = re.compile(
    r"in today'?s (?:fast[- ]paced|digital|ever[- ]changing)|\bdelve\b|\bleverag(?:e|es|ing)\b|\bsynerg(?:y|ies)\b|game[- ]changer|"
    r"unlock the (?:power|potential)|it is (?:important|worth) to note|in conclusion|cutting[- ]edge|\bseamless(?:ly)?\b|\brobust\b|"
    r"\bholistic\b|\btapestry\b|rich landscape|ever[- ]evolving|at the end of the day|navigate the complexities|\bcomprehensive solution", re.I)


def _t_filler(text, where, pen):
    hits = sorted(set(m.group(0).lower() for m in _FILLER.finditer(text)))
    if hits:
        pen.append((min(16, 4 * len(hits)), "%s uses filler wording (%s). Say the plain thing instead." % (where, ", ".join(hits[:4]))))


def _img_size(data):
    """Pixel size of a PNG or JPEG without any library."""
    try:
        if data[:8] == b"\x89PNG\r\n\x1a\n":
            return struct.unpack(">II", data[16:24])
        if data[:2] == b"\xff\xd8":
            i = 2
            while i < len(data) - 9:
                if data[i] != 0xFF:
                    i += 1
                    continue
                mk = data[i + 1]
                if mk in (0xC0, 0xC1, 0xC2):
                    h, w = struct.unpack(">HH", data[i + 5:i + 9])
                    return w, h
                i += 2 + struct.unpack(">H", data[i + 2:i + 4])[0]
    except Exception:
        pass
    return None


def _slide_model(path):
    import xml.etree.ElementTree as ET
    A = "{http://schemas.openxmlformats.org/drawingml/2006/main}"
    P = "{http://schemas.openxmlformats.org/presentationml/2006/main}"
