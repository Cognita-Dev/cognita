<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/js-flag.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment not completed — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="payment-page">

<div class="payment-shell">
  <img src="/assets/cognita.png" alt="Cognita" class="payment-logo">

  <div class="payment-status">

    <h1>Payment not completed</h1>
    <p>Your card wasn't charged. You can try again whenever you're ready — no changes have been made to your account.</p>

</div>

<script src="/js/page-chrome.js" defer></script>
