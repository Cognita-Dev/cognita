<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin · Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body class="app-page admin-page">

<div class="admin-shell">
  <div class="admin-nav-scrim" id="adminNavScrim"></div>

  <!-- ── Sidebar ── -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-top">
      <a href="/index.html" class="sidebar-logo">
        <img src="/assets/cognita.png" alt="Cognita">
        <span>Cognita Admin</span>
      </a>
      <button class="admin-nav-close" id="adminNavClose" aria-label="Close menu"><i class="ph ph-x"></i></button>
    </div>

    <nav class="admin-nav" aria-label="Admin sections">
      <div class="admin-nav-label">Learna</div>
      <button class="admin-nav-item is-active" data-section="courses" aria-current="page">
        <i class="ph ph-graduation-cap"></i><span>Courses</span>
      </button>
      <button class="admin-nav-item" data-section="reviews">
        <i class="ph ph-clipboard-text"></i><span>Task reviews</span>
      </button>
      <div class="admin-nav-label" id="peopleNavLabel" hidden>Access</div>
      <button class="admin-nav-item" data-section="roles" id="rolesNavItem" hidden>
        <i class="ph ph-users-three"></i><span>People</span>
      </button>
      <div class="admin-nav-spacer"></div>
      <a href="/app.html" class="admin-nav-item admin-nav-item--ai">
        <i class="ph ph-chat-circle"></i><span>Back to chat</span>
        <span class="admin-nav-pill" id="aiChatPill" hidden>Unlimited</span>
      </a>
    </nav>

    <div class="admin-sidebar-bottom">
      <div class="account-menu" id="accountMenu">
        <a href="/account.html"><i class="ph ph-gear"></i> Settings</a>
        <button id="logOutBtn"><i class="ph ph-sign-out"></i> Sign out</button>
      </div>
      <button class="account-btn" id="accountBtn" aria-haspopup="true" aria-expanded="false" aria-controls="accountMenu">
        <span class="account-avatar" id="accountAvatar">C</span>
        <span class="account-info">
          <span class="account-name" id="accountEmail">Loading</span>
          <span class="account-plan" id="accountRoleBadge">Loading</span>
        </span>
        <i class="ph ph-dots-three-vertical account-menu-trigger" aria-hidden="true"></i>
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="admin-main">
    <header class="admin-topbar">
      <button class="admin-nav-open" id="adminNavOpen" aria-label="Open menu"><i class="ph ph-list"></i></button>
      <div class="admin-topbar-title">
        <h1 id="sectionTitle">Courses</h1>
        <p id="sectionSubtitle" class="admin-topbar-subtitle">Create, edit, publish and unpublish Learna courses without touching code.</p>
      </div>
    </header>

    <div class="admin-scroll">

      <!-- ══════════════════ LEARNA COURSES ══════════════════ -->
      <section class="admin-section is-active" id="section-courses"><div class="admin-panel" id="acRoot"><p>Loading courses</p></div></section>
      <!-- ══════════════════ LEARNA TASK REVIEWS ══════════════════ -->
      <section class="admin-section" id="section-reviews"><div class="admin-panel" id="arRoot"><p>Loading tasks</p></div></section>

      <!-- ══════════════════ ROLES ══════════════════ -->
      <section class="admin-section" id="section-roles">
        <div class="admin-panel">
          <div class="admin-panel-head">
            <h2>Admins &amp; moderators</h2>
            <p class="admin-panel-sub">People who can manage Cognita's learning content.</p>
          </div>
          <div class="admin-people-list" id="rolesList">
            <div class="admin-person-row" aria-hidden="true">
              <span class="skeleton" style="width:34px;height:34px;border-radius:50%;"></span>
              <div class="admin-person-info"><span class="skeleton" style="display:block;width:50%;height:12px;"></span></div>
              <span class="skeleton" style="width:70px;height:20px;border-radius:var(--radius-full);"></span>
            </div>
          </div>
        </div>

        <div class="admin-panel">
          <div class="admin-panel-head">
            <h2>Grant a role</h2>
          </div>

          <div class="admin-segmented admin-segmented--sm" id="grantLookupSegmented">
            <label class="admin-segmented-option is-active">
              <input type="radio" name="grantLookupMode" value="email" checked>
              <span>By email</span>
            </label>
            <label class="admin-segmented-option">
              <input type="radio" name="grantLookupMode" value="uid">
              <span>By uid</span>
            </label>
          </div>

          <div class="admin-field-grid">
            <label class="admin-field" id="grantEmailWrap">
              <span>User's email</span>
              <input type="email" id="grantEmailInput" placeholder="person@example.com">
            </label>

            <label class="admin-field" id="grantUidWrap" hidden>
              <span>User's uid</span>
              <input type="text" id="grantUidInput" placeholder="Firebase uid">
            </label>

            <label class="admin-field">
              <span>Role</span>
              <select id="grantRoleSelect" class="admin-select">
                <option value="moderator">Moderator</option>
                <option value="admin">Admin</option>
              </select>
            </label>
          </div>

          <button class="admin-btn admin-btn--primary" id="grantRoleBtn">
            <i class="ph ph-user-plus"></i><span>Grant role</span>
          </button>
          <p id="grantResultLine" class="admin-hint admin-result-line" role="status" aria-live="polite"></p>
        </div>
      </section>

    </div>
  </main>

</div>

<!-- ══════════════════ CONFIRM DIALOG ══════════════════
     One in-app dialog used for every destructive/discard confirmation,
     replacing the browser's native confirm() boxes. -->
<div class="admin-confirm-scrim" id="confirmScrim" hidden>
  <div class="admin-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmBody"></p>
    <div class="admin-confirm-actions">
      <button type="button" class="admin-btn admin-btn--ghost" id="confirmCancelBtn">Cancel</button>
      <button type="button" class="admin-btn admin-btn--danger-solid" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script type="module" src="/js/admin.js"></script>
<script type="module" src="/js/admin-courses.js"></script>
</body>
</html>
