<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment received — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/payment.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body class="payment-page">

<div class="payment-shell">
  <img src="/assets/cognita.png" alt="Cognita" class="payment-logo">

  <div class="payment-status" id="paymentStatus">
    <span class="btn-spinner btn-spinner--dark"></span>
    <h1>Confirming your payment…</h1>
    <p>This usually takes just a few seconds.</p>
  </div>
</div>

<script type="module" src="/js/auth.js"></script>
<script type="module">
  const WORKER_URL = 'https://api.cognita.com.ng';

  const statusEl = document.getElementById('paymentStatus');
  const params = new URLSearchParams(window.location.search);
  // Only safe characters are kept: the reference is shown in messages below.
  const reference = (params.get('reference') || params.get('trxref') || '').replace(/[^A-Za-z0-9.=-]/g, '');

  const MAX_ATTEMPTS = 12;   // ~24 seconds of polling
  const POLL_INTERVAL_MS = 2000;

  function showSuccess(planName) {
    statusEl.innerHTML =
      '<i class="ph ph-check-circle" style="font-size:2.5rem;color:var(--success);"></i>' +
      '<h1>You\'re on ' + planName + '</h1>' +
      '<p>Your plan is active. Enjoy the extra room to work.</p>' +
      '<a href="/app.html" class="payment-retry-btn payment-retry-btn--primary">Go to Cognita</a>';
  }

  function showPending() {
    statusEl.innerHTML =
      '<i class="ph ph-clock" style="font-size:2.5rem;color:var(--warning);"></i>' +
      '<h1>Almost there</h1>' +
      '<p>Your payment is still being confirmed. You can check back in your account in a minute. If your plan has not appeared after a few minutes, contact support.</p>' +
      '<a href="/account.html" class="payment-retry-btn">Go to account</a>';
  }

  function showError(message) {
    statusEl.innerHTML =
      '<i class="ph ph-warning-circle" style="font-size:2.5rem;color:var(--danger);"></i>' +
      '<h1>Something went wrong</h1>' +
      '<p>' + message + '</p>' +
      '<a href="/pricing.html" class="payment-retry-btn">Back to plans</a>';
  }

  const user = await window.Auth.requireAuthOrRedirect();
  if (!user) throw new Error('redirecting to login');

  if (!reference) {
    showError('No payment reference was found. If you completed a payment, check your account page in a minute.');
  } else {
    let attempts = 0;

    // Ask the server about THIS payment reference. The server checks its own
    // records and, if the webhook is late, asks Paystack directly. We never
    // trust the redirect itself, and we never confuse this payment with a
    // plan the person already had.
    async function pollAccount() {
      attempts++;
      try {
        const res = await window.Auth.authedFetch(
          WORKER_URL + '/api/payment/status?reference=' + encodeURIComponent(reference)
        );
        const data = await res.json();

        if (res.ok && data.status === 'success') {
          showSuccess(data.planName);
          return;
        }
        if (res.ok && data.status === 'failed') {
          showError('This payment was not completed, so you have not been charged. You can try again from the plans page.');
          return;
        }
        if (res.ok && data.status === 'review') {
          showError('Your payment was received but needs a quick manual check before your plan can be activated. Please contact support and quote reference ' + reference + '.');
          return;
        }
        if (res.status === 404 || res.status === 400) {
          showError('We could not find this payment. If you were charged, please contact support and quote reference ' + reference + '.');
          return;
        }
      } catch (e) {
        console.error('[payment-success] poll error:', e.message);
      }

      if (attempts >= MAX_ATTEMPTS) {
        showPending();
        return;
      }

      setTimeout(pollAccount, POLL_INTERVAL_MS);
    }

    pollAccount();
  }
</script>

</body>
</html>
