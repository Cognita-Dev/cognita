<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/account.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body class="account-page">

<header class="account-topbar">
  <a href="/app.html" class="account-back">
    <i class="ph ph-arrow-left"></i> Back to Cognita
  </a>
</header>

<main class="account-shell">
  <h1 class="account-page-title">Account</h1>

  <!-- ── Plan ── -->
  <div class="settings-group-label">Plan</div>
  <div class="settings-group">
    <div class="settings-row">
      <div class="settings-row-text">
        <span class="settings-row-label" id="planStatusLine">Loading…</span>
      </div>
      <a href="/pricing.html" class="settings-row-cta" id="planActionBtn">
        View plans <i class="ph ph-caret-right"></i>
      </a>
    </div>
    <button class="settings-row settings-row--button settings-row--danger" id="cancelPlanBtn" hidden>
      <span class="settings-row-text">
        <span class="settings-row-label">Cancel subscription</span>
      </span>
      <i class="ph ph-caret-right"></i>
    </button>
  </div>

  <!-- ── Usage: Chat ── -->
  <div class="settings-group-label">Today's usage — Chat</div>
  <div class="settings-group" id="usageDetailGrid">
    <div class="settings-row skeleton" style="height:52px;"></div>
    <div class="settings-row skeleton" style="height:52px;"></div>
    <div class="settings-row skeleton" style="height:52px;"></div>
    <div class="settings-row skeleton" style="height:52px;"></div>
  </div>

  <!-- ── Usage: Resources ── -->
  <div class="settings-group-label">Today's usage — Resources</div>
  <div class="settings-group" id="usageResourcesGrid">
    <div class="settings-row skeleton" style="height:52px;"></div>
  </div>

  <p class="settings-footnote">Usage resets daily at midnight UTC.</p>

  <!-- ── Account details ── -->
  <div class="settings-group-label">Account details</div>
  <div class="settings-group">
    <div class="settings-row">
      <span class="settings-row-label">Email</span>
      <span class="settings-row-value" id="detailEmail">—</span>
    </div>
  </div>

  <!-- ── Sign out ── -->
  <div class="settings-group-label">Session</div>
  <div class="settings-group">
    <button class="settings-row settings-row--button settings-row--danger" id="signOutBtn">
      <span class="settings-row-label"><i class="ph ph-sign-out"></i> Sign out</span>
    </button>
  </div>
  <p class="settings-footnote">You'll need to sign in again to use Cognita.</p>
</main>

<script type="module" src="/js/auth.js"></script>
<script type="module">
  const WORKER_URL = 'https://cognita.cognitai.workers.dev';

  const user = await window.Auth.requireAuthOrRedirect();
  if (!user) throw new Error('redirecting');

  document.getElementById('detailEmail').textContent = user.email || '—';

  const USAGE_ICONS = {
    messages: 'ph-chat-circle',
    advancedModel: 'ph-brain',
    imageGen: 'ph-image',
    documentGen: 'ph-file-text',
    resourceGen: 'ph-graduation-cap',
  };
  const USAGE_LABELS = {
    messages: 'Messages',
    advancedModel: 'Advanced model',
    imageGen: 'Images',
    documentGen: 'Documents',
    resourceGen: 'Generated resources',
  };

  function usageRow(key, used, limit) {
    const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
    const barClass = pct >= 100 ? 'is-at-limit' : pct >= 70 ? 'is-near-limit' : '';
    return (
      '<div class="settings-row settings-row--usage">' +
        '<i class="ph ' + USAGE_ICONS[key] + '"></i>' +
        '<div class="settings-row-usage-text">' +
          '<div class="settings-row-usage-top">' +
            '<span class="settings-row-label">' + USAGE_LABELS[key] + '</span>' +
            '<span class="settings-row-usage-count">' + used + ' <span>/ ' + limit + '</span></span>' +
          '</div>' +
          '<div class="usage-bar"><div class="usage-bar-fill ' + barClass + '" style="width:' + pct + '%;"></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  async function loadAccount() {
    try {
      const res = await window.Auth.authedFetch(WORKER_URL + '/api/account');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load account.');

      const statusLabel = {
        active: 'Active',
        past_due: 'Payment issue — grace period',
        cancelled: 'Cancelled — active until ' + formatDate(data.periodEnd),
        expired: 'Expired',
        none: 'Free plan',
      }[data.status] || data.status;

      document.getElementById('planStatusLine').textContent = data.planName + ' — ' + statusLabel;

      const actionBtn = document.getElementById('planActionBtn');
      const cancelBtn = document.getElementById('cancelPlanBtn');

      if (data.planId !== 'free' && data.status === 'active') {
        actionBtn.innerHTML = 'Change plan <i class="ph ph-caret-right"></i>';
        cancelBtn.hidden = false;
      } else if (data.status === 'cancelled') {
        cancelBtn.hidden = true;
        actionBtn.innerHTML = 'Resubscribe <i class="ph ph-caret-right"></i>';
      } else {
        cancelBtn.hidden = true;
        actionBtn.innerHTML = 'View plans <i class="ph ph-caret-right"></i>';
      }
    } catch (e) {
      document.getElementById('planStatusLine').textContent = 'Could not load plan details.';
      console.error('[account] ' + e.message);
    }
  }

  async function loadUsage() {
    try {
      const res = await window.Auth.authedFetch(WORKER_URL + '/api/usage');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load usage.');

      const u = data.usage;

      document.getElementById('usageDetailGrid').innerHTML =
        usageRow('messages', u.messages.used, u.messages.limit) +
        usageRow('advancedModel', u.advancedModel.used, u.advancedModel.limit) +
        usageRow('imageGen', u.imageGen.used, u.imageGen.limit) +
        usageRow('documentGen', u.documentGen.used, u.documentGen.limit);

      // Resources usage lives in its own grouped section so it reads as
      // a distinct category rather than being mixed in with chat usage.
      document.getElementById('usageResourcesGrid').innerHTML =
        usageRow('resourceGen', u.resourceGen.used, u.resourceGen.limit);
    } catch (e) {
      const errorHtml = '<p style="color:var(--text-3); padding: var(--space-4);">Could not load usage details.</p>';
      document.getElementById('usageDetailGrid').innerHTML = errorHtml;
      document.getElementById('usageResourcesGrid').innerHTML = errorHtml;
      console.error('[account] ' + e.message);
    }
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await window.Auth.logOut();
    window.location.href = '/login.html';
  });

  document.getElementById('cancelPlanBtn').addEventListener('click', async () => {
    const confirmed = confirm(
      'Cancel your subscription? You\'ll keep access until the end of your current billing period, then move to the Free plan.'
    );
    if (!confirmed) return;

    const btn = document.getElementById('cancelPlanBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="settings-row-label">Cancelling…</span>';

    try {
      const res = await window.Auth.authedFetch(WORKER_URL + '/api/subscription/cancel', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not cancel subscription.');

      alert(data.message);
      loadAccount();
    } catch (e) {
      alert('Something went wrong: ' + e.message);
      btn.disabled = false;
      btn.innerHTML = '<span class="settings-row-label">Cancel subscription</span><i class="ph ph-caret-right"></i>';
    }
  });

  loadAccount();
  loadUsage();
</script>

</body>
</html>
