<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Resources · Cognita</title>
<link rel="icon" href="/assets/cognita.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/resources.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body class="app-page">

<div class="app-shell">

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ── Sidebar — same structure as app.html, with Resources added and active ── -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-top">
      <a href="/index.html" class="sidebar-logo">
        <img src="/assets/cognita.png" alt="Cognita">
        <span>Cognita</span>
      </a>
      <div class="sidebar-top-actions">
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
          <i class="ph ph-sidebar-simple"></i>
        </button>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar">
          <i class="ph ph-x"></i>
        </button>
      </div>
    </div>

    <a href="/app.html" class="new-chat-btn">
      <i class="ph ph-chat-circle"></i>
      <span>Back to chat</span>
    </a>

    <nav class="sidebar-history" aria-label="Navigation">
      <a href="/app.html" class="sidebar-history-item">
        <i class="ph ph-chat-circle" style="margin-right:8px;"></i>
        <span>Chat</span>
      </a>
      <a href="/resources.html" class="sidebar-history-item is-active">
        <i class="ph ph-graduation-cap" style="margin-right:8px;"></i>
        <span>Resources</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="usage-widget" id="usageWidget">
        <div class="usage-row">
          <span class="usage-label">Resources today</span>
          <span class="usage-value skeleton" id="usageResources">00 / 00</span>
        </div>
        <div class="usage-bar"><div class="usage-bar-fill" id="usageResourcesBar"></div></div>
      </div>

      <button class="account-btn" id="accountBtn">
        <span class="account-avatar" id="accountAvatar">C</span>
        <span class="account-info">
          <span class="account-name skeleton" id="accountEmail">Loading</span>
          <span class="account-plan skeleton" id="accountPlan">Loading</span>
        </span>
        <i class="ph ph-dots-three-vertical account-menu-trigger"></i>
      </button>

      <div class="account-menu" id="accountMenu" hidden>
        <a href="/account.html"><i class="ph ph-gear"></i> Settings</a>
        <a href="/pricing.html"><i class="ph ph-arrow-up-circle"></i> Plans</a>
        <button id="logOutBtn"><i class="ph ph-sign-out"></i> Sign out</button>
      </div>
    </div>
  </aside>

  <!-- ── Main Resources area ── -->
  <main class="app-main">

    <header class="app-topbar">
      <button class="mobile-sidebar-btn" id="mobileSidebarBtn" aria-label="Open sidebar">
        <i class="ph ph-list"></i>
      </button>
      <h1 class="conversation-title">Resources</h1>
      <div class="topbar-spacer"></div>
    </header>

    <div class="resources-scroll">

      <!-- ── Generation panel ── -->
      <section class="resources-generate-panel" id="resourcesGeneratePanel">
        <h2 class="resources-heading">What do you need to create?</h2>
        <p class="resources-subheading">Choose a resource type, fill in a few details, and Cognita builds it.</p>

        <div class="resource-type-grid" id="resourceTypeGrid">
          <!-- Populated by resources.js from RECIPE_LABELS-equivalent list -->
        </div>

        <form class="resource-form" id="resourceForm" hidden>
          <button type="button" class="resource-form-back" id="resourceFormBack">
            <i class="ph ph-arrow-left"></i> Choose a different type
          </button>

          <h3 class="resource-form-title" id="resourceFormTitle">Lesson Plan</h3>

          <label class="resource-field">
            <span>Subject</span>
            <input type="text" id="fieldSubject" placeholder="e.g. Biology" required>
          </label>

          <label class="resource-field">
            <span>Class</span>
            <input type="text" id="fieldClassLevel" placeholder="e.g. SS2" required>
          </label>

          <label class="resource-field" id="topicFieldWrap">
            <span>Topic</span>
            <input type="text" id="fieldTopic" placeholder="e.g. Photosynthesis" required>
          </label>

          <label class="resource-field" id="durationFieldWrap" hidden>
            <span>Duration</span>
            <input type="text" id="fieldDuration" placeholder="e.g. 40 minutes">
          </label>

          <label class="resource-field" id="questionCountFieldWrap" hidden>
            <span>Number of questions</span>
            <input type="number" id="fieldQuestionCount" placeholder="10" min="1" max="50">
          </label>

          <label class="resource-field" id="termFieldWrap" hidden>
            <span>Term</span>
            <input type="text" id="fieldTerm" placeholder="e.g. First Term">
          </label>

          <label class="resource-field" id="weekCountFieldWrap" hidden>
            <span>Number of weeks</span>
            <input type="number" id="fieldWeekCount" placeholder="12" min="1" max="20">
          </label>

          <label class="resource-field">
            <span>Curriculum (optional)</span>
            <input type="text" id="fieldCurriculum" placeholder="e.g. Nigerian Curriculum">
          </label>

          <button type="submit" class="resource-generate-btn" id="resourceGenerateBtn">
            <span class="btn-label">Generate resource</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>
      </section>

      <!-- ── Result preview ── -->
      <section class="resources-result-panel" id="resourcesResultPanel" hidden>
        <div class="resource-result-header">
          <h2 id="resourceResultTitle">Your resource</h2>
          <button class="resource-result-close" id="resourceResultClose" aria-label="Close preview">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <div class="resource-result-body" id="resourceResultBody"></div>
        <div class="resource-result-actions">
          <button class="resource-download-btn" id="resourceDownloadBtn">
            <i class="ph ph-file-arrow-down"></i>
            <span>Download DOCX</span>
          </button>
        </div>
      </section>

      <!-- ── My Resources list ── -->
      <section class="my-resources-panel">
        <h2 class="resources-heading">My Resources</h2>
        <div class="my-resources-list" id="myResourcesList">
          <div class="my-resources-empty">Your generated resources will appear here.</div>
        </div>
      </section>

    </div>
  </main>
</div>

<script type="module" src="/js/auth.js"></script>
<script type="module" src="/js/resources.js"></script>

</body>
</html>
