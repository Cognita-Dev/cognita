<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognita preview</title>
<!--
  Live preview page for web pages the assistant builds. It is only ever loaded inside
  <iframe sandbox="allow-scripts" src="/preview-frame"> (see js/app.js). That means:
    - it has an opaque origin: no cookies, no storage, no access to the Cognita page;
    - its own Content-Security-Policy (set for this path in vercel.json) lets the
      page run its own scripts and styles but blocks EVERY network request, so a
      model-written page cannot send anything anywhere;
    - the parent sends it one message with the page's HTML, and it writes it in.
  Nothing here is a secret, a token or a key.
-->
<style>html,body{margin:0;height:100%;background:#fff;color:#555;font:14px system-ui,sans-serif}p{padding:16px}</style>
</head>
<body><p>Loading preview…</p>
<script>
(function () {
  var done = false;
  window.addEventListener('message', function (ev) {
    if (done || ev.source !== parent) return;
    var m = ev.data;
    if (!m || m.t !== 'html' || typeof m.html !== 'string' || m.html.length > 250000) return;
    done = true;
    document.open(); document.write(m.html); document.close();
  });
  try { parent.postMessage({ t: 'preview-ready' }, '*'); } catch (e) {}
})();
</script>
</body>
</html>
